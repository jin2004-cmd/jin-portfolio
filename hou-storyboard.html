  .hero-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,15,22,.55) 0%,rgba(11,15,22,.82) 62%,var(--bg) 100%)}
  .hero-inner{position:relative;max-width:880px;z-index:1}
  .hero .kicker{display:inline-block;font-size:13px;letter-spacing:.42em;color:var(--sub);border:1px solid var(--line);border-radius:2px;padding:6px 18px 6px 24px;margin-bottom:26px;text-transform:uppercase}
  .hero h1{font-size:clamp(64px,12vw,128px);font-weight:900;letter-spacing:.14em;line-height:1.05;color:var(--text)}
  .hero h1 .v{color:var(--blue)}
  .hero .subtitle{margin-top:18px;font-size:17px;color:var(--sub);letter-spacing:.18em}
  .hero .meta{margin-top:34px;display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
  .hero .meta span{font-size:13px;color:var(--text);background:rgba(18,25,36,.72);border:1px solid var(--line);border-radius:99px;padding:7px 16px;backdrop-filter:blur(4px)}
  .scroll-hint{margin-top:44px;font-size:12px;color:var(--weak);letter-spacing:.3em}

  /* ===== 布局容器 ===== */
  .wrap{max-width:960px;margin:0 auto;padding:0 20px}

  /* ===== 概览时间轴 ===== */
  .overview{padding:56px 0 20px}
  .section-title{font-size:26px;font-weight:700;margin-bottom:6px;letter-spacing:.08em}
  .section-title .no{color:var(--blue);font-size:14px;letter-spacing:.3em;display:block;margin-bottom:8px}
  .section-desc{color:var(--sub);font-size:14px;margin-bottom:28px}
  .timeline{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 18px}
  .t-start,.t-end{font-size:12px;color:var(--weak);white-space:nowrap;font-variant-numeric:tabular-nums}
  .t-track{flex:1;display:flex;height:56px;border-radius:6px;overflow:hidden;margin:0 12px}
  .t-seg{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:12px;line-height:1.5;cursor:pointer;transition:filter .2s}
  .t-seg:hover{filter:brightness(1.15)}
  .t-seg b{font-size:13px}
  .t-seg small{opacity:.85;font-size:11px}
  .t-mark{display:flex;margin-left:50px;margin-right:50px;margin-top:8px}
  .t-mark div{flex:1;text-align:center;font-size:11px;color:var(--weak);font-variant-numeric:tabular-nums}

  /* ===== 幕折叠 ===== */
  .acts{padding:24px 0 40px}
  .act{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden;transition:border-color .25s}
  .act.open{border-color:rgba(255,255,255,.14)}
  .act-head{display:flex;align-items:center;gap:16px;padding:18px 20px;cursor:pointer;user-select:none;position:relative}
  .act-stripe{width:5px;align-self:stretch;border-radius:3px;flex-shrink:0}
  .act-thumb{width:92px;height:56px;border-radius:6px;object-fit:cover;flex-shrink:0;border:1px solid var(--line)}
  .act-title{flex:1;min-width:0}
  .act-title h3{font-size:18px;font-weight:700;letter-spacing:.05em}
  .act-title .en{font-size:12px;color:var(--sub);letter-spacing:.22em;margin-top:2px}
  .act-time{font-size:12px;color:var(--weak);font-variant-numeric:tabular-nums;text-align:right;line-height:1.8}
  .act-time b{display:block;font-size:15px;color:var(--text);font-weight:500}
  .act-chevron{width:22px;height:22px;flex-shrink:0;transition:transform .28s;color:var(--sub)}
  .act.open .act-chevron{transform:rotate(180deg);color:var(--text)}
  .act-body{max-height:0;overflow:hidden;transition:max-height .4s ease}
  .act.open .act-body{max-height:2000px}
  .shot-list{border-top:1px solid var(--line)}
  .shot{display:grid;grid-template-columns:56px 108px 74px 96px 1fr 26px;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid rgba(35,47,66,.55);cursor:pointer;transition:background .18s}
  .shot:last-child{border-bottom:none}
  .shot:hover{background:var(--surface2)}
  .shot .n{font-size:13px;color:var(--weak);font-variant-numeric:tabular-nums}
  .shot .n b{display:block;font-size:16px;color:var(--text);font-weight:700}
  .shot .tc{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;letter-spacing:.03em}
  .shot .tc b{display:block;font-size:13px;color:var(--blue);font-weight:500}
  .shot .dur{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
  .shot .shot-jing{font-size:13px;color:var(--sub)}
  .shot .desc{font-size:14px;color:var(--text);line-height:1.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .shot .arrow{color:var(--weak);font-size:16px;text-align:right}
  .shot:hover .arrow{color:var(--blue)}
  .shot-note{display:none}

  /* ===== Modal ===== */
  .modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
  .modal.open{display:flex}
  .modal-mask{position:absolute;inset:0;background:rgba(6,9,14,.78);backdrop-filter:blur(3px);animation:fade .2s}
  .modal-card{position:relative;width:100%;max-width:600px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:30px 30px 26px;animation:rise .24s ease;max-height:88vh;overflow-y:auto}
  .modal-close{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--sub);font-size:18px;cursor:pointer;line-height:1}
  .modal-close:hover{color:var(--text);border-color:var(--sub)}
  .modal .m-kicker{font-size:12px;letter-spacing:.3em;color:var(--blue);margin-bottom:8px}
  .modal h4{font-size:24px;font-weight:700;margin-bottom:4px}
  .modal .m-time{font-size:13px;color:var(--sub);margin-bottom:20px;font-variant-numeric:tabular-nums}
  .m-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
  .m-cell{background:var(--surface2);border-radius:8px;padding:10px 14px}
  .m-cell .k{font-size:11px;color:var(--weak);letter-spacing:.14em;margin-bottom:3px}
  .m-cell .v{font-size:15px;color:var(--text)}
  .m-section{font-size:12px;color:var(--weak);letter-spacing:.14em;margin:16px 0 6px}
  .m-text{font-size:14px;color:var(--text);line-height:1.8}
  .m-divider{height:1px;background:var(--line);margin:16px 0}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* ===== Footer ===== */
  footer{padding:44px 20px 56px;text-align:center;border-top:1px solid var(--line);margin-top:16px}
  footer .f-title{font-size:20px;font-weight:700;letter-spacing:.3em;margin-bottom:10px}
  footer .f-sub{font-size:13px;color:var(--weak);letter-spacing:.14em}

  /* ===== 响应式 ===== */
  @media (max-width:760px){
    .hero{min-height:440px;padding:64px 16px 48px}
    .hero h1{font-size:clamp(56px,22vw,88px)}
    .act-head{gap:12px;padding:14px 14px}
    .act-thumb{display:none}
    .shot{grid-template-columns:40px 96px 60px 80px 1fr 18px;gap:8px;padding:12px 14px}
    .shot .desc{white-space:normal}
    .t-mark{margin-left:16px;margin-right:16px}
    .timeline{flex-wrap:wrap;gap:8px}
    .m-grid{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

      shots:[
        {n:14, t:'00:20.2', d:'1.8s', jing:'全景', cam:'固定机位', desc:'白发持光刃侠客 vs 巨型红色恶魔虚影，大小对比强烈。', sound:'音乐高潮前置', cut:'硬切'},
        {n:15, t:'00:22', d:'3.0s', jing:'中近景', cam:'轻微环绕', desc:'光刃划出环形光效，红色能量碎屑迸发。', sound:'技能音效爆点', cut:'硬切'},
        {n:16, t:'00:25', d:'2.0s', jing:'大特写', cam:'固定机位', desc:'眼部特写，瞳孔中倒映恶魔战斗身影。', sound:'音乐骤停 · 静默', cut:'硬切'},
        {n:17, t:'00:27', d:'0.7s', jing:'远景', cam:'固定长镜', desc:'日式街道，粉白光晕笼罩，小人背影走向巨大尖角铠甲虚影，留白收尾。', sound:'环境音渐起 · 黑场', cut:'黑场结束'}
      ]
    }
  ];

  var fmt = function(s){return s.replace('00:','0:').replace(/^0:/,'');};
  var actList = document.getElementById('actList');
  var html = '';
  ACTS.forEach(function(a, ai){
    html += '<div class="act" id="act'+ai+'" data-idx="'+ai+'">';
    html += '<div class="act-head">';
    html += '<div class="act-stripe" style="background:'+a.color+'"></div>';
    html += '<img class="act-thumb" src="'+a.img+'" alt="'+a.name+'画面" loading="lazy">';
    html += '<div class="act-title"><h3>'+a.name+' <span style="font-size:13px;color:var(--sub);font-weight:400">'+a.shots.length+' 镜</span></h3><div class="en">'+a.en+'</div></div>';
    html += '<div class="act-time"><b>'+a.time+'</b>'+ (ai===0?'总览':'') +'</div>';
    html += '<svg class="act-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>';
    html += '</div>';
    html += '<div class="act-body"><div class="shot-list">';
    a.shots.forEach(function(s){
      html += '<div class="shot" data-act="'+ai+'" data-shot="'+s.n+'">';
      html += '<div class="n">镜<b>'+s.n+'</b></div>';
      html += '<div class="tc"><b>'+s.t+'</b>'+s.d+'</div>';
      html += '<div class="shot-jing">'+s.jing+'</div>';
      html += '<div class="dur">'+s.cam+'</div>';
      html += '<div class="desc">'+s.desc+'</div>';
      html += '<div class="arrow">›</div>';
      html += '</div>';
    });
    html += '</div></div></div>';
  });
  actList.innerHTML = html;

  var acts = document.querySelectorAll('.act');
  acts[0].classList.add('open');
  var actHeads = document.querySelectorAll('.act-head');
  actHeads.forEach(function(h){
    h.addEventListener('click', function(){
      var p = h.parentElement;
      var open = p.classList.contains('open');
      acts.forEach(function(x){x.classList.remove('open')});
      if(!open) p.classList.add('open');
    });
  });
  document.querySelectorAll('.t-seg').forEach(function(seg){
    seg.addEventListener('click', function(){
      var ai = +seg.getAttribute('data-act');
      acts.forEach(function(x){x.classList.remove('open')});
      acts[ai].classList.add('open');
      acts[ai].scrollIntoView({behavior:'smooth', block:'center'});
    });
  });

  var modal = document.getElementById('modal');
  var card = document.getElementById('modalCard');
  function openShot(ai, n){
    var s = ACTS[ai].shots.find(function(x){return x.n===n});
    if(!s) return;
    card.innerHTML =
      '<button class="modal-close" id="mClose" aria-label="关闭">×</button>' +
      '<div class="m-kicker">SHOT '+s.n+' · '+ACTS[ai].en+'</div>' +
      '<h4 class="serif">'+ACTS[ai].name+' · 镜 '+s.n+'</h4>' +
      '<div class="m-time">'+fmt(s.t)+' 起 · 时长 '+s.d+'</div>' +
      '<div class="m-grid">' +
        '<div class="m-cell"><div class="k">景别</div><div class="v">'+s.jing+'</div></div>' +
        '<div class="m-cell"><div class="k">运镜</div><div class="v">'+s.cam+'</div></div>' +
      '</div>' +
      '<div class="m-section">画面内容</div><div class="m-text">'+s.desc+'</div>' +
      '<div class="m-divider"></div>' +
      '<div class="m-section">声音设计</div><div class="m-text">'+s.sound+'</div>' +
      '<div class="m-section">转场</div><div class="m-text">'+s.cut+'</div>';
    modal.classList.add('open');
    document.body.style.overflow='hidden';
    document.getElementById('mClose').addEventListener('click', closeModal);
  }
  function closeModal(){
    modal.classList.remove('open');
    document.body.style.overflow='';
  }
  document.querySelectorAll('.shot').forEach(function(row){
    row.addEventListener('click', function(){
      openShot(+row.getAttribute('data-act'), +row.getAttribute('data-shot'));
    });
  });
  document.getElementById('modalMask').addEventListener('click', closeModal);
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });
})();
</script>
</body>
