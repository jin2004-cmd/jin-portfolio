<style>
  :root{
    --ink:#0A0B0D; --ink-2:#121417; --ink-3:#1B1E23;
    --paper:#F2EDE4; --paper-2:#B9B3A7; --paper-3:#847F76;
    --gold:#E8B25C; --gold-2:#F0BE6C;
    --line:rgba(242,237,228,.14); --line-2:rgba(242,237,228,.08);
    --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);overflow:hidden;
    font-family:var(--sans);-webkit-tap-highlight-color:transparent}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;outline:none}
  #c.drag{cursor:grabbing}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;user-select:none}
  #hud button{font-family:inherit;cursor:pointer;pointer-events:auto}
  [hidden]{display:none!important}

  /* ---------- top bar ---------- */
  .hd{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;
    padding:18px 22px;gap:16px;
    background:linear-gradient(to bottom,rgba(10,11,13,.55),rgba(10,11,13,0))}
  .brand{display:flex;align-items:center;gap:11px}
  .brand .mark{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;
    background:var(--gold);color:var(--ink);font:800 13px/1 var(--mono);letter-spacing:.04em;
    box-shadow:0 0 26px rgba(232,178,92,.35)}
  .brand b{display:block;font-size:14px;font-weight:600;letter-spacing:.02em}
  .brand i{display:block;margin-top:3px;font:9.5px/1.2 var(--mono);font-style:normal;color:var(--paper-3);letter-spacing:.16em}
  .hd-r{display:flex;align-items:center;gap:10px}
  .pill{font:10px/1 var(--mono);letter-spacing:.1em;color:var(--paper-2);
    background:rgba(10,11,13,.6);border:1px solid var(--line);border-radius:999px;padding:7px 10px}
  .exit{pointer-events:auto;text-decoration:none;font:11px/1 var(--mono);letter-spacing:.1em;color:var(--paper-2);
    background:rgba(10,11,13,.62);border:1px solid var(--line);border-radius:7px;padding:9px 12px;
    backdrop-filter:blur(10px);transition:.2s}
  .exit:hover{color:var(--paper);border-color:rgba(232,178,92,.55);background:rgba(232,178,92,.08)}

  /* ---------- crosshair ---------- */
  .cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;opacity:.8;transition:opacity .2s}
  .cross::before,.cross::after{content:"";position:absolute;background:rgba(242,237,228,.55)}
  .cross::before{left:50%;top:0;width:1px;height:100%;transform:translateX(-50%)}
  .cross::after{top:50%;left:0;height:1px;width:100%;transform:translateY(-50%)}
  .cross i{position:absolute;left:50%;top:50%;width:3px;height:3px;border-radius:50%;background:var(--gold);
    transform:translate(-50%,-50%);box-shadow:0 0 6px rgba(232,178,92,.9)}
  .cross.hot i{width:6px;height:6px;box-shadow:0 0 12px rgba(232,178,92,1)}
  .cross.hot{opacity:1}
  #hud.looking .cross{opacity:0}

  /* ---------- tour tag ---------- */
  .tour-tag{position:absolute;left:50%;top:86px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;
    background:rgba(10,11,13,.7);border:1px solid rgba(232,178,92,.4);border-radius:999px;padding:8px 16px 8px 12px;
    backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(0,0,0,.35);animation:tin .35s ease both}
  .tour-tag b{font:600 10px/1 var(--mono);color:var(--gold);letter-spacing:.14em}
  .tour-tag span{font-size:12px;color:var(--paper-2);letter-spacing:.08em}
  @keyframes tin{from{opacity:0;transform:translate(-50%,-6px)}to{opacity:1;transform:translate(-50%,0)}}

  /* ---------- product card ---------- */
  .pcard{position:absolute;right:34px;top:50%;transform:translateY(-50%) translateX(14px);width:296px;
    background:linear-gradient(160deg,rgba(18,20,23,.94),rgba(10,11,13,.96));
    border:1px solid rgba(232,178,92,.32);border-radius:12px;padding:16px 18px 15px;
    backdrop-filter:blur(14px);box-shadow:0 22px 60px rgba(0,0,0,.55);opacity:0;transition:.24s cubic-bezier(.2,.7,.2,1);overflow:hidden}
  .pcard.on{opacity:1;transform:translateY(-50%) translateX(0)}
  .pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
    background:linear-gradient(to bottom,transparent,var(--gold),transparent)}
  .pcard .pc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
  .pcard .pc-cat{font:9.5px/1 var(--mono);letter-spacing:.16em;color:var(--gold)}
  .pcard .pc-no{font:9.5px/1 var(--mono);letter-spacing:.12em;color:var(--paper-3)}
  .pcard h3{margin:0 0 4px;font-size:20px;font-weight:600;letter-spacing:.02em}
  .pcard .pc-sub{margin:0 0 12px;font-size:11.5px;line-height:1.7;color:var(--paper-3)}
  .pcard .pc-price{display:flex;align-items:baseline;gap:4px;color:var(--gold)}
  .pcard .pc-price em{font:italic 15px/1 var(--mono)}
  .pcard .pc-price b{font:600 30px/1 var(--mono);letter-spacing:-.02em}
  .pcard .pc-price span{font-size:11px;color:var(--paper-3);margin-left:3px}
  .pcard .pc-bar{height:2px;background:rgba(242,237,228,.1);border-radius:2px;margin:13px 0 10px;overflow:hidden}
  .pcard .pc-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2))}
  .pcard .pc-meta{display:flex;justify-content:space-between;font:9.5px/1.6 var(--mono);color:var(--paper-3);letter-spacing:.08em}

  /* ---------- prompt / toast ---------- */
  .prompt{position:absolute;left:50%;bottom:104px;transform:translateX(-50%) translateY(8px);display:flex;align-items:center;gap:10px;
    background:rgba(232,178,92,.93);color:var(--ink);border:0;border-radius:9px;padding:11px 17px;
    box-shadow:0 14px 40px rgba(232,178,92,.28);opacity:0;transition:.22s;pointer-events:none}
  .prompt.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
  .prompt kbd{font:700 10px/1 var(--mono);background:rgba(10,11,13,.9);color:var(--gold);border-radius:4px;padding:4px 6px}
  .prompt span{font-size:13.5px;font-weight:600;letter-spacing:.04em}
  .prompt em{font:9.5px/1 var(--mono);font-style:normal;letter-spacing:.08em;opacity:.6}
  .toast{position:absolute;left:50%;bottom:158px;transform:translateX(-50%) translateY(10px);opacity:0;transition:.3s;
    background:rgba(10,11,13,.82);border:1px solid var(--line);border-left:2px solid var(--gold);border-radius:7px;
    padding:9px 15px;font-size:12.5px;color:var(--paper);backdrop-filter:blur(10px);white-space:nowrap}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- hint ---------- */
  .hint{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;align-items:center;gap:7px;flex-wrap:wrap;
    justify-content:center;max-width:92vw;background:rgba(10,11,13,.66);border:1px solid var(--line);border-radius:9px;
    padding:9px 15px;font-size:11.5px;color:var(--paper-2);backdrop-filter:blur(10px);transition:opacity .8s}
  .hint kbd{font:600 9.5px/1 var(--mono);background:rgba(242,237,228,.09);border:1px solid var(--line);
    color:var(--paper-2);border-radius:4px;padding:4px 6px}
  .hint b{color:var(--gold);font-weight:500}
  .hint.off{opacity:0;pointer-events:none}

  /* ---------- dock ---------- */
  .dock{position:absolute;right:22px;bottom:24px;display:flex;align-items:center;gap:2px;
    background:rgba(10,11,13,.64);border:1px solid var(--line);border-radius:10px;padding:5px;
    backdrop-filter:blur(12px);pointer-events:auto}
  .dbtn{display:flex;align-items:center;gap:6px;background:transparent;border:0;border-radius:7px;
    padding:7px 10px;font-size:11.5px;color:var(--paper-2);letter-spacing:.02em;transition:.18s}
  .dbtn:hover{background:rgba(242,237,228,.07);color:var(--paper)}
  .dbtn.on{background:rgba(232,178,92,.14);color:var(--gold)}
  .dbtn .ic{font-size:12px}
  .dbtn i{font:600 9.5px/1 var(--mono);font-style:normal;color:var(--gold);opacity:.9;
    border:1px solid rgba(232,178,92,.34);border-radius:3px;padding:2px 4px}
  .dsep{width:1px;height:16px;background:var(--line);margin:0 4px}

  /* ---------- mobile stick ---------- */
  .stick{position:absolute;left:24px;bottom:26px;width:104px;height:104px;border-radius:50%;
    border:1px solid rgba(242,237,228,.18);background:rgba(10,11,13,.42);backdrop-filter:blur(8px);
    display:none;pointer-events:auto;touch-action:none}
  .stick .stick-k{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;
    background:rgba(242,237,228,.15);border:1px solid rgba(242,237,228,.3);
    box-shadow:0 6px 18px rgba(0,0,0,.4)}
  .stick.off{opacity:.35}

  /* ---------- loading ---------- */
  .loading{position:absolute;inset:0;z-index:30;background:radial-gradient(ellipse at 50% 40%,#15171c 0%,#0A0B0D 62%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .7s ease}
  .loading.gone{opacity:0;pointer-events:none}
  .loading .lm{font:800 30px/1 var(--mono);letter-spacing:.28em;color:var(--gold);padding-left:.28em;
    text-shadow:0 0 40px rgba(232,178,92,.4)}
  .loading .ls{font:9.5px/1 var(--mono);letter-spacing:.4em;color:var(--paper-3);padding-left:.4em}
  .loading .lbar{width:210px;height:2px;background:rgba(242,237,228,.1);overflow:hidden;margin-top:6px}
  .loading .lbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold-2));transition:width .35s}
  .loading .lp{font:9.5px/1 var(--mono);color:var(--paper-3);letter-spacing:.18em}

  .flash{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .18s}
  .flash.on{opacity:1;transition:none}
  body.shot .cross{display:none}
  body.shot .hint{display:none}

  @media (hover:none), (max-width:820px){
    .stick{display:block}
    .dock{right:14px;bottom:16px;padding:4px;gap:0}
    .dbtn{padding:7px 8px;font-size:11px}
    .dbtn span:not(.ic){display:none}
    .hint{bottom:22px;font-size:10.5px;padding:8px 10px}
    .hd{padding:14px}
    .brand i{display:none}
    .pcard{right:12px;left:12px;width:auto;top:auto;bottom:150px;transform:translateY(10px)}
    .pcard.on{transform:translateY(0)}
    .prompt{bottom:96px}
    .tour-tag{top:72px}
  }
  @media (max-width:820px){ .pcard h3{font-size:18px} }
</style>
</head>

</div>

<script>

/* ============================================================
   便利店 3D · MODEL-01  —  100% procedural geometry + textures
   three.js r147 UMD · no external assets
   ============================================================ */

const $ = s => document.querySelector(s);
const PARAM = new URLSearchParams(location.search);
const SHOT = PARAM.get('shot') === '1';

const CAMERA = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.05, 120);
CAMERA.position.set(2.15, 1.62, 4.35);

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  o = o || {};

  m.position.set(x, y, z);
  if (o.rx) m.rotation.x = o.rx;

}

  o = o || {};
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 16), mat);
  m.position.set(x, y, z);
  if (o.rx) m.rotation.x = o.rx;
  if (o.ry) m.rotation.y = o.ry;
  if (o.rz) m.rotation.z = o.rz;
  m.castShadow = o.cast !== false; m.receiveShadow = o.recv !== false;
  (o.parent || SCENE).add(m);

}

  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.position.set(x, y, z);
  if (o.rx !== undefined) m.rotation.x = o.rx;
  if (o.ry !== undefined) m.rotation.y = o.ry;

    map, color: color === undefined ? 0xffffff : color, transparent: true, opacity: opacity === undefined ? 1 : opacity,
    blending: THREE.AdditiveBlending, depthWrite: false, fog: false
  }));

}
const _v = new THREE.Vector3();
const _v2 = new THREE.Vector3();

/* colliders: axis-aligned walk blockers */
const COLLIDERS = [];
function collide(minX, maxX, minZ, maxZ) { COLLIDERS.push({ minX, maxX, minZ, maxZ }); }

/* ---------------- materials (shared) ---------------- */
const PAL = {
  ink: 0x0A0B0D, ink2: 0x121417, ink3: 0x1B1E23, paper: 0xF2EDE4,
  gold: 0xE8B25C, gold2: 0xF0BE6C, metal: 0x2A2E35, chrome: 0xBFC4C9
};

/* ---------------- textures: room ---------------- */
const TEX = {};

TEX.floor = tex(512, 512, (g, w, h) => {
  g.fillStyle = '#20232a'; g.fillRect(0, 0, w, h);
  const tw = w / 2, th = h / 2;
  for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) {
    const v = 28 + Math.floor(rr(0, 14));
    g.fillStyle = `rgb(${v},${v + 2},${v + 6})`;
    g.fillRect(x * tw + 2, y * th + 2, tw - 4, th - 4);
    // subtle marble streaks
    for (let i = 0; i < 16; i++) {
      g.strokeStyle = `rgba(${v + 26},${v + 26},${v + 30},${rr(.05, .16)})`;
      g.lineWidth = rr(.6, 2.4); g.beginPath();
      const sx = x * tw + rr(8, tw - 8), sy = y * th + rr(8, th - 8);
      g.moveTo(sx, sy); g.lineTo(sx + rr(-60, 60), sy + rr(-40, 40)); g.stroke();
    }

const TWEENS = [];
function tw(obj, key, day, night) { TWEENS.push({ obj, key, day, night }); }
function applyThemeT(t) {
  t = clamp(t, 0, 1);
  for (let i = 0; i < TWEENS.length; i++) {
    const e = TWEENS[i], o = e.obj, k = e.key;
    if (typeof e.day === 'number') o[k] = lerp(e.day, e.night, t);
    else if (e.day && e.day.isColor) {
      if (!o[k]) o[k] = e.day.clone();
      o[k].copy(e.day).lerp(e.night, t);
    }
  }
}

const ENV = { day: null, night: null };
function buildEnv(isNight) {
  try {
    const s = new THREE.Scene();
    s.background = new THREE.Color(isNight ? 0x05070c : 0xdde3e8);
    const gnd = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), basic({ color: isNight ? 0x14171d : 0x8d8f91 }));
    gnd.rotation.x = -Math.PI / 2; gnd.position.y = -2; s.add(gnd);
    // ceiling light strips
    for (let i = 0; i < 3; i++) {
      const p = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 14), basic({ color: isNight ? 0xffd9a2 : 0xfff6e6 }));
      p.rotation.x = Math.PI / 2; p.position.set(-6 + i * 6, 5, 0); s.add(p);
    }
    // warm wall band
    const wb = new THREE.Mesh(new THREE.PlaneGeometry(40, 5), basic({ color: isNight ? 0x1c1a1a : 0xc8bfb2 }));
    wb.position.set(0, 1.5, -12); s.add(wb);
    // cool window band
    const cb = new THREE.Mesh(new THREE.PlaneGeometry(24, 6), basic({ color: isNight ? 0x0b1a24 : 0xbfd6e4 }));
    cb.position.set(0, 2, 12); cb.rotation.y = Math.PI; s.add(cb);
    // neon blobs
    if (isNight) {
      const nb = new THREE.Mesh(new THREE.PlaneGeometry(6, 4), basic({ color: 0xff5fd2 }));
      nb.position.set(-14, 2, 8); nb.rotation.y = -Math.PI / 2; s.add(nb);
      const cb2 = new THREE.Mesh(new THREE.PlaneGeometry(5, 4), basic({ color: 0x57e8ff }));
      cb2.position.set(14, 2, 8); cb2.rotation.y = Math.PI / 2; s.add(cb2);
    }
    const pm = new THREE.PMREMGenerator(RENDERER);
    const rt = pm.fromScene(s, isNight ? 0.08 : 0.06, 0.1, 80);
    pm.dispose();
    return rt.texture;
  } catch (e) {
    console.warn('env failed', e);
    return null;
  }
}

/* ---------------- frame loop skeleton ---------------- */
const UPDATERS = [];
function onFrame(fn) { UPDATERS.push(fn); }
let TOTAL_TIME = 0, FRAMES = 0, FPS = 0, FPS_ACC = 0, FPS_N = 0, READY = false;
const CLOCK = new THREE.Clock();
const loadingEl = $('#loading');

function updateTheme(dt) {
  if (THEME_T !== THEME_TARGET) {
    const step = Math.min(1, dt * THEME_LERP);
    THEME_T += (THEME_TARGET - THEME_T) * step;
    if (Math.abs(THEME_T - THEME_TARGET) < 0.002) THEME_T = THEME_TARGET;
    applyThemeT(THEME_T);
  }
}

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(CLOCK.getDelta(), 0.05);
  TOTAL_TIME += dt;
  updateTheme(dt);
  for (let i = 0; i < UPDATERS.length; i++) UPDATERS[i](dt, TOTAL_TIME);
  RENDERER.render(SCENE, CAMERA);
  FRAMES++;
  FPS_ACC += dt; FPS_N++;
  if (FPS_ACC > 0.5) { FPS = Math.round(FPS_N / FPS_ACC); FPS_ACC = 0; FPS_N = 0; }
  if (!READY && FRAMES >= 3) {
    READY = true;
    window.__READY = true;
    window.__INFO = { frames: FRAMES, calls: RENDERER.info.render.calls, triangles: RENDERER.info.render.triangles, three: THREE.REVISION };
    loadingEl.classList.add('gone');
    if (SHOT) loadingEl.style.display = 'none';
    setTimeout(() => { loadingEl.style.display = 'none'; }, 800);
    const h = $('#hint'); if (h) setTimeout(() => h.classList.add('off'), SHOT ? 900 : 6000);
  }
}

const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _p = new THREE.Vector3(), _s = new THREE.Vector3();
const _e = new THREE.Euler();
function inst(type, x, y, z, ry, color, sx, sy, sz) {
  const h = type === 'carton' ? 0.17 : type === 'can' ? 0.115 : 0.19;
  _p.set(x, y + h * (sy || 1) * 0.5, z);
  _e.set(0, ry, 0); _q.setFromEuler(_e);
  _s.set(sx || 1, sy || 1, sz || 1);
  _m4.compose(_p, _q, _s);
  INST[type].push({ m: _m4.clone(), c: color });
}

function priceStrip(len, x, y, z, side) {
  const t = TEX.priceStrip.clone();
  t.needsUpdate = true;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(Math.max(2, Math.round(len * 2.2)), 1);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(len - 0.14, 0.06), new THREE.MeshBasicMaterial({ map: t }));
  m.position.set(x, y, z);
  m.rotation.y = side > 0 ? Math.PI / 2 : -Math.PI / 2;

function buildGondola(cx, z0, z1) {
  const w = 1.0, len = z1 - z0, cz = (z0 + z1) / 2;
  box(w, 0.12, len, SHELF_DARK, cx, 0.06, cz);
  box(0.06, 1.76, len, SHELF_BODY, cx, 0.98, cz);
  box(w, 0.05, len + 0.06, SHELF_DARK, cx, 1.82, cz);
  [z0 + 0.025, z1 - 0.025].forEach(z => box(w, 1.9, 0.05, SHELF_BODY, cx, 0.95, z));
  LEVELS.forEach(y => {
    box(w, 0.035, len - 0.08, SHELF_BOARD, cx, y, cz);
    [-1, 1].forEach(s => priceStrip(len, cx + s * (w / 2 + 0.03), y + 0.05, cz, s));
  });
  // price rank edge (top)
  box(w + 0.04, 0.02, len, GOLD_SOFT, cx, 1.845, cz, { cast: false });
  collide(cx - w / 2 - 0.06, cx + w / 2 + 0.06, z0 - 0.06, z1 + 0.06);
}

function shelfFiller(cx, z0, z1, side, levels, skip) {
  const zStart = z0 + 0.12, span = z1 - z0 - 0.24, step = 0.118;
  const rows = Math.floor(span / step);
  levels.forEach((li) => {
    const y = LEVELS[li];
    for (let r = 0; r <= rows; r++) {
      const z = zStart + r * step + rr(-0.012, 0.012);
      if (skip && skip.some(s => s.level === li && Math.abs(s.z - z) < 0.09)) continue;
      if (RND() < 0.07) continue;
      const t = RND() < .42 ? 'carton' : (RND() < .6 ? 'can' : 'bottle');
      const c = randColor(t === 'carton' ? SNACK_PAL : DRINK_PAL);
      const x = cx + side * (0.5 - 0.055);
      const ry = side > 0 ? Math.PI / 2 : -Math.PI / 2;
      inst(t, x, y + 0.006, z, ry, c, rr(.92, 1.06), rr(.9, 1.1), rr(.92, 1.06));
    }
  });
  // top shelf decorative boxes
  if (levels.indexOf(3) >= 0) {
    for (let r = 0; r < 4; r++) {
      const z = zStart + 0.4 + r * 0.75;
      if (RND() < .4) continue;
      inst('carton', cx + side * 0.34, 1.8, z, Math.PI / 4 + rr(-.1, .1), randColor(SNACK_PAL), 1.3, 1.1, 1.3);
    }
  }
}

    g.fillStyle = p.bg; g.fillRect(0, 0, w, h);
    g.fillStyle = p.accent; g.fillRect(0, 0, w, kind === 'band' ? 16 : 26);
    if (kind === 'wrap') {
      g.fillStyle = p.accent; g.fillRect(0, h - 16, w, 16);
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = '#ffffff';
      g.font = '800 34px ' + FONT_CN; g.fillText(p.name, w / 2, h * .52);
      g.font = '700 12px ' + FONT_MONO; g.globalAlpha = .7; g.fillText(p.en, w / 2, h * .8);
      g.globalAlpha = 1;
    } else if (kind === 'band') {
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = p.bg === '#15181d' || p.bg === '#1c3a2e' ? '#f2ede4' : '#22262c';
      g.font = '800 30px ' + FONT_CN; g.fillText(p.name, w / 2, h * .44);
      g.font = '600 11px ' + FONT_MONO; g.fillText(p.en, w / 2, h * .78);
    } else {
      // decorative shapes
      g.save(); g.globalAlpha = .18; g.fillStyle = '#ffffff';
      g.beginPath(); g.arc(w * .82, h * .3, 58, 0, 7); g.fill(); g.restore();
      g.textAlign = 'center';
      g.fillStyle = p.bg === '#15181d' || p.bg === '#1c3a2e' || p.bg === '#1e6a46' ? '#f2ede4' : '#22262c';
      const fs = p.name.length > 6 ? 26 : 30;
      g.font = '800 ' + fs + 'px ' + FONT_CN;
      if (p.name.length > 6) {
        g.fillText(p.name.slice(0, 6), w / 2, 132);
        g.fillText(p.name.slice(6), w / 2, 166);
      } else { g.fillText(p.name, w / 2, 146); }
      g.font = '700 13px ' + FONT_MONO; g.globalAlpha = .75;
      g.fillText(p.en, w / 2, 190); g.globalAlpha = 1;
      g.fillStyle = '#f2ede4'; g.fillRect(36, 208, w - 72, 22);
      g.fillStyle = '#22262c'; g.font = '800 16px ' + FONT_MONO;
      g.fillText('¥ ' + p.price.toFixed(1), w / 2, 224);
      // barcode
      g.fillStyle = '#22262c';
      for (let i = 0; i < 22; i++) g.fillRect(34 + i * 8, 238, i % 3 === 0 ? 3 : 1.5, 10);
    }
    g.lineWidth = 4; g.strokeStyle = 'rgba(0,0,0,.12)'; g.strokeRect(2, 2, w - 4, h - 4);
  });
}

}

const COLD = (function () {
  const N = 170;

  const pos = new Float32Array(N * 3);
  const vel = [];
  for (let i = 0; i < N; i++) {
    pos[i * 3] = 0; pos[i * 3 + 1] = -10; pos[i * 3 + 2] = 0;
    vel.push({ x: 0, y: 0, z: 0, life: 0, max: 1 });
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    map: TEX.smoke, size: 0.36, transparent: true, opacity: 0,
    depthWrite: false, blending: THREE.AdditiveBlending, color: 0xd6f2ff, sizeAttenuation: true, fog: false
  });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;

onFrame(function updateCold(dt, t) {
  const open = FRIDGE.openAny;
  // doors ease toward target
  FRIDGE.doors.forEach(d => {
    d.open += (d.target - d.open) * Math.min(1, dt * 6.5);
    d.pivot.rotation.y = -1.78 * d.open;
  });
  const anyOpen = Math.max(...FRIDGE.doors.map(d => d.open));
  FRIDGE.openAny = anyOpen;
  COLD.mat.opacity = anyOpen * 0.85;
  FRIDGE.mist.forEach((sp, i) => {
    sp.material.opacity = anyOpen * (0.16 + 0.05 * Math.sin(t * 1.7 + i));
  });
  if (anyOpen > 0.05) {
    const openDoors = FRIDGE.doors.filter(d => d.open > 0.15);
    for (let i = 0; i < COLD.N; i++) {
      const v = COLD.vel[i];
      if (v.life <= 0) {
        const d = openDoors[Math.floor(RND() * openDoors.length)] || FRIDGE.doors[1];
        COLD.pos[i * 3] = d.cx + rr(-0.45, 0.45);
        COLD.pos[i * 3 + 1] = rr(0.55, 2.0);
        COLD.pos[i * 3 + 2] = FRIDGE.zFront - 0.05;
        v.x = rr(-0.18, 0.18); v.y = rr(-0.6, -0.28); v.z = rr(0.35, 0.85);
        v.max = rr(0.8, 1.7); v.life = v.max;
      } else {
        v.life -= dt;
        COLD.pos[i * 3] += v.x * dt;
        COLD.pos[i * 3 + 1] += v.y * dt;
        COLD.pos[i * 3 + 2] += v.z * dt;
        v.y -= 0.35 * dt;
        if (COLD.pos[i * 3 + 1] < 0.08 || v.life <= 0) v.life = 0;
      }
      if (v.life <= 0 && anyOpen <= 0.05) { COLD.pos[i * 3 + 1] = -10; }
    }
    COLD.posAttr.needsUpdate = true;
  }
});

function makeScreen(w, h) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const t = new THREE.CanvasTexture(cv);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 4;
  return { cv, ctx, t, w, h };
}

(function flags() {

  const mats = colors.map(c => basic({ color: c, side: THREE.DoubleSide }));
  for (let i = 0; i < n; i++) {
    const x = x0 + (x1 - x0) * (i / (n - 1));

    verts.push(x - 0.12, y - sag, z, x + 0.12, y - sag, z, x, y - 0.42 - sag, z);

  const idx = []; for (let i = 0; i < n; i++) idx.push(i * 3, i * 3 + 1, i * 3 + 2);
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, mats[0]);
  SCENE.add(mesh);
  // string
  const pts = [];
  for (let i = 0; i <= 20; i++) { const x = x0 + (x1 - x0) * i / 20; pts.push(new THREE.Vector3(x, y - Math.sin(i / 20 * Math.PI) * 0.12, z)); }

})();

function lerpAngle(a, b, t) {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}
function personIdle(p, t, phase) {
  const br = Math.sin(t * 1.4 + phase) * 0.01;
  p.j.hips.position.y = 0.88 + br;
  p.j.torso.position.y = 0.88 + br * .4;
  p.j.hipL.rotation.x = 0; p.j.hipR.rotation.x = 0;
  p.j.kneeL.rotation.x = 0.02; p.j.kneeR.rotation.x = 0.02;
  p.j.shL.rotation.x = 0.03 + Math.sin(t * 1.2 + phase) * .02;
  p.j.shR.rotation.x = 0.03 - Math.sin(t * 1.2 + phase) * .02;
  p.j.shL.rotation.z = 0.04; p.j.shR.rotation.z = -0.04;
  p.j.elL.rotation.x = -0.12; p.j.elR.rotation.x = -0.12;
  p.j.head.rotation.y = Math.sin(t * 0.42 + phase) * 0.22;
  p.j.head.rotation.x = Math.sin(t * 0.55 + phase) * 0.035;
  p.j.head.rotation.z = Math.sin(t * 0.3 + phase) * 0.02;
}
function personWalk(p, t, phase, amt) {
  const s = Math.sin(t + phase), c = Math.cos(t + phase);
  p.j.hips.position.y = 0.88 + Math.abs(c) * 0.022 * amt;
  p.j.torso.position.y = p.j.hips.position.y;
  p.j.hipL.rotation.x = s * 0.58 * amt;
  p.j.hipR.rotation.x = -s * 0.58 * amt;
  p.j.kneeL.rotation.x = Math.max(0, -c) * 0.62 * amt;
  p.j.kneeR.rotation.x = Math.max(0, c) * 0.62 * amt;
  p.j.shL.rotation.x = -s * 0.5 * amt;
  p.j.shR.rotation.x = s * 0.5 * amt;
  p.j.shL.rotation.z = 0.05; p.j.shR.rotation.z = -0.05;
  p.j.elL.rotation.x = -0.25 - Math.abs(s) * 0.2 * amt;
  p.j.elR.rotation.x = -0.25 - Math.abs(s) * 0.2 * amt;
  p.j.head.rotation.y = 0;
  p.j.head.rotation.x = 0.03 + Math.sin(t * 2) * 0.02 * amt;
  p.j.head.rotation.z = 0;
}

function updateClerk(dt, t) {
  const c = CLERK;
  personIdle(c, t, 0.4);
  c.root.rotation.y = 0;
  c.j.shL.rotation.z = 0.05; c.j.shR.rotation.z = -0.05;
  if (CHECKOUT.active || (SHOT_LOCK && (VIEW === 'counter' || PAY_SHOT))) {
    const pulse = 0.5 + 0.5 * Math.sin(t * 7.5);
    c.j.shR.rotation.x = -1.02 - pulse * 0.12;
    c.j.shR.rotation.z = 0.1;
    c.j.elR.rotation.x = -0.62 - pulse * 0.12;
    c.j.shL.rotation.x = -0.22; c.j.elL.rotation.x = -0.95;
    c.j.head.rotation.x = 0.2 + Math.sin(t * 4) * 0.02;
    c.j.head.rotation.y = 0.04;
    SCAN_GUN.visible = true;
  } else {
    c.j.shL.rotation.x = -0.05; c.j.elL.rotation.x = -0.9;
    c.j.shR.rotation.x = 0.02;
    c.j.head.rotation.x = 0.04 + Math.sin(t * 0.6) * 0.03;
    SCAN_GUN.visible = true;
  }
  if (PHONE.visible && !(CHECKOUT.active)) PHONE.visible = false;

function updateCustomer(dt, t) {
  const c = CUSTOMER;
  if (SHOT_LOCK) {
    personIdle(c, t, 2.3);
    if (VIEW === 'counter' || PAY_SHOT) {
      c.j.shR.rotation.x = -1.05; c.j.elR.rotation.x = -0.55;
      c.j.shL.rotation.x = -0.1; c.j.head.rotation.x = -0.04;
      c.j.head.rotation.y = 0.06;
    }
    return;
  }
  let target;
  if (CHECKOUT.active || c.payMode) target = { x: 4.0, z: 3.6, face: Math.PI };
  else target = CUST_ROUTE[c.idx];
  const dx = target.x - c.root.position.x, dz = target.z - c.root.position.z;
  const dist = Math.hypot(dx, dz);
  if (dist > 0.05 && c.wait <= 0) {
    const step = Math.min(dist, 1.55 * dt);
    c.root.position.x += dx / dist * step;
    c.root.position.z += dz / dist * step;
    c.root.rotation.y = lerpAngle(c.root.rotation.y, Math.atan2(dx, dz), Math.min(1, dt * 7));
    c.walkPhase += dt * 8.2;
    personWalk(c, c.walkPhase, 0, Math.min(1, 0.6 + dist * 0.25));
    if (c.payMode && dist < 0.1) { PHONE.visible = true; }
  } else {
    personIdle(c, t, 2.3);
    if (c.wait > 0) {
      c.wait -= dt;
      if (c.wait <= 0 && !(CHECKOUT.active || c.payMode)) c.idx = (c.idx + 1) % CUST_ROUTE.length;
    } else if (!(CHECKOUT.active || c.payMode)) {
      if (target.pause) c.wait = target.pause;
      else c.idx = (c.idx + 1) % CUST_ROUTE.length;
    }
    if (target.face !== undefined) c.root.rotation.y = lerpAngle(c.root.rotation.y, target.face, Math.min(1, dt * 5));
  }
}

  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  drag.moved += Math.abs(dx) + Math.abs(dy);

    PLAYER.yaw -= dx * 0.0038;
    PLAYER.pitch = clamp(PLAYER.pitch - dy * 0.0032, -1.15, 1.15);

  const tx = drag ? drag.px : e.clientX, ty = drag ? drag.py : e.clientY;
  drag = null;

/* joystick */
const STICK = { vec: { x: 0, y: 0 }, id: null };
(function joystick() {
  const el = $('#stick'), knob = $('#stickN');
  if (!el) return;
  function upd(e) {
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const max = r.width * 0.34, len = Math.hypot(dx, dy);
    if (len > max) { dx *= max / len; dy *= max / len; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    STICK.vec.x = dx / max; STICK.vec.y = dy / max;
  }
  el.addEventListener('pointerdown', e => {
    STICK.id = e.pointerId; el.setPointerCapture(e.pointerId); el.classList.remove('off'); upd(e); e.stopPropagation();
  });
  el.addEventListener('pointermove', e => { if (e.pointerId === STICK.id) { upd(e); e.stopPropagation(); } });
  function end(e) {
    if (e.pointerId !== STICK.id) return;
    STICK.id = null; STICK.vec.x = 0; STICK.vec.y = 0;
    knob.style.transform = 'translate(0,0)'; el.classList.add('off');
  }
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
})();

function resolveCollisions(p) {
  const r = PLAYER.radius;
  for (let iter = 0; iter < 3; iter++) {
    for (let i = 0; i < COLLIDERS.length; i++) {
      const c = COLLIDERS[i];
      if (p.x > c.minX - r && p.x < c.maxX + r && p.z > c.minZ - r && p.z < c.maxZ + r) {
        const dl = p.x - (c.minX - r), dr = (c.maxX + r) - p.x;
        const dt2 = p.z - (c.minZ - r), db = (c.maxZ + r) - p.z;
        const m = Math.min(dl, dr, dt2, db);
        if (m === dl) p.x = c.minX - r;
        else if (m === dr) p.x = c.maxX + r;
        else if (m === dt2) p.z = c.minZ - r;
        else p.z = c.maxZ + r;
      }
    }
  }
  // dynamic sliding-door blocker
  if (DOOR.open < 0.72 && p.x > 3.02 - r && p.x < 4.98 + r && p.z > 5.36 - r && p.z < 6.25 + r) {
    const dl = p.x - (3.02 - r), dr = (4.98 + r) - p.x, dt2 = p.z - (5.36 - r), db = (6.25 + r) - p.z;
    const m = Math.min(dl, dr, dt2, db);
    if (m === dl) p.x = 3.02 - r; else if (m === dr) p.x = 4.98 + r;
    else if (m === dt2) p.z = 5.36 - r; else p.z = 6.25 + r;
  }
  // world bounds
  if (p.z < 5.28) {
    p.x = clamp(p.x, -5.78, 5.78);
    p.z = clamp(p.z, -5.28, 5.28);
  } else {
    p.x = clamp(p.x, -8.4, 8.4);
    p.z = clamp(p.z, 5.28, 8.05);
  }
}

function updatePlayer(dt) {

  if (KEYS['s'] || KEYS['arrowdown']) mz += 1;
  if (KEYS['a'] || KEYS['arrowleft']) mx -= 1;
  if (KEYS['d'] || KEYS['arrowright']) mx += 1;
  if (IS_TOUCH) { mx += STICK.vec.x; mz += STICK.vec.y; }
  const len = Math.hypot(mx, mz);
  const fwd = new THREE.Vector3(-Math.sin(PLAYER.yaw), 0, -Math.cos(PLAYER.yaw));
  const right = new THREE.Vector3(Math.cos(PLAYER.yaw), 0, -Math.sin(PLAYER.yaw));
  const target = new THREE.Vector3();
  if (len > 0.001) {
    target.copy(fwd).multiplyScalar(-mz / Math.max(1, len)).add(right.multiplyScalar(mx / Math.max(1, len)));
    target.normalize().multiplyScalar(2.85);
  }
  const acc = Math.min(1, dt * 9);
  PLAYER.vel.x += (target.x - PLAYER.vel.x) * acc;

function tapFocus(x, y) {

    if (hits[i].distance > 4.2) break;
    const r = findHeroRoot(hits[i].object);
    if (r) {
      const rec = HEROES.find(h => h.g === r);
      if (rec) {

}

function updateCheckout(dt, t) {

let fridgeWasOpen = false;
function updateFridgeDoors(dt) {
  if (SHOT_LOCK) {

      if (d.forceOpen) { d.open = 1; d.target = 1; d.pivot.rotation.y = -1.78; }

  let nearest = null, nd = 999;
  FRIDGE.doors.forEach(d => {
    const dist = Math.hypot(PLAYER.pos.x - d.cx, PLAYER.pos.z + 4.55);
    if (dist < nd) { nd = dist; nearest = d; }
  });
  FRIDGE.doors.forEach(d => { d.target = (d === nearest && nd < 2.25) ? 1 : 0; });
  if (nd < 2.25 && !fridgeWasOpen) {
    fridgeWasOpen = true;
    showToast('冷柜门已自动打开 · 冷气外溢', 2400);
  } else if (nd > 3.2) fridgeWasOpen = false;
}
function updateDoor(dt) {
  const dPlayer = Math.hypot(PLAYER.pos.x - 4.0, PLAYER.pos.z - 5.5);
  const dCust = Math.hypot(CUSTOMER.root.position.x - 4.0, CUSTOMER.root.position.z - 5.5);
  const near = Math.min(dPlayer, dCust) < 3.0 || SHOT_LOCK;
  DOOR.target = near ? 1 : 0;
  DOOR.open += (DOOR.target - DOOR.open) * Math.min(1, dt * 5.5);
  const off = DOOR.open * 1.02;
  DOOR.groupL.position.x = 4.0 - 0.48 - off;
  DOOR.groupR.position.x = 4.0 + 0.48 + off;
}
function updateHints() {
  if (SHOT_LOCK) { CHECKOUT.near = false; return; }

tw(NEON_GLOW.material, 'opacity', 0.03, 0.24);
tw(FLOOR.material, 'envMapIntensity', 0.5, 1.05);
tw(GLASS, 'envMapIntensity', 0.6, 1.1);
tw(SIGN_GLOW.material, 'opacity', 0.08, 0.24);

function updateThemeUI() {
  const night = THEME_TARGET > 0.5;
  const ic = $('#lightIc'), tx = $('#lightTxt'), btn = $('#btnLight');
  if (ic) ic.textContent = night ? '☾' : '☀';
  if (tx) tx.textContent = night ? '深夜' : '白天';
  if (btn) btn.classList.toggle('on', night);
}
function applyThemeInstant(night) {
  THEME_TARGET = night ? 1 : 0;
  THEME_T = THEME_TARGET;
  applyThemeT(THEME_T);
  SCENE.environment = night ? ENV.night : ENV.day;
  updateThemeUI();
}
function toggleTheme() {
  if (SHOT_LOCK) return;
  const night = THEME_TARGET < 0.5;
  THEME_TARGET = night ? 1 : 0;
  SCENE.environment = night ? ENV.night : ENV.day;
  updateThemeUI();
  showToast(night ? '深夜模式 · 霓虹与暖光' : '白天模式 · 自然采光', 1800);
}
$('#btnLight').addEventListener('click', toggleTheme);

/* ============================================================
   TOUR CAMERA (1 / 2 / 3)
   ============================================================ */
const VIEWS = {
  1: { name: '门口', pos: new THREE.Vector3(2.62, 1.62, 4.35), look: new THREE.Vector3(-0.9, 1.12, -3.4) },
  2: { name: '冷柜', pos: new THREE.Vector3(0.85, 1.62, -2.25), look: new THREE.Vector3(-0.15, 1.12, -5.1) },
  3: { name: '收银台', pos: new THREE.Vector3(2.45, 1.62, 4.18), look: new THREE.Vector3(4.85, 1.0, 2.5) }
};
const TOUR = {
  active: false, t: 0, dur: 1.6, idx: 0,
  fromPos: new THREE.Vector3(), toPos: new THREE.Vector3(),
  fromQuat: new THREE.Quaternion(), toQuat: new THREE.Quaternion()
};
const _tmpCam = new THREE.PerspectiveCamera();
function startTour(n) {
  if (SHOT_LOCK || !VIEWS[n]) return;
  const v = VIEWS[n];
  TOUR.active = true; TOUR.t = 0; TOUR.idx = n;
  TOUR.fromPos.copy(CAMERA.position);
  TOUR.fromQuat.copy(CAMERA.quaternion);
  _tmpCam.position.copy(v.pos); _tmpCam.up.set(0, 1, 0);
  _tmpCam.lookAt(v.look);
  TOUR.toQuat.copy(_tmpCam.quaternion);
  TOUR.toPos.copy(v.pos);
  const tag = $('#tourTag'); tag.hidden = false;
  $('#ttNo').textContent = '机位 0' + n;
  $('#ttName').textContent = v.name;
  document.querySelectorAll('.tourbtn').forEach(b => b.classList.toggle('on', +b.dataset.tour === n));
}
function cancelTour() {
  if (!TOUR.active) return;
  TOUR.active = false;
  const e = new THREE.Euler().setFromQuaternion(CAMERA.quaternion, 'YXZ');
  PLAYER.yaw = e.y; PLAYER.pitch = e.x;
  PLAYER.pos.x = CAMERA.position.x; PLAYER.pos.z = CAMERA.position.z;
  PLAYER.vel.set(0, 0, 0);
  $('#tourTag').hidden = true;
  document.querySelectorAll('.tourbtn').forEach(b => b.classList.remove('on'));
}
function updateTour(dt) {
  TOUR.t += dt;
  const k = easeIO(clamp(TOUR.t / TOUR.dur, 0, 1));
  CAMERA.position.lerpVectors(TOUR.fromPos, TOUR.toPos, k);
  CAMERA.quaternion.slerpQuaternions(TOUR.fromQuat, TOUR.toQuat, k);
  if (k >= 1) {
    const v = VIEWS[TOUR.idx];
    const e = new THREE.Euler().setFromQuaternion(TOUR.toQuat, 'YXZ');
    PLAYER.yaw = e.y; PLAYER.pitch = e.x;
    PLAYER.pos.x = v.pos.x; PLAYER.pos.z = v.pos.z;
    PLAYER.vel.set(0, 0, 0);
    TOUR.active = false;
    $('#tourTag').hidden = true;
    document.querySelectorAll('.tourbtn').forEach(b => b.classList.remove('on'));
  }
}
document.querySelectorAll('.tourbtn').forEach(b => {
  b.addEventListener('click', () => startTour(+b.dataset.tour));
});
$('#prompt').addEventListener('click', tryCheckout);

/* ============================================================
   SHOT MODE (deterministic screenshots)
   ============================================================ */
const SHOT_VIEWS = {
  front: { pos: [1.35, 1.78, 8.75], look: [0.25, 2.15, 5.3] },
  front2: { pos: [-2.6, 1.72, 8.3], look: [0.9, 1.95, 5.35] },
  door: { pos: [2.62, 1.62, 4.35], look: [-0.9, 1.12, -3.4] },
  overview: { pos: [4.75, 2.55, 4.55], look: [0.1, 0.85, -2.6] },
  inside: { pos: [3.55, 1.62, 3.85], look: [-2.8, 1.15, -1.7] },
  fridge: { pos: [0.85, 1.62, -1.95], look: [-0.15, 1.12, -5.1] },
  counter: { pos: [2.45, 1.62, 4.18], look: [4.85, 1.0, 2.5] }
};
let SHOT_LOCK = false;
function poseShotPeople() {
  CLERK.root.position.set(4.35, 0, 2.08);
  CLERK.root.rotation.y = 0;
  const pay = VIEW === 'counter' || PAY_SHOT;
  if (pay) {
    CUSTOMER.root.position.set(4.92, 0, 3.72);
    CUSTOMER.root.rotation.y = Math.PI - 0.35;
    PHONE.visible = true;
  } else if (VIEW === 'fridge') {
    CUSTOMER.root.position.set(2.1, 0, -3.0);
    CUSTOMER.root.rotation.y = -2.3;
    PHONE.visible = false;
  } else {
    CUSTOMER.root.position.set(1.5, 0, 0.4);
    CUSTOMER.root.rotation.y = -Math.PI / 2;
    PHONE.visible = false;
  }
  personIdle(CLERK, 0, 0);
  personIdle(CUSTOMER, 0, 2);
  if (pay) {
    CLERK.j.shR.rotation.x = -1.12; CLERK.j.elR.rotation.x = -0.66;
    CLERK.j.shL.rotation.x = -0.22; CLERK.j.elL.rotation.x = -0.95;
    CLERK.j.head.rotation.x = 0.2;
    CUSTOMER.j.shR.rotation.x = -1.05; CUSTOMER.j.elR.rotation.x = -0.55;
    CUSTOMER.j.shL.rotation.x = -0.1;
  }
}
function poseCheckoutShot() {
  CHECKOUT.active = true;
  CHECKOUT.frozen = true;
  CHECKOUT.t = 6.45;
  CHECKOUT.scanned = 3;
  CHECKOUT.dispTotal = CHECKOUT_TOTAL;
  CHECKOUT.paid = true;
  drawRegister(); drawCustScreen(); drawReceipt();
  CHECK.receipt.visible = true;
  CHECK.receipt.scale.set(1, 1, 1);
  CHECK.beam.material.opacity = 0.85;
  CHECK.beamGlow.material.opacity = 0.4;
  document.querySelectorAll('.tourbtn').forEach(b => b.classList.remove('on'));
  $('#prompt').classList.remove('on');
}
function enterShotMode() {
  SHOT_LOCK = true;
  document.body.classList.add('shot');
  const night = FORCE_LIGHT === 'night';
  applyThemeInstant(night);
  if (VIEW === 'overview' || VIEW === 'fridge') applyThemeInstant(night);
  const v = SHOT_VIEWS[VIEW] || SHOT_VIEWS.door;
  CAMERA.position.set(v.pos[0], v.pos[1], v.pos[2]);
  CAMERA.up.set(0, 1, 0);
  CAMERA.lookAt(v.look[0], v.look[1], v.look[2]);
  PLAYER.pos.set(v.pos[0], 0, v.pos[2]);
  const e = new THREE.Euler().setFromQuaternion(CAMERA.quaternion, 'YXZ');
  PLAYER.yaw = e.y; PLAYER.pitch = e.x;
  // pose scene
  FRIDGE.doors.forEach(d => { d.forceOpen = (VIEW === 'fridge' || VIEW === 'overview'); });
  if (VIEW === 'fridge') {
    FRIDGE.doors.forEach(d => { d.target = 1; d.open = 1; d.pivot.rotation.y = -1.78; });
    FRIDGE.openAny = 1;
    COLD.mat.opacity = 0.85;
    for (let i = 0; i < COLD.N; i++) {
      const door = FRIDGE.doors[i % FRIDGE.doors.length];
      COLD.pos[i * 3] = door.cx + rr(-0.45, 0.45);
      COLD.pos[i * 3 + 1] = rr(0.5, 2.3);
      COLD.pos[i * 3 + 2] = FRIDGE.zFront + rr(-0.05, 0.45);
      COLD.vel[i].x = rr(-0.15, 0.15); COLD.vel[i].y = rr(-0.25, -0.05); COLD.vel[i].z = rr(0.1, 0.4);
      COLD.vel[i].life = 2;
    }
    COLD.posAttr.needsUpdate = true;
  }
  if (VIEW === 'counter') CHECKOUT.near = true;
  if (PAY_SHOT) poseCheckoutShot();
  poseShotPeople();
  const h = $('#hint'); if (h) h.classList.add('off');
  const tag = $('#tourTag'); if (tag) tag.hidden = true;
  document.querySelectorAll('.tourbtn').forEach(b => b.classList.remove('on'));
}
window.__TEST = {
  tour: n => startTour(n), theme: n => applyThemeInstant(n), checkout: () => startCheckout(),
  shots: Object.keys(SHOT_VIEWS)
};

/* ============================================================
   LOOP WIRING
   ============================================================ */
onFrame(function updateWorld(dt, t) {
  updatePlayer(dt);
  updateDoor(dt);
  updateFridgeDoors(dt);
  updateCamera(dt);
  updateFocus(t);
  updateHints();
  updateCheckout(dt, t);
});
onFrame(function updateFx(dt, t) {
  // neon flicker at night
  if (THEME_T > 0.5) {
    const fl = 0.94 + Math.sin(t * 13.7) * 0.03 + (Math.sin(t * 31.1) > 0.96 ? -0.2 : 0);
    NEON_MAT.opacity = clamp(THEME_T * 0.95 * fl, 0, 1);
  }
  if (FPS) {
    const pill = $('#fpsPill');
    if (pill && !pill.hidden) pill.textContent = FPS + ' FPS · ' + RENDERER.info.render.calls + ' CALLS · ' + Math.round(RENDERER.info.render.triangles / 1000) + 'K TRI';
  }
});
if (PARAM.get('fps') === '1') { $('#fpsPill').hidden = false; }

/* initial screen content */
drawRegister();
drawCustScreen();

/* ---------------- boot ---------------- */
SCENE.environment = ENV.day = buildEnv(false);
ENV.night = buildEnv(true);
applyThemeT(0);
updateThemeUI();
if (FORCE_LIGHT === 'night' && !SHOT) applyThemeInstant(true);
if (SHOT) enterShotMode();
tick();
</script>
