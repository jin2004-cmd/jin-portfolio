"use strict";
/* ================= 状态 ================= */
const KEY='offeragent.v1';
const uid=()=>Math.random().toString(36).slice(2,9);
function fresh(){return{

};}
let S;
try{const x=JSON.parse(localStorage.getItem(KEY));S=x?Object.assign(fresh(),x):fresh()}catch(e){S=fresh()}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}

/* ================= 工具 ================= */
function h(tag,attrs,...ch){
  const e=document.createElement(tag);
  if(attrs)for(const k in attrs){
    if(k==='class')e.className=attrs[k];
    else if(k.startsWith('on')&&typeof attrs[k]==='function')e.addEventListener(k.slice(2).toLowerCase(),attrs[k]);
    else if(attrs[k]!=null&&attrs[k]!==undefined&&attrs[k]!==false)e.setAttribute(k,attrs[k]);
  }
  for(const c of ch.flat(Infinity)){if(c==null||c===false||c===undefined)continue;
    e.appendChild(c.nodeType!==undefined?c:document.createTextNode(c));}
  return e;
}
const $=(s,p=document)=>p.querySelector(s);
function getV(p){return p.split('.').reduce((o,k)=>o[k],S)}
function setV(p,v){const ks=p.split('.');let o=S;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v}
function bind(p){return{value:getV(p),oninput:e=>{setV(p,e.target.value);save()}}}
function toast(t){const el=h('div',{class:'toast'},t);document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add('show'));setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),350)},1700)}
function download(name,text,type='text/plain'){const url=URL.createObjectURL(new Blob([text],{type}));const a=h('a',{href:url,download:name});document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}

/* ================= 追问引擎 ================= */
const SEGMENTS=[
 {k:'a',label:'① 我具体做了什么',ph:'用你做主语的动作动词开头：主导/独立搭建/拆解/重构/写了/盯/跑通。"参与、负责、协助"是废词。',eg:'独立搭建了一套AI带货脚本生成与合规校验流水线'},
 {k:'m',label:'② 怎么做的（工具/步骤/规则）',ph:'面试官会让你展开：用了什么工具、拆成几步、规则怎么定。这是ownership证据。',eg:'Prompt拆成角色/拆解/改写/合规/格式五段，配27类违禁词库做双层校验'},
 {k:'d',label:'③ 数据 + 统计口径',ph:'必须能回答：统计了多久、样本多少人/条、和什么基线对比。估算就老实标估算。',eg:'一周灰度、3人样本：人均日产7-9条→15-18条；单条8-12分钟→2-3分钟'},
 {k:'r',label:'④ 结果/影响',ph:'可验证的结果：比率、排名、消耗、是否被团队沿用。没结果的动作不叫业绩。',eg:'过审率约58%→82%，方法被团队沿用'}
];
const BASIS=['有记录','团队周报','个人估算','无数据'];
const BASIS_TIP={'有记录':'后台/表格/周报有记录，经得起要数据','团队周报':'来自团队周报/会议，口径一致','个人估算':'按日常体感估的，面试主动说明口径，不报精确假数','无数据':'没数字，这条不能写进简历'};

const MODULES=[
 {id:'basics',name:'基本信息',hint:'姓名学校专业毕业年',check:()=>['name','school','major','gradYear'].every(k=>S.basics[k].trim())},
 {id:'intent',name:'求职意向',hint:'岗位+城市，方向排序',check:()=>S.intent.roles.trim()&&S.intent.cities.trim()},
 {id:'exp',name:'实习经历（核心）',hint:'每条四问：动作/做法/数据/结果',check:()=>S.exps.some(x=>x.s.some(y=>y.a&&y.r))},
 {id:'proj',name:'项目/作品',hint:'能在线打开的才是硬牌',check:()=>S.projects.some(p=>p.name&&p.desc)},
 {id:'skill',name:'技能证书',hint:'只写考得住的技能',check:()=>S.skills.trim()},
 {id:'edu',name:'教育与课程',hint:'只留相关课程，不凑数',check:()=>S.courses.trim()}
];
function progress(){return Math.round(MODULES.filter(m=>m.check()).length/MODULES.length*100)}

/* ================= 简历生成+红线 ================= */
const WEAK=/(参与|协助|配合|帮助进行|负责了|做过一些|做了相关)/;
function buildResume(){
  const b=S.basics,W=[];const L=[];
  L.push('# '+(b.name||'（姓名待填）'));
  L.push([b.school,b.major,b.degree,b.gradYear+'届'].filter(Boolean).join(' · '));
  const l2=[b.rank?'专业排名 '+b.rank:'',b.phone,b.email].filter(Boolean).join('  |  ');if(l2)L.push(l2);
  L.push('\n## 求职意向');
  L.push((S.intent.roles.trim()||'（岗位方向待填）')+'｜意向城市：'+(S.intent.cities.trim()||'（待填）'));
  if(S.intent.note.trim())L.push(S.intent.note.trim());
  L.push('\n## 教育背景');
  L.push(`${b.school||'（学校待填）'}｜${b.major||''}｜${b.degree}｜${b.gradYear}届${b.rank?'｜排名'+b.rank:''}${S.courses.trim()?'\n相关课程：'+S.courses.trim():''}`);
  if(S.exps.length){
    L.push('\n## 实习经历');
    S.exps.forEach(x=>{
      L.push(`\n### ${x.company||'（公司待填）'}｜${x.role||''}｜${x.start||''}~${x.end||''}`);
      x.s.forEach((y,i)=>{
        if(!y.a&&!y.r)return;
        const line=`- ${y.a||''}${y.m?'，'+y.m:''}${y.d?'，'+y.d:''}${y.r?'，'+y.r:''}`;
        L.push(line);
        const tag=x.company||'该公司';
        if(WEAK.test(y.a))W.push({lv:2,t:`「${tag}」第${i+1}条：动作词"${(y.a.match(WEAK)||[])[0]}"是弱动词，听不到ownership。改成"我主导/独立搭建/重构"。`});
        if(!/\d/.test(line))W.push({lv:2,t:`「${tag}」第${i+1}条：整句没有数字。没数据的经历等于没写，补统计口径或删。`});
        if(!y.m)W.push({lv:1,t:`「${tag}」第${i+1}条：缺"怎么做的"，一问方法就空，补工具/流程/规则。`});
        if(y.basis==='个人估算')W.push({lv:1,t:`「${tag}」第${i+1}条：数据是估算。面试口径："这是我按日常记录估的区间值，正式口径是X"，别报精确假数。`});
        if(y.basis==='无数据')W.push({lv:2,t:`「${tag}」第${i+1}条：你标了"无数据"，这条不许进简历。`});
      });
    });
  }
  if(S.projects.length){
    L.push('\n## 项目 / 作品');
    S.projects.forEach((p,i)=>{
      L.push(`- **${p.name||'（项目名待填）'}**｜${p.role||''}${p.link?'｜'+p.link:''}`);
      L.push('  '+(p.desc||'（一句话：做了什么+数据结果）'));
      if(!p.link.trim())W.push({lv:1,t:`项目「${p.name||i+1}」没有可验证链接。能在线跑的作品才是硬牌，补链接或先去做。`});
    });
  }
  if(S.skills.trim()||S.certs.trim()){
    L.push('\n## 技能与证书');
    if(S.skills.trim())L.push(S.skills.trim());
    if(S.certs.trim())L.push(S.certs.trim());
  }
  return{md:L.join('\n'),W};
}

 {name:'AI + 电商内容/千川',tags:['电商','千川','带货','投放','短视频','剪辑','脚本','素材','抖音','爆款','过审','转化','消耗','直播','信息流','大健康','美妆'],advice:'补投放数据口径（消耗/ROI/出价/完播/点击），再做一个能在线演示的"爆款脚本Agent"。'},
 {name:'游戏内容/发行',tags:['游戏','发行','玩家','社区','活动','版本','二次元','文案'],advice:'拆1个真实运营活动：目标-机制-数据-你的动作，写成拆解文档当作品。'},
 {name:'AI应用层 / AI产品',tags:['agent','智能体','api','prompt','工作流','python','大模型','rag','语义','百炼','deepseek','接口','自动化'],advice:'先补三个概念：Prompt五段式、语义校验/RAG区别、数据反馈闭环；再接DeepSeek API做一个真Agent。'},

 {name:'内容社区 / 新媒体运营',tags:['新媒体','公众号','小红书','b站','微博','文案','排版','选题','粉丝','阅读','文旅','探店'],advice:'整理多平台账号矩阵数据（篇数/播放/涨粉），选题方法论写成一页纸。'},
 {name:'跨境电商运营',tags:['跨境','亚马逊','tiktok shop','英文','外贸','保税','独立站','海外'],advice:'没实操过就不许写"跨境经验"。真想转：跑通一次小店或保税流程调研，再写。'}

function dirScores(){

  return DIRS.map(d=>{const hit=d.tags.filter(t=>blob.includes(t.toLowerCase()));return {...d,hit,miss:d.tags.filter(t=>!blob.includes(t.toLowerCase())),score:hit.length}}).sort((a,b)=>b.score-a.score);
}

let chatHistory=[];
function aiSystem(){return{role:'system',content:
`你是大厂秋招面试官，正在面试一名应届生。这是他的真实档案(JSON)：
${JSON.stringify({basics:S.basics,intent:S.intent,exps:S.exps,projects:S.projects,skills:S.skills})}
铁律：
1. 只基于档案真实内容提问和评价，绝不替他虚构公司、经历、数据或同事业绩。
2. 逐条追问：数据统计周期/样本量/对比基线、他个人具体动作（区分团队）、核心方法细节。
3. 答得空泛、数据无口径、像背稿时继续追问，不放过。
4. 每次只问一个问题，简短；他答完指出哪里会穿帮、怎么补。`}}
function msg(cls,t){const el=h('div',{class:'msg '+cls},t);const box=document.getElementById('msgs');box.appendChild(el);box.scrollTop=box.scrollHeight;return el}
async function chatSend(){
  const inp=document.getElementById('chat-in');const t=inp.value.trim();if(!t)return;
  if(!S.ai.base||!S.ai.key){toast('先去设置填API');return}
  msg('u',t);inp.value='';
  const wait=msg('m','思考中…');
  if(!chatHistory.length)chatHistory=[aiSystem()];
  chatHistory.push({role:'user',content:t});
  try{
    const r=await fetch(S.ai.base.replace(/\/+$/,'')+'/chat/completions',{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.ai.key},
      body:JSON.stringify({model:S.ai.model||'deepseek-chat',messages:chatHistory,temperature:0.5})
    });
    const j=await r.json();
    if(!r.ok)throw new Error(j.error?.message||('HTTP '+r.status));
    const m=j.choices?.[0]?.message?.content||'（空回复）';
    wait.textContent=m;chatHistory.push(j.choices[0].message);
  }catch(e){wait.textContent='出错：'+e.message+'（检查base_url/key/模型名，接口需支持/chat/completions）';wait.style.color='var(--red-d)';}
}
function startMock(){document.getElementById('chat-in').value='开始吧，请根据我的档案提问';chatSend();}
