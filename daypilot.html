<style>
/* DayPilot 日航 · 移动端优先样式 */
:root {
  --accent: #4f6df5;
  --accent-soft: #eef1fe;
  --bg: #f5f6fa;
  --card: #ffffff;
  --text: #1c2333;
  --text-2: #6b7280;
  --line: #e8eaf1;
  --high: #e5484d;
  --mid: #f59e0b;
  --low: #3b82f6;
  --ok: #16a34a;
  --radius: 16px;
  --tabbar-h: 62px;
  --shadow: 0 1px 3px rgba(28,35,51,.06);
  --spring: cubic-bezier(.34,1.56,.64,1);
}
body.dark {
  --bg: #0e1016;
  --card: #181b25;
  --text: #e9ebf2;
  --text-2: #9aa1b5;
  --line: #272c3b;
  --accent-soft: #20294d;
  --shadow: 0 1px 3px rgba(0,0,0,.4);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: 16px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased;
}
#app { max-width: 520px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
#view { flex: 1; padding: 16px 16px calc(var(--tabbar-h) + 28px); }

/* ===== 通用 ===== */
.hidden { display: none !important; }
.card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
.card-title { font-size: .95rem; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.muted { color: var(--text-2); font-size: .82rem; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: none; border-radius: 12px; padding: 12px 18px;
  font-size: .92rem; font-weight: 600; cursor: pointer;
  background: var(--accent-soft); color: var(--accent);
  transition: transform .1s, opacity .15s;
  font-family: inherit;
}
.btn:active { transform: scale(.96); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-block { width: 100%; }
.btn-ghost { background: transparent; color: var(--text-2); }
.btn[disabled] { opacity: .45; }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }
.chip { display: inline-block; font-size: .7rem; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
.p-high { background: #fdecec; color: var(--high); }
.p-mid  { background: #fef3e2; color: #b45309; }
.p-low  { background: #e8f0fe; color: var(--low); }
.chip-time { background: #f1f2f6; color: var(--text-2); }
input[type=text], input[type=password], input[type=url], textarea, select {
  width: 100%; border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px; font-size: .92rem; font-family: inherit;
  background: #fff; color: var(--text); outline: none;
}
input:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 90px; line-height: 1.6; }
label.field { display: block; margin-bottom: 12px; }
label.field .label { font-size: .8rem; color: var(--text-2); margin-bottom: 6px; display: block; }
hr.sep { border: none; border-top: 1px solid var(--line); margin: 14px 0; }

/* ===== 页头 ===== */
.page-head { margin: 6px 2px 16px; }
.page-head h1 { font-size: 1.35rem; font-weight: 800; }
.page-head .sub { color: var(--text-2); font-size: .82rem; margin-top: 4px; }

/* ===== 今日 · 进度环 ===== */
.hero { display: flex; align-items: center; gap: 18px; }
.ring-wrap { position: relative; width: 92px; height: 92px; flex: none; }
.ring-wrap svg { transform: rotate(-90deg); }
.ring-num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-num b { font-size: 1.25rem; }
.ring-num span { font-size: .68rem; color: var(--text-2); }
.hero-info h2 { font-size: 1.05rem; }
.hero-info .muted { margin-top: 4px; line-height: 1.5; }
.streak-badge { display: inline-flex; align-items: center; gap: 4px; background: #fff4e0; color: #b45309; font-weight: 700; font-size: .78rem; padding: 4px 10px; border-radius: 999px; margin-top: 8px; }

/* ===== 任务列表 ===== */
.task-item {
  display: flex; align-items: flex-start; gap: 12px;
  background: var(--card); border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 10px;
  box-shadow: var(--shadow);
  animation: slideIn .25s ease;
}
@keyframes slideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.task-check {
  flex: none; width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid #cfd4e0; margin-top: 1px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: .85rem; color: transparent; background: #fff;
  transition: all .18s;
}
.task-item.done .task-check { background: var(--ok); border-color: var(--ok); color: #fff; }
.task-body { flex: 1; min-width: 0; }
.task-title { font-size: .95rem; font-weight: 600; line-height: 1.45; word-break: break-all; }
.task-item.done .task-title { text-decoration: line-through; color: var(--text-2); font-weight: 500; }
.task-meta { margin-top: 7px; display: flex; gap: 6px; flex-wrap: wrap; }
.task-del { flex: none; border: none; background: none; color: #c3c8d4; font-size: 1.05rem; cursor: pointer; padding: 2px 4px; }
.task-del:active { color: var(--high); }

/* ===== 空状态 ===== */
.empty { text-align: center; padding: 34px 20px; }
.empty .emoji { font-size: 2.6rem; }
.empty p { color: var(--text-2); font-size: .88rem; margin: 12px 0 18px; line-height: 1.7; }

/* ===== AI 规划 ===== */
.loading-steps { text-align: center; padding: 26px 0; }
.spinner { width: 34px; height: 34px; border: 3px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; margin: 0 auto 14px; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-steps .step-text { font-size: .88rem; color: var(--text-2); }
.eval-badge { display: flex; align-items: center; gap: 8px; border-radius: 12px; padding: 10px 14px; font-size: .8rem; font-weight: 600; margin-bottom: 12px; }
.eval-badge.ok { background: #e9f9ef; color: var(--ok); }
.eval-badge.warn { background: #fef3e2; color: #b45309; }
.eval-badge .score { margin-left: auto; font-size: .95rem; }
.eval-issues { font-size: .75rem; color: var(--text-2); margin-top: 6px; font-weight: 400; line-height: 1.6; }
.plan-pick { display: flex; align-items: flex-start; gap: 10px; padding: 12px; border: 1.5px solid var(--line); border-radius: 12px; margin-bottom: 8px; cursor: pointer; transition: border-color .15s; }
.plan-pick.on { border-color: var(--accent); background: var(--accent-soft); }
.plan-pick .dot { flex: none; width: 20px; height: 20px; border-radius: 6px; border: 2px solid #cfd4e0; margin-top: 2px; display: flex; align-items: center; justify-content: center; color: transparent; font-size: .7rem; }
.plan-pick.on .dot { background: var(--accent); border-color: var(--accent); color: #fff; }
.slider-row { display: flex; align-items: center; gap: 12px; }
.slider-row input[type=range] { flex: 1; accent-color: var(--accent); }
.slider-val { font-weight: 700; color: var(--accent); min-width: 48px; text-align: right; }

/* ===== 复盘 ===== */
.score-dial { text-align: center; padding: 8px 0 4px; }
.score-dial .num { font-size: 3rem; font-weight: 800; color: var(--accent); line-height: 1; }
.score-dial .of { color: var(--text-2); font-size: .9rem; }
.review-block { margin-top: 12px; }
.review-block .rb-title { font-size: .85rem; font-weight: 700; margin-bottom: 6px; }
.review-block p, .review-block li { font-size: .88rem; line-height: 1.7; color: #39415a; }
.review-block ul { padding-left: 20px; }
.history-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.history-item:last-child { border-bottom: none; }
.history-item .date { font-size: .82rem; color: var(--text-2); width: 88px; flex: none; }
.history-item .bar { flex: 1; height: 8px; border-radius: 99px; background: #f1f2f6; overflow: hidden; }
.history-item .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.history-item .pct { font-size: .78rem; font-weight: 700; width: 42px; text-align: right; }

/* ===== 数据看板 ===== */
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.stat-cell { background: var(--card); border-radius: var(--radius); padding: 14px 8px; text-align: center; box-shadow: var(--shadow); }
.stat-cell b { font-size: 1.4rem; display: block; }
.stat-cell span { font-size: .72rem; color: var(--text-2); }
.week-chart { display: flex; align-items: flex-end; gap: 8px; height: 110px; padding: 6px 2px 0; }
.week-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.week-col .col-bar { width: 100%; max-width: 34px; border-radius: 8px 8px 4px 4px; background: var(--accent); min-height: 4px; transition: height .4s; }
.week-col.today .col-bar { background: #ffd166; }
.week-col .col-label { font-size: .66rem; color: var(--text-2); }
.eval-log-item { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: .8rem; }
.eval-log-item:last-child { border-bottom: none; }
.eval-log-item .el-head { display: flex; justify-content: space-between; font-weight: 600; }
.eval-log-item .el-detail { color: var(--text-2); margin-top: 4px; line-height: 1.6; font-size: .74rem; }

/* ===== 设置 ===== */
.mode-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-size: .78rem; font-weight: 700; }
.mode-pill.mock { background: #fef3e2; color: #b45309; }
.mode-pill.live { background: #e9f9ef; color: var(--ok); }

/* ===== 底部导航 ===== */
#tabbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 520px; height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: rgba(255,255,255,.96); backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  display: flex; z-index: 50;
}
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; color: var(--text-2); }
.tab .ico { font-size: 1.2rem; }
.tab .lbl { font-size: .64rem; font-weight: 600; }
.tab.active { color: var(--accent); }

/* ===== Toast & Modal ===== */
#toast {
  position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 20px); transform: translateX(-50%) translateY(20px);
  background: #1c2333; color: #fff; padding: 10px 20px; border-radius: 999px;
  font-size: .85rem; opacity: 0; pointer-events: none; transition: all .25s; z-index: 99; max-width: 84vw; text-align: center;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#modal-mask { position: fixed; inset: 0; background: rgba(20,24,38,.45); z-index: 90; display: flex; align-items: flex-end; justify-content: center; }
#modal { background: #fff; width: 100%; max-width: 520px; max-height: 78vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom)); animation: up .25s ease; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
#modal h3 { margin-bottom: 12px; font-size: 1.05rem; }
#modal .modal-body { font-size: .9rem; line-height: 1.8; white-space: pre-wrap; color: #39415a; }
#modal .btn-row { margin-top: 16px; }

/* ===== 动效与微交互 ===== */
body { transition: background .3s ease, color .3s ease; }
.card, .task-item, .stat-cell { transition: background .3s ease; }
#view > * { animation: viewIn .3s ease both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.btn { transition: transform .12s var(--spring), box-shadow .2s ease, opacity .15s; }
.btn-primary { box-shadow: 0 4px 14px rgba(79,109,245,.35); }
.btn-primary:active { box-shadow: 0 2px 6px rgba(79,109,245,.3); }
.ring-wrap circle:last-child { transition: stroke-dashoffset .8s cubic-bezier(.22,1,.36,1); }
.task-check { transition: all .2s var(--spring); }
.task-item.done .task-check { animation: pop .32s var(--spring); }
@keyframes pop { 50% { transform: scale(1.35); } }
.task-item { touch-action: pan-y; transition: transform .2s ease, opacity .2s ease, background .3s ease; }
.tab { transition: color .2s; }
.tab .ico { transition: transform .25s var(--spring); display: inline-block; }
.tab.active .ico { transform: translateY(-3px) scale(1.12); }
.streak-badge { animation: pulseFire 2.2s ease-in-out infinite; display: inline-flex; }
@keyframes pulseFire { 50% { transform: scale(1.06); } }
.plan-pick { transition: border-color .15s, background .2s, transform .12s var(--spring); }
.plan-pick:active { transform: scale(.98); }

/* 骨架屏 */
.skel { border-radius: 12px; background: linear-gradient(90deg, var(--line) 25%, #f2f3f9 50%, var(--line) 75%); background-size: 200% 100%; animation: shimmer 1.15s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.skel-row { height: 64px; margin-bottom: 8px; }

/* 全清庆祝 */
.confetti-piece { position: fixed; top: -16px; z-index: 300; border-radius: 2px; animation: confFall linear forwards; pointer-events: none; }
@keyframes confFall { to { transform: translateY(105vh) rotate(720deg); opacity: .9; } }

/* ===== 深色模式适配 ===== */
body.dark .p-high { background: rgba(229,72,77,.18); }
body.dark .p-mid { background: rgba(245,158,11,.16); }
body.dark .p-low { background: rgba(59,130,246,.18); }
body.dark .chip-time { background: #222634; }
body.dark input[type=text], body.dark input[type=password], body.dark input[type=url], body.dark textarea, body.dark select { background: #12141c; }
body.dark .task-check { background: #12141c; border-color: #3a4157; }
body.dark #tabbar { background: rgba(20,23,32,.94); }
body.dark #modal { background: #181b25; }
body.dark .eval-badge.ok { background: rgba(22,163,74,.16); }
body.dark .eval-badge.warn { background: rgba(245,158,11,.15); }
body.dark .streak-badge { background: rgba(245,158,11,.15); }
body.dark .history-item .bar { background: #222634; }
body.dark .skel { background: linear-gradient(90deg, #222634 25%, #2c3247 50%, #222634 75%); background-size: 200% 100%; }
body.dark #toast { background: #e9ebf2; color: #1c2333; }
body.dark .review-block p, body.dark .review-block li, body.dark #modal .modal-body { color: #c3c9da; }
body.dark .plan-pick { border-color: var(--line); }
body.dark .plan-pick.on { background: var(--accent-soft); }

/* ===== 桌面端（≥900px）===== */
#bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; display: none; }
html { scroll-behavior: smooth; }
@media (min-width: 900px) {
  #bg-canvas { display: block; }
  #app { max-width: 1060px; position: relative; z-index: 1; }
  #view { padding: 100px 28px 64px; }

  /* 顶部悬浮胶囊导航 */
  #tabbar {
    top: 18px; bottom: auto; left: 50%; transform: translateX(-50%);
    width: auto; max-width: none; height: 56px;
    padding: 0 8px 0 22px;
    border: 1px solid var(--line); border-top: 1px solid var(--line); border-radius: 999px;
    box-shadow: 0 8px 30px rgba(28,35,51,.12);
    gap: 2px; align-items: center;
  }
  #tabbar::before { content: "🧭 DayPilot 日航"; font-weight: 800; font-size: .95rem; margin-right: 16px; white-space: nowrap; }
  .tab { flex: none; flex-direction: row; gap: 6px; padding: 9px 15px; border-radius: 999px; cursor: pointer; }
  .tab .lbl { font-size: .82rem; }
  .tab .ico { font-size: 1rem; }
  .tab.active { background: var(--accent-soft); }
  .tab.active .ico { transform: none; }
  .tab:hover { background: var(--accent-soft); }

  /* 非今日页：阅读列宽居中 */
  #view:not(.tab-today) > * { max-width: 720px; margin-left: auto; margin-right: auto; }

  /* 今日页：左栏（进度+操作）/ 右栏（任务流） */
  .today-layout { display: grid; grid-template-columns: 360px 1fr; gap: 22px; align-items: start; }
  .today-side { position: sticky; top: 100px; }

  /* 悬停微交互 */
  .card { padding: 20px; }
  .task-item { cursor: default; }
  .task-item:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(28,35,51,.10); }
  .task-item .task-del { opacity: 0; transition: opacity .15s; }
  .task-item:hover .task-del { opacity: 1; }
  .task-title { cursor: pointer; }
  .task-check:hover { border-color: var(--ok); transform: scale(1.12); }
  .plan-pick:hover { border-color: var(--accent); }
  .stat-cell { transition: transform .2s var(--spring), box-shadow .2s, background .3s; }
  .stat-cell:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(28,35,51,.10); }
  .btn { cursor: pointer; }
  .btn:hover { filter: brightness(1.06); }
  .week-chart { height: 150px; }
  body.dark .task-item:hover, body.dark .stat-cell:hover { box-shadow: 0 8px 20px rgba(0,0,0,.45); }

  /* 弹窗桌面居中 */
  #modal-mask { align-items: center; }
  #modal { border-radius: 20px; max-width: 560px; }
}

</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div id="app">
  <main id="view"></main>
  <nav id="tabbar"></nav>
</div>
<div id="toast"></div>
<div id="modal-mask" class="hidden"><div id="modal"></div></div>
<script>
/* DayPilot · 预置模板（秋招模式） */
window.DP = window.DP || {};

DP.templates = {
  // 秋招目标池：AI 规划时的默认输入
  qiuzhaoGoals: [
    "拿下 2027 春招 AI 内容运营 / AIGC 运营 offer（当前秋招正式批投递中）",
    "蓝色光标实习：高质量完成客户剪辑任务，沉淀可署名成片与简历数字",
    "打造 DayPilot 开源项目并推上 GitHub，作为秋招作品集弹药"
  ],

  // 一键开始今天的模板任务
  qiuzhaoTasks: [
    { title: "秋招投递 1 小时（岗位库勾选 + 记录台账）", priority: "高", minutes: 60 },

<script>
/* DayPilot · 数据层（localStorage 本地优先） */
window.DP = window.DP || {};

DP.store = (function () {
  var KEY = "daypilot_v1";
  var state = null;

  function pad(n) { return String(n).padStart(2, "0"); }

  function dateStr(d) {
    d = d || new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function defaults() {
    return {
      settings: { apiKey: "", baseUrl: "https://api.deepseek.com", model: "deepseek-chat", theme: "auto" },
      goals: DP.templates.qiuzhaoGoals.slice(),
      days: {},
      evalLogs: [],
      onboarded: false,
      createdAt: new Date().toISOString()
    };
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function init() {
    state = load() || defaults();
    save();
  }

  function getDay(ds) {
    ds = ds || dateStr();
    if (!state.days[ds]) state.days[ds] = { tasks: [], planReport: null, review: null };
    if (!state.days[ds].tasks) state.days[ds].tasks = [];
    return state.days[ds];
  }

  function addTasks(ds, tasks) {
    var day = getDay(ds);
    tasks.forEach(function (t) {
      day.tasks.push({
        id: uid(),
        title: String(t.title || "").slice(0, 60),
        priority: ["高", "中", "低"].indexOf(t.priority) >= 0 ? t.priority : "中",
        minutes: parseInt(t.minutes, 10) || 30,
        done: false,
        doneAt: null
      });
    });
    save();
  }

  function addTask(ds, task) { addTasks(ds, [task]); }

  function toggleTask(ds, id) {
    var day = getDay(ds);
    day.tasks.forEach(function (t) {
      if (t.id === id) {
        t.done = !t.done;
        t.doneAt = t.done ? new Date().toISOString() : null;
      }
    });
    save();
  }

  function editTask(ds, id, patch) {
    var day = getDay(ds);
    day.tasks.forEach(function (t) {
      if (t.id === id) {
        if (patch.title != null) t.title = String(patch.title).slice(0, 60);
        if (patch.priority != null && ["高", "中", "低"].indexOf(patch.priority) >= 0) t.priority = patch.priority;
        if (patch.minutes != null) t.minutes = parseInt(patch.minutes, 10) || t.minutes;
      }
    });
    save();
  }

  function deleteTask(ds, id) {
    var day = getDay(ds);
    day.tasks = day.tasks.filter(function (t) { return t.id !== id; });
    save();
  }

  function setPlanReport(ds, report) { getDay(ds).planReport = report; save(); }
  function setReview(ds, review) { getDay(ds).review = review; save(); }

  function setGoals(goals) {
    state.goals = goals.filter(function (g) { return g && g.trim(); });
    save();
  }

  function setSettings(patch) {
    Object.keys(patch).forEach(function (k) { state.settings[k] = patch[k]; });
    save();
  }

  function logEval(entry) {
    entry.ts = new Date().toISOString();
    state.evalLogs.unshift(entry);
    if (state.evalLogs.length > 50) state.evalLogs.length = 50;
    save();
  }

  /* ---- 统计 ---- */
  function dayStats(ds) {
    var day = getDay(ds);
    var total = day.tasks.length;
    var done = day.tasks.filter(function (t) { return t.done; }).length;
    return { total: total, done: done, rate: total ? done / total : 0 };
  }

  function streak() {
    var n = 0;
    var d = new Date();
    // 今天没完成不断 streak，从昨天往前数；若今天已有全部完成也计入
    var today = dayStats(dateStr(d));
    if (today.total > 0 && today.done === today.total) n++;
    d.setDate(d.getDate() - 1);
    while (true) {
      var s = dayStats(dateStr(d));
      if (s.total > 0 && s.done === s.total) { n++; d.setDate(d.getDate() - 1); }
      else break;
    }
    return n;
  }

  function lastNDays(n) {
    var out = [];
    for (var i = n - 1; i >= 0; i--) {
      var d = new Date();
      d.setDate(d.getDate() - i);
      var ds = dateStr(d);
      var s = dayStats(ds);
      out.push({ date: ds, label: (d.getMonth() + 1) + "/" + d.getDate(), total: s.total, done: s.done, rate: s.rate, hasReview: !!getDay(ds).review });
    }
    return out;
  }

  function exportJSON() { return JSON.stringify(state, null, 2); }

  function importJSON(text) {
    var data = JSON.parse(text);
    if (!data || typeof data !== "object" || !data.settings) throw new Error("格式不正确");
    state = data;
    save();
  }

  function resetAll() {
    localStorage.removeItem(KEY);
    state = defaults();
    save();
  }

  return {
    init: init, save: save, dateStr: dateStr, uid: uid,
    state: function () { return state; },
    settings: function () { return state.settings; },
    goals: function () { return state.goals; },
    evalLogs: function () { return state.evalLogs; },
    getDay: getDay, addTask: addTask, addTasks: addTasks,
    toggleTask: toggleTask, deleteTask: deleteTask, editTask: editTask,
    setPlanReport: setPlanReport, setReview: setReview,
    setGoals: setGoals, setSettings: setSettings, logEval: logEval,
    dayStats: dayStats, streak: streak, lastNDays: lastNDays,
    exportJSON: exportJSON, importJSON: importJSON, resetAll: resetAll,
    markOnboarded: function () { state.onboarded = true; save(); },
    isOnboarded: function () { return state.onboarded; }
  };
})();

</script>
<script>
/* DayPilot · .ics 日历导出（今日事项 → 手机日历 + 闹钟提醒） */
window.DP = window.DP || {};

DP.ics = (function () {

  function pad(n) { return String(n).padStart(2, "0"); }

  // 本地时间 → ICS UTC 格式
  function toUTC(d) {
    return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) +
      "T" + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + "00Z";
  }

  function escapeText(s) {
    return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  }

  /**
   * 把当天任务排成日历事件：从 startHour 点开始顺序排布
   */
  function build(tasks, dateStr, startHour) {
    startHour = startHour || 9;
    var parts = dateStr.split("-");
    var cursor = new Date(parts[0], parts[1] - 1, parts[2], startHour, 0, 0);
    var now = toUTC(new Date());
    var lines = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//DayPilot//Today//CN",
      "CALSCALE:GREGORIAN",
      "METHOD:PUBLISH"
    ];
    tasks.forEach(function (t, i) {
      var start = new Date(cursor);
      var end = new Date(cursor.getTime() + (t.minutes || 30) * 60000);
      cursor = end;
      lines.push("BEGIN:VEVENT");
      lines.push("UID:daypilot-" + dateStr.replace(/-/g, "") + "-" + i + "@daypilot");
      lines.push("DTSTAMP:" + now);
      lines.push("DTSTART:" + toUTC(start));
      lines.push("DTEND:" + toUTC(end));
      lines.push("SUMMARY:[" + t.priority + "] " + escapeText(t.title));
      lines.push("DESCRIPTION:DayPilot 日航 · 今日事");
      lines.push("BEGIN:VALARM");
      lines.push("TRIGGER:-PT10M");
      lines.push("ACTION:DISPLAY");
      lines.push("DESCRIPTION:" + escapeText(t.title));
      lines.push("END:VALARM");
      lines.push("END:VEVENT");
    });
    lines.push("END:VCALENDAR");
    return lines.join("\r\n");
  }

  function download(tasks, dateStr) {
    if (!tasks.length) return false;
    var ics = build(tasks, dateStr);
    var blob = new Blob(["\ufeff" + ics], { type: "text/calendar;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "daypilot-" + dateStr.replace(/-/g, "") + ".ics";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
    return true;
  }

  return { build: build, download: download };
})();

</script>
<script>
/* DayPilot · Eval 评估流水线
 * 双层质量门：
 *   L1 规则校验（确定性）：结构、字段、时长预算、重复项
 *   L2 质量打分（LLM-as-Judge / 启发式）：0-10 分
 * 不达标 → 自动重试（最多 maxRetries 次），全程留痕可审计
 */
window.DP = window.DP || {};

DP.eval = (function () {

  /**
   * L1 规则校验：规划结果必须满足的硬约束
   * @returns {{pass:boolean, issues:string[]}}
   */
  function validatePlan(tasks, maxMinutes) {
    var issues = [];
    if (!Array.isArray(tasks)) {
      return { pass: false, issues: ["输出不是任务数组（JSON 结构错误）"] };
    }
    if (tasks.length < 3) issues.push("任务数过少（" + tasks.length + " < 3），规划不充分");
    if (tasks.length > 5) issues.push("任务数过多（" + tasks.length + " > 5），超出单日可执行粒度");

    var total = 0;
    var seen = {};
    tasks.forEach(function (t, i) {
      var tag = "任务" + (i + 1);
      if (!t || typeof t !== "object") { issues.push(tag + "：不是合法对象"); return; }
      if (!t.title || !String(t.title).trim()) issues.push(tag + "：缺少标题");
      else if (String(t.title).length > 30) issues.push(tag + "：标题超过 30 字，不够精炼");
      if (["高", "中", "低"].indexOf(t.priority) < 0) issues.push(tag + "：优先级非法（必须为 高/中/低）");
      var m = parseInt(t.minutes, 10);
      if (!m || m < 5 || m > 240) issues.push(tag + "：预估时长非法（需 5-240 分钟）");
      else total += m;
      if (t.title) {
        var k = String(t.title).trim();
        if (seen[k]) issues.push(tag + "：与其它任务标题重复");
        seen[k] = true;
      }
    });
    if (maxMinutes && total > maxMinutes) {
      issues.push("总时长 " + total + " 分钟超出可用预算 " + maxMinutes + " 分钟（规划超载）");
    }
    return { pass: issues.length === 0, issues: issues, totalMinutes: total };
  }

  /**
   * L2 启发式打分（Mock 模式 / LLM judge 的降级方案）
   * 维度：时长利用率、优先级结构、目标覆盖度
   */
  function heuristicScore(tasks, goals, maxMinutes) {
    if (!Array.isArray(tasks) || !tasks.length) return { score: 0, comment: "无有效任务" };
    var score = 10;
    var notes = [];

    var total = tasks.reduce(function (s, t) { return s + (parseInt(t.minutes, 10) || 0); }, 0);
    if (maxMinutes) {
      var util = total / maxMinutes;
      if (util < 0.4) { score -= 2; notes.push("时长利用率偏低（" + Math.round(util * 100) + "%），规划偏保守"); }
      else if (util > 1) { score -= 4; notes.push("超出时间预算"); }
      else notes.push("时长利用率 " + Math.round(util * 100) + "%");
    }

    var high = tasks.filter(function (t) { return t.priority === "高"; }).length;
    if (high === 0) { score -= 2; notes.push("缺少高优先级任务，重点不突出"); }
    else if (high > 2) { score -= 1; notes.push("高优先级任务偏多，注意精力分配"); }
    else notes.push("优先级结构合理");

    if (goals && goals.length) {
      var text = tasks.map(function (t) { return t.title; }).join(" ");
      var covered = goals.filter(function (g) {
        return g.split(/[，,：:（(]/)[0].split(/\s+/).some(function (kw) {
          return kw.length >= 2 && text.indexOf(kw.slice(0, 4)) >= 0;
        });
      }).length;
      if (covered === 0) { score -= 3; notes.push("任务与目标池脱节"); }
      else notes.push("覆盖 " + covered + "/" + goals.length + " 个目标方向");
    }

    score = Math.max(1, Math.min(10, score));
    return { score: score, comment: notes.join("；") };
  }

  /**
   * 质量门主流程：生成 → L1 校验 → L2 打分 → 不达标重试
   * @param {object} opts { name, generate(attempt), validate(result), judge(result), threshold, maxRetries }
   * @returns {Promise<{ok, result, report}>}
   */
  async function gate(opts) {
    var threshold = opts.threshold || 7;
    var maxRetries = opts.maxRetries == null ? 2 : opts.maxRetries;
    var attempts = [];
    var best = null;

    for (var attempt = 0; attempt <= maxRetries; attempt++) {
      var result = await opts.generate(attempt);
      var v = opts.validate(result);
      var j = v.pass ? await opts.judge(result) : { score: 0, comment: "规则校验未通过，跳过质量打分" };
      var rec = { attempt: attempt + 1, pass: v.pass && j.score >= threshold, issues: v.issues || [], score: j.score, comment: j.comment };
      attempts.push(rec);

      if (!best || (v.pass && j.score > (best._score || -1))) {
        best = result; best._score = v.pass ? j.score : -1;
      }
      if (rec.pass) break;
    }

    var finalRec = attempts[attempts.length - 1];
    var report = {
      name: opts.name,
      attempts: attempts,
      retries: attempts.length - 1,
      finalPass: finalRec.pass,
      finalScore: finalRec.score,
      mode: DP.llm && DP.llm.isLive() ? "live" : "mock",
      threshold: threshold
    };

    if (best && best._score !== undefined) delete best._score;
    return { ok: finalRec.pass, result: finalRec.pass ? result : best, report: report };
  }

  return { validatePlan: validatePlan, heuristicScore: heuristicScore, gate: gate };
})();

</script>
<script>
/* DayPilot · LLM 调用层
 * 双模运行：
 *   live  — 设置里填入 DeepSeek API Key 后，走真实接口（OpenAI 兼容协议）
 *   mock  — 无 Key 时的内置模拟引擎，全流程可跑通，eval 行为一致
 */
window.DP = window.DP || {};

DP.llm = (function () {

  function S() { return DP.store.settings(); }
  function isLive() { return !!(S().apiKey && S().apiKey.trim()); }

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  /* ---------- 真实 DeepSeek 调用 ---------- */
  async function chatLive(system, user) {
    var url = (S().baseUrl || "https://api.deepseek.com").replace(/\/+$/, "") + "/chat/completions";
    var resp = await fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + S().apiKey.trim()
      },
      body: JSON.stringify({
        model: S().model || "deepseek-chat",
        messages: [
          { role: "system", content: system },
          { role: "user", content: user }
        ],
        temperature: 0.7,
        response_format: { type: "json_object" }
      })
    });
    if (!resp.ok) throw new Error("API 错误 " + resp.status + "：" + (await resp.text()).slice(0, 200));
    var data = await resp.json();
    var content = data.choices && data.choices[0] && data.choices[0].message.content;
    return parseJSON(content);
  }

  function parseJSON(text) {
    if (!text) throw new Error("模型返回为空");
    var cleaned = String(text).replace(/```json|```/g, "").trim();
    var s = cleaned.indexOf("{"), e = cleaned.lastIndexOf("}");
    var a = cleaned.indexOf("["), b = cleaned.lastIndexOf("]");
    try {
      if (a >= 0 && (s < 0 || a < s)) return JSON.parse(cleaned.slice(a, b + 1));
      return JSON.parse(cleaned.slice(s, e + 1));
    } catch (err) {
      throw new Error("模型输出不是合法 JSON");
    }
  }

  /* ---------- 规划 ---------- */
  var PLAN_SYS = "你是 DayPilot 日航的每日规划 Agent。把用户的目标池拆解成【今天】可执行的 3-5 个任务。" +
    "硬性要求：1) 任务必须具体、有动作、当天能完成；2) 标题不超过 20 字；3) priority 只能是 高/中/低，高优先级 1-2 个；" +
    "4) minutes 为预估分钟数(5-240)，所有任务总时长不得超过用户给的可用分钟数；" +
    '5) 只输出 JSON：{"tasks":[{"title":"...","priority":"高","minutes":60}]}';

  async function generatePlan(goals, hours, attempt) {
    if (isLive()) {
      var user = "目标池：\n" + goals.map(function (g, i) { return (i + 1) + ". " + g; }).join("\n") +
        "\n今日可用时长：" + Math.round(hours * 60) + " 分钟";
      if (attempt > 0) user += "\n（上一次输出未通过质量校验，请严格遵守全部硬性要求重新生成）";
      var data = await chatLive(PLAN_SYS, user);
      return data.tasks || data;
    }
    return mockPlan(goals, hours, attempt);
  }

  // Mock：第 0 次故意生成不合规输出（演示 eval 拦截），重试后合规
  async function mockPlan(goals, hours, attempt) {
    await sleep(900 + Math.random() * 600);
    var pool = DP.templates.mockPlanPool.slice();
    // 洗牌
    for (var i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
    }
    if (attempt === 0) {
      // 故意犯规：6 个任务 + 总时长超预算 → 触发 L1 拦截
      var bad = pool.slice(0, 6).map(function (t) {
        return { title: t.title, priority: t.priority, minutes: t.minutes + 20 };
      });
      return bad;
    }
    // 合规输出：按预算挑 4 个
    var budget = Math.round(hours * 60 * 0.9);
    var picked = [], total = 0;
    for (var k = 0; k < pool.length && picked.length < 4; k++) {
      if (total + pool[k].minutes <= budget) { picked.push(pool[k]); total += pool[k].minutes; }
    }
    if (picked.length < 3) picked = pool.slice(0, 3);
    return picked.map(function (t) { return { title: t.title, priority: t.priority, minutes: t.minutes }; });
  }

  /* ---------- 质量打分（L2 Judge） ---------- */
  var JUDGE_SYS = "你是严格的日计划质量评审。从可执行性、优先级结构、时长合理性、与目标的相关性四个维度给计划打分。" +
    '只输出 JSON：{"score": 0到10的整数, "comment": "一句话评语，不超过50字"}';

  async function judgePlan(tasks, goals) {
    if (isLive()) {
      var user = "目标池：" + goals.join("；") + "\n计划：" +
        tasks.map(function (t) { return "[" + t.priority + "] " + t.title + "（" + t.minutes + "分钟）"; }).join("；");
      try {
        var data = await chatLive(JUDGE_SYS, user);
        return { score: Math.max(0, Math.min(10, parseInt(data.score, 10) || 0)), comment: String(data.comment || "") };
      } catch (e) {
        return DP.eval.heuristicScore(tasks, goals, 0); // 降级
      }
    }
    await sleep(600);
    return DP.eval.heuristicScore(tasks, goals, 0);
  }

  /* ---------- 复盘 ---------- */
  var REVIEW_SYS = "你是 DayPilot 的晚间复盘教练。根据今日任务完成情况输出复盘。" +
    '只输出 JSON：{"score": 1到10的整数, "comment": "总体点评80字内", "diagnosis": "问题诊断60字内，无问题则写亮点", "suggestions": ["明日建议1","明日建议2","明日建议3"]}';

  async function generateReview(day, goals) {
    if (isLive()) {
      var user = "目标池：" + goals.join("；") + "\n今日任务：\n" +
        day.tasks.map(function (t) {
          return "- [" + t.priority + "] " + t.title + "（" + t.minutes + "分钟）" + (t.done ? " ✅完成" : " ❌未完成");
        }).join("\n");
      return await chatLive(REVIEW_SYS, user);
    }
    return mockReview(day);
  }

  async function mockReview(day) {
    await sleep(1100 + Math.random() * 600);
    var total = day.tasks.length;
    var done = day.tasks.filter(function (t) { return t.done; }).length;
    var rate = total ? done / total : 0;
    var T = DP.templates;
    var pick = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };

    var score, comment;
    if (rate >= 0.8) { score = 8 + Math.floor(Math.random() * 3); comment = pick(T.mockReviewGood); }
    else if (rate >= 0.5) { score = 5 + Math.floor(Math.random() * 3); comment = pick(T.mockReviewMid); }
    else { score = 2 + Math.floor(Math.random() * 3); comment = pick(T.mockReviewBad); }

    var highUndone = day.tasks.filter(function (t) { return t.priority === "高" && !t.done; });
    var diagnosis;
    if (!total) diagnosis = "今天没有任务记录，先让 AI 规划明天吧。";
    else if (highUndone.length) diagnosis = "高优先级任务「" + highUndone[0].title.slice(0, 16) + "」被遗留，存在优先级错配——明天把最难的事放在上午第一件事。";
    else if (rate >= 0.8) diagnosis = "亮点：高优先级任务全部清空，执行节奏健康。";
    else diagnosis = "低优先级任务完成较多但关键推进不足，明天清单先做减法。";

    var suggestions = [
      "明早开工先做 1 件高优先级任务，再碰消息和杂事",
      rate < 0.8 ? "明天任务数压到 " + Math.max(3, done) + " 件以内，先把完成率拉回 80%" : "保持当前节奏，可给明天加 1 件挑战性任务",
      "睡前花 3 分钟让 AI 预排明天，减少早晨决策成本"
    ];

    return { score: score, comment: comment, diagnosis: diagnosis, suggestions: suggestions };
  }

  /* ---------- 周报 ---------- */
  async function generateWeekly(days7) {
    var totalT = 0, doneT = 0, reviews = 0;
    days7.forEach(function (d) { totalT += d.total; doneT += d.done; if (d.hasReview) reviews++; });
    var rate = totalT ? Math.round(doneT / totalT * 100) : 0;
    var best = days7.slice().sort(function (a, b) { return b.rate - a.rate || b.done - a.done; })[0];

    if (isLive()) {
      var user = "近7天数据：" + days7.map(function (d) {
        return d.date + " 完成" + d.done + "/" + d.total;
      }).join("；") + "\n请输出 150 字内的中文周报，含数据总结、趋势判断、下周 1 条核心建议。";
      var txt = await chatLive("你是个人效能周报撰写助手，只输出JSON：{\"report\":\"...\"}", user);
      return txt.report;
    }
    await sleep(900);
    return "【DayPilot 周报】\n" +
      "本周共规划 " + totalT + " 项任务，完成 " + doneT + " 项，完成率 " + rate + "%。\n" +
      (best && best.total ? "最佳单日：" + best.date + "（" + best.done + "/" + best.total + "）。\n" : "") +
      "完成 AI 复盘 " + reviews + " 次。\n" +
      (rate >= 80 ? "趋势：执行节奏健康，建议下周维持任务粒度，适当增加挑战性目标。" :
       rate >= 50 ? "趋势：完成率中等，建议下周把每日任务数做减法，优先保住高优先级事项。" :
       "趋势：完成率偏低，建议下周降低单日规划量，先恢复「规划→完成」的正反馈循环。");
  }

  /* ---------- 连接测试 ---------- */
  async function testConnection() {
    if (!isLive()) throw new Error("尚未填写 API Key，当前为 Mock 模式");
    var data = await chatLive("只输出JSON：{\"ok\":true}", "ping");
    return data;
  }

  return {
    isLive: isLive,
    generatePlan: generatePlan,
    judgePlan: judgePlan,
    generateReview: generateReview,
    generateWeekly: generateWeekly,
    testConnection: testConnection
  };
})();

</script>
<script>
/* DayPilot · 视图层（今日 / AI规划 / 复盘 / 数据 / 设置） */
window.DP = window.DP || {};

(function () {
  var currentTab = "today";
  var WEEK = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
  var RING_C = 2 * Math.PI * 40; // 进度环周长

  var plan = { hours: 4, busy: false, result: null, report: null, picked: [] };
  var reviewBusy = false;
  var loadingTimer = null;

  /* ---------- 工具 ---------- */
  function el(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  var toastTimer = null;
  function toast(msg) {
    var t = el("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }
  function openModal(title, body, buttons) {
    el("modal").innerHTML = "<h3>" + esc(title) + "</h3><div class='modal-body'>" + body + "</div>" +
      "<div class='btn-row'>" + (buttons || "<button class='btn btn-primary btn-block' onclick='DP.ui.closeModal()'>好的</button>") + "</div>";
    el("modal-mask").classList.remove("hidden");
  }
  function closeModal() { el("modal-mask").classList.add("hidden"); }

  function pChip(p) {
    var cls = p === "高" ? "p-high" : p === "低" ? "p-low" : "p-mid";
    return "<span class='chip " + cls + "'>" + p + "</span>";
  }

  function startLoading(steps) {
    var i = 0;
    var box = el("loading-text");
    if (box) box.textContent = steps[0];
    stopLoading();
    loadingTimer = setInterval(function () {
      i = (i + 1) % steps.length;
      var b = el("loading-text");
      if (b) b.textContent = steps[i];
    }, 1000);
  }
  function stopLoading() { if (loadingTimer) { clearInterval(loadingTimer); loadingTimer = null; } }

  /* ---------- 主题 ---------- */
  function applyTheme() {
    var t = DP.store.settings().theme || "auto";
    var dark = t === "dark" || (t === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.body.classList.toggle("dark", dark);
  }

  /* ---------- 手势：左滑删除 / 右滑完成 ---------- */
  function bindSwipe() {
    var items = document.querySelectorAll(".task-item[data-id]");
    Array.prototype.forEach.call(items, function (item) {
      var id = item.getAttribute("data-id");
      var sx = 0, dx = 0, tracking = false;
      item.addEventListener("touchstart", function (e) {
        sx = e.touches[0].clientX; dx = 0; tracking = true;
      }, { passive: true });
      item.addEventListener("touchmove", function (e) {
        if (!tracking) return;
        dx = e.touches[0].clientX - sx;
        if (Math.abs(dx) > 8) item.style.transform = "translateX(" + (dx * 0.55) + "px)";
      }, { passive: true });
      item.addEventListener("touchend", function () {
        tracking = false;
        item.style.transform = "";
        if (dx > 90) {
          DP.store.toggleTask(DP.store.dateStr(), id);
          afterToggle();
        } else if (dx < -90) {
          DP.store.deleteTask(DP.store.dateStr(), id);
          toast("🗑 已删除");
          route("today");
        }
        dx = 0;
      });
    });
  }

  /* ---------- 完成反馈：震动 + 全清庆祝 ---------- */
  function afterToggle() {
    if (navigator.vibrate) { try { navigator.vibrate(18); } catch (e) {} }
    var st = DP.store.dayStats(DP.store.dateStr());
    route("today");
    if (st.total > 0 && st.done === st.total) setTimeout(confetti, 280);
  }

  function confetti() {
    var colors = ["#4f6df5", "#ffd166", "#16a34a", "#e5484d", "#3b82f6", "#a855f7"];
    for (var i = 0; i < 42; i++) {
      (function (i) {
        var p = document.createElement("div");
        p.className = "confetti-piece";
        p.style.left = (Math.random() * 100) + "vw";
        p.style.background = colors[i % colors.length];
        p.style.width = (6 + Math.random() * 6) + "px";
        p.style.height = (10 + Math.random() * 8) + "px";
        p.style.animationDuration = (1.6 + Math.random() * 1.4) + "s";
        p.style.animationDelay = (Math.random() * 0.35) + "s";
        p.style.transform = "rotate(" + Math.floor(Math.random() * 360) + "deg)";
        document.body.appendChild(p);
        setTimeout(function () { if (p.parentNode) p.parentNode.removeChild(p); }, 3600);
      })(i);
    }
    toast("🎉 今日事今日毕！");
  }

  /* ---------- 数字滚动动画 ---------- */
  function animateCounts() {
    var nodes = document.querySelectorAll("[data-count]");
    Array.prototype.forEach.call(nodes, function (b) {
      var target = parseInt(b.getAttribute("data-count"), 10) || 0;
      var pre = b.getAttribute("data-prefix") || "";
      var suf = b.getAttribute("data-suffix") || "";
      var t0 = null, dur = 750;
      function step(ts) {
        if (!t0) t0 = ts;
        var p = Math.min(1, (ts - t0) / dur);
        var v = Math.round(target * (1 - Math.pow(1 - p, 3)));
        b.textContent = pre + v + suf;
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }

  /* ---------- 导航 ---------- */
  var TABS = [
    { id: "today", ico: "📋", lbl: "今日" },
    { id: "plan", ico: "🤖", lbl: "AI规划" },
    { id: "review", ico: "🌙", lbl: "复盘" },
    { id: "stats", ico: "📊", lbl: "数据" },
    { id: "settings", ico: "⚙️", lbl: "设置" }
  ];

  function renderTabbar() {
    el("tabbar").innerHTML = TABS.map(function (t) {
      return "<div class='tab" + (t.id === currentTab ? " active" : "") + "' onclick=\"DP.ui.switchTab('" + t.id + "')\">" +
        "<span class='ico'>" + t.ico + "</span><span class='lbl'>" + t.lbl + "</span></div>";
    }).join("");
  }

  function route(tab) {
    currentTab = tab;
    renderTabbar();
    var v = el("view");
    v.className = "tab-" + tab;
    if (tab === "today") v.innerHTML = vToday();
    else if (tab === "plan") v.innerHTML = vPlan();
    else if (tab === "review") v.innerHTML = vReview();
    else if (tab === "stats") v.innerHTML = vStats();
    else if (tab === "settings") v.innerHTML = vSettings();
    if (tab === "today") bindSwipe();
    if (tab === "stats") animateCounts();
    window.scrollTo(0, 0);
  }

  /* ========== 视图：今日 ========== */
  function vToday() {
    var ds = DP.store.dateStr();
    var day = DP.store.getDay(ds);
    var st = DP.store.dayStats(ds);
    var d = new Date();
    var rate = st.total ? st.done / st.total : 0;
    var offset = RING_C * (1 - rate);
    var streak = DP.store.streak();

    var html = "<div class='page-head'><h1>今天 · " + (d.getMonth() + 1) + "月" + d.getDate() + "日 " + WEEK[d.getDay()] + "</h1>" +
      "<div class='sub'>DayPilot 日航 · " + (DP.llm.isLive() ? "DeepSeek 已接入" : "Mock 演示模式") + "</div></div>";

    html += "<div class='today-layout'><div class='card hero'>" +
      "<div class='ring-wrap'><svg width='92' height='92'>" +
      "<circle cx='46' cy='46' r='40' stroke='#eef1fe' stroke-width='8' fill='none'/>" +
      "<circle cx='46' cy='46' r='40' stroke='" + (rate >= 1 ? "#16a34a" : "#4f6df5") + "' stroke-width='8' fill='none' stroke-linecap='round' " +
      "stroke-dasharray='" + RING_C.toFixed(1) + "' stroke-dashoffset='" + offset.toFixed(1) + "'/></svg>" +
      "<div class='ring-num'><b>" + st.done + "/" + st.total + "</b><span>已完成</span></div></div>" +
      "<div class='hero-info'><h2>" + (st.total === 0 ? "今天还没安排" : rate >= 1 ? "今日事今日毕 🎉" : rate >= 0.5 ? "过半了，继续" : "稳步前进中") + "</h2>" +
      "<div class='muted'>" + (st.total === 0 ? "让 AI 帮你把目标拆成今天的事" : "完成率 " + Math.round(rate * 100) + "% · 预计 " + day.tasks.reduce(function (s, t) { return s + (t.done ? 0 : t.minutes); }, 0) + " 分钟收尾") + "</div>" +
      (streak > 0 ? "<span class='streak-badge'>🔥 连续全清 " + streak + " 天</span>" : "") +
      "</div></div>";

    if (st.total === 0) {
      html += "<div class='card empty'><div class='emoji'>🧭</div>" +
        "<p>早上花 1 分钟规划，晚上少 1 小时后悔。<br>选一个方式开始今天：</p>" +
        "<div class='btn-row'><button class='btn btn-primary' onclick='DP.ui.useTemplate()'>🎓 秋招模板</button>" +
        "<button class='btn' onclick=\"DP.ui.switchTab('plan')\">🤖 AI 规划</button></div></div>";
    } else {
      var sorted = day.tasks.slice().sort(function (a, b) {
        var w = { "高": 0, "中": 1, "低": 2 };
        return (a.done - b.done) || (w[a.priority] - w[b.priority]);
      });
      html += "<div class='task-list'>" + sorted.map(function (t) {
        return "<div class='task-item" + (t.done ? " done" : "") + "' data-id='" + t.id + "'>" +
          "<div class='task-check' onclick=\"DP.ui.toggleTask('" + t.id + "')\">✓</div>" +
          "<div class='task-body'><div class='task-title' onclick=\"DP.ui.openEdit('" + t.id + "')\">" + esc(t.title) + "</div>" +
          "<div class='task-meta'>" + pChip(t.priority) + "<span class='chip chip-time'>⏱ " + t.minutes + " 分钟</span></div></div>" +
          "<button class='task-del' onclick=\"DP.ui.delTask('" + t.id + "')\">×</button></div>";
      }).join("") + "</div>";

      html += "<div class='today-side'><div class='card'><div class='card-title'>➕ 临时加一件</div>" +
        "<div class='btn-row' style='align-items:stretch'>" +
        "<input type='text' id='quick-input' placeholder='任务内容…' style='flex:3'>" +
        "<select id='quick-priority' style='flex:1'><option>高</option><option selected>中</option><option>低</option></select>" +
        "<button class='btn btn-primary' style='flex:1' onclick='DP.ui.addQuickTask()'>添加</button></div></div>";

      html += "<div class='btn-row'>" +
        "<button class='btn' onclick='DP.ui.syncICS()'>📅 同步到日历</button>" +
        "<button class='btn btn-primary' onclick=\"DP.ui.switchTab('review')\">🌙 晚间复盘</button></div></div>";
    }
    html += "</div>";
    return html;
  }

  /* ========== 视图：AI 规划 ========== */
  function vPlan() {
    var goals = DP.store.goals().join("\n");
    var html = "<div class='page-head'><h1>🤖 AI 规划今天</h1><div class='sub'>目标池 → DeepSeek 拆解 → eval 质量门 → 今日清单</div></div>";

    html += "<div class='card'><div class='card-title'>🎯 我的目标池</div>" +
      "<textarea id='goals-input' rows='4' placeholder='每行一个目标…'>" + esc(goals) + "</textarea>" +
      "<div style='margin-top:10px'><button class='btn btn-ghost' onclick='DP.ui.saveGoals()'>💾 保存目标池</button></div></div>";

    html += "<div class='card'><div class='card-title'>⏳ 今天可用时长</div>" +
      "<div class='slider-row'><input type='range' min='1' max='10' step='0.5' value='" + plan.hours + "' oninput=\"DP.ui.setHours(this.value)\">" +
      "<span class='slider-val' id='hours-val'>" + plan.hours + "h</span></div>" +
      "<button class='btn btn-primary btn-block' style='margin-top:14px' " + (plan.busy ? "disabled" : "") + " onclick='DP.ui.runPlan()'>✨ 生成今日计划</button></div>";

    if (plan.busy) {
      html += "<div class='card loading-steps'><div class='spinner'></div><div class='step-text' id='loading-text'>🤖 AI 正在拆解目标…</div></div>" +
        "<div class='card'><div class='skel skel-row'></div><div class='skel skel-row' style='width:94%'></div><div class='skel skel-row' style='width:86%'></div></div>";
    }

    if (!plan.busy && plan.result) {
      var r = plan.report;
      var badgeCls = r.finalPass ? "ok" : "warn";
      var badgeTxt = r.finalPass
        ? (r.retries === 0 ? "✅ eval 质量门：一次通过" : "🔁 eval 质量门：拦截不合规输出，重试 " + r.retries + " 次后通过")
        : "⚠️ eval：多次重试未完全达标，已采用最佳结果";
      html += "<div class='eval-badge " + badgeCls + "'>" + badgeTxt + "<span class='score'>" + r.finalScore + "/10</span></div>";
      if (r.retries > 0 && r.attempts[0].issues.length) {
        html += "<div class='eval-issues'>首次输出被拦截原因：" + r.attempts[0].issues.map(esc).join("；") + "</div>";
      }
      html += "<div class='card' style='margin-top:12px'><div class='card-title'>📋 AI 建议清单（点选采纳）</div>";
      html += plan.result.map(function (t, i) {
        return "<div class='plan-pick" + (plan.picked[i] ? " on" : "") + "' onclick='DP.ui.togglePick(" + i + ")'>" +
          "<div class='dot'>✓</div><div class='task-body'><div class='task-title'>" + esc(t.title) + "</div>" +
          "<div class='task-meta'>" + pChip(t.priority) + "<span class='chip chip-time'>⏱ " + t.minutes + " 分钟</span></div></div></div>";
      }).join("");
      html += "<button class='btn btn-primary btn-block' style='margin-top:10px' onclick='DP.ui.adoptPlan()'>📥 加入今日清单</button></div>";
    }
    return html;
  }

  /* ========== 视图：复盘 ========== */
  function vReview() {
    var ds = DP.store.dateStr();
    var day = DP.store.getDay(ds);
    var st = DP.store.dayStats(ds);

    var html = "<div class='page-head'><h1>🌙 晚间复盘</h1><div class='sub'>AI 教练根据今日完成度打分 · 诊断 · 给明日建议</div></div>";

    html += "<div class='card'><div class='card-title'>📌 今日战况</div>" +
      "<div class='muted'>完成 " + st.done + " / " + st.total + " 项 · 完成率 " + Math.round(st.rate * 100) + "%</div></div>";

    if (!day.review) {
      html += "<button class='btn btn-primary btn-block' " + (reviewBusy ? "disabled" : "") + " onclick='DP.ui.runReview()'>" +
        (reviewBusy ? "复盘中…" : "✨ 生成 AI 复盘") + "</button>";
      if (reviewBusy) html += "<div class='card loading-steps' style='margin-top:14px'><div class='spinner'></div><div class='step-text' id='loading-text'>🌙 AI 教练复盘ing…</div></div>";
    } else {
      var rv = day.review;
      html += "<div class='card'><div class='score-dial'><span class='num'>" + rv.score + "</span><span class='of'> / 10</span></div>" +
        "<div class='review-block'><div class='rb-title'>💬 总体点评</div><p>" + esc(rv.comment) + "</p></div>" +
        "<div class='review-block'><div class='rb-title'>🔍 诊断</div><p>" + esc(rv.diagnosis) + "</p></div>" +
        "<div class='review-block'><div class='rb-title'>🚀 明日建议</div><ul>" +
        rv.suggestions.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ul></div>" +
        "<hr class='sep'><button class='btn btn-ghost btn-block' onclick='DP.ui.rerunReview()'>🔄 重新生成</button></div>";
    }

    var hist = DP.store.lastNDays(7).filter(function (d) { return d.total > 0; });
    if (hist.length) {
      html += "<div class='card' style='margin-top:14px'><div class='card-title'>🗓 近 7 天完成率</div>" +
        hist.map(function (d) {
          return "<div class='history-item'><span class='date'>" + d.label + "</span>" +
            "<div class='bar'><i style='width:" + Math.round(d.rate * 100) + "%'></i></div>" +
            "<span class='pct'>" + Math.round(d.rate * 100) + "%</span></div>";
        }).join("") + "</div>";
    }
    return html;
  }

  /* ========== 视图：数据 ========== */
  function vStats() {
    var days7 = DP.store.lastNDays(7);
    var streak = DP.store.streak();
    var totT = 0, doneT = 0;
    days7.forEach(function (d) { totT += d.total; doneT += d.done; });
    var rate7 = totT ? Math.round(doneT / totT * 100) : 0;
    var todayDs = DP.store.dateStr();

    var html = "<div class='page-head'><h1>📊 数据看板</h1><div class='sub'>行为量化 · eval 日志全量留痕</div></div>";

    html += "<div class='stat-grid'>" +
      "<div class='stat-cell'><b data-count='" + streak + "' data-prefix='🔥 '>0</b><span>连续全清(天)</span></div>" +
      "<div class='stat-cell'><b data-count='" + rate7 + "' data-suffix='%'>0</b><span>7日完成率</span></div>" +
      "<div class='stat-cell'><b data-count='" + doneT + "'>0</b><span>7日完成项</span></div></div>";

    html += "<div class='card'><div class='card-title'>📈 近 7 天</div><div class='week-chart'>" +
      days7.map(function (d) {
        var h = Math.max(4, Math.round(d.rate * 90));
        return "<div class='week-col" + (d.date === todayDs ? " today" : "") + "'>" +
          "<div class='col-bar' style='height:" + h + "px' title='" + d.done + "/" + d.total + "'></div>" +
          "<div class='col-label'>" + d.label + "</div></div>";
      }).join("") + "</div></div>";

    html += "<button class='btn btn-primary btn-block' onclick='DP.ui.runWeekly()'>📝 生成本周周报</button>";

    var logs = DP.store.evalLogs();
    html += "<div class='card' style='margin-top:14px'><div class='card-title'>🔍 Eval 评估日志（LLM 输出质量留痕）</div>";
    if (!logs.length) html += "<div class='muted'>还没有记录。去「AI规划」生成一次今日计划，质量门的工作过程会记在这里。</div>";
    else html += logs.slice(0, 10).map(function (l) {
      var dt = new Date(l.ts);
      var time = (dt.getMonth() + 1) + "/" + dt.getDate() + " " + String(dt.getHours()).padStart(2, "0") + ":" + String(dt.getMinutes()).padStart(2, "0");
      return "<div class='eval-log-item'><div class='el-head'><span>" + (l.name === "plan" ? "📋 规划" : l.name === "review" ? "🌙 复盘" : esc(l.name)) +
        " · " + (l.finalPass ? "✅ 通过" : "⚠️ 未达标") + "</span><span>" + (l.finalScore != null ? l.finalScore + "/10" : "") + "</span></div>" +
        "<div class='el-detail'>" + time + " · " + (l.mode === "live" ? "DeepSeek" : "Mock") + " · 重试 " + l.retries + " 次" +
        (l.issues && l.issues.length ? "<br>首次拦截：" + l.issues.map(esc).join("；") : "") + "</div></div>";
    }).join("");
    html += "</div>";
    return html;
  }

  /* ========== 视图：设置 ========== */
  function vSettings() {
    var s = DP.store.settings();
    var live = DP.llm.isLive();
    var html = "<div class='page-head'><h1>⚙️ 设置</h1></div>";

    html += "<div class='card'><div class='card-title'>🧠 AI 引擎 &nbsp;" +
      (live ? "<span class='mode-pill live'>● DeepSeek 已接入</span>" : "<span class='mode-pill mock'>● Mock 演示模式</span>") + "</div>" +
      "<label class='field'><span class='label'>DeepSeek API Key（仅存在本机浏览器）</span>" +
      "<input type='password' id='set-key' value='" + esc(s.apiKey) + "' placeholder='sk-…'></label>" +
      "<label class='field'><span class='label'>Base URL</span><input type='url' id='set-base' value='" + esc(s.baseUrl) + "'></label>" +
      "<label class='field'><span class='label'>模型</span><input type='text' id='set-model' value='" + esc(s.model) + "'></label>" +
      "<div class='btn-row'><button class='btn btn-primary' onclick='DP.ui.saveSettings()'>💾 保存</button>" +
      "<button class='btn' onclick='DP.ui.testApi()'>🔌 测试连接</button></div>" +
      "<div class='muted' style='margin-top:10px'>不填 Key 也能完整体验全部功能（Mock 模式）；填入后自动切换真实 DeepSeek 接口。</div></div>";

    html += "<div class='card'><div class='card-title'>🎨 外观</div><div class='btn-row'>" +
      [["auto", "跟随系统"], ["light", "浅色"], ["dark", "深色"]].map(function (m) {
        var on = (s.theme || "auto") === m[0];
        return "<button class='btn" + (on ? " btn-primary" : "") + "' onclick=\"DP.ui.setTheme('" + m[0] + "')\">" + m[1] + "</button>";
      }).join("") + "</div></div>";

    html += "<div class='card'><div class='card-title'>💾 数据</div>" +
      "<div class='btn-row'><button class='btn' onclick='DP.ui.exportData()'>📤 导出 JSON</button>" +
      "<button class='btn' onclick=\"document.getElementById('import-file').click()\">📥 导入 JSON</button></div>" +
      "<input type='file' id='import-file' accept='.json' class='hidden' onchange='DP.ui.importData(event)'>" +
      "<hr class='sep'><button class='btn btn-ghost btn-block' style='color:#e5484d' onclick='DP.ui.resetData()'>🗑 清空并重置全部数据</button></div>";

    html += "<div class='card'><div class='card-title'>ℹ️ 关于 DayPilot 日航</div>" +
      "<div class='muted' style='line-height:1.8'>早规划 · 晚复盘 · 数据说话。<br>" +
      "带 LLM 输出质量评估流水线（规则校验 + 模型打分 + 自动重试）的个人效能 Agent。<br>" +
      "数据 100% 存本机，开源免费。</div></div>";
    return html;
  }

  /* ========== 交互 ========== */
  DP.ui = {
    switchTab: function (tab) { route(tab); },
    closeModal: closeModal,

    toggleTask: function (id) {
      DP.store.toggleTask(DP.store.dateStr(), id);
      afterToggle();
    },
    delTask: function (id) {
      DP.store.deleteTask(DP.store.dateStr(), id);
      route("today");
    },
    addQuickTask: function () {
      var inp = el("quick-input");
      var title = inp.value.trim();
      if (!title) { toast("先写点内容"); return; }
      DP.store.addTask(DP.store.dateStr(), { title: title, priority: el("quick-priority").value, minutes: 30 });
      toast("已加入今日清单");
      route("today");
    },
    useTemplate: function () {
      DP.store.addTasks(DP.store.dateStr(), DP.templates.qiuzhaoTasks);
      DP.store.markOnboarded();
      toast("🎓 秋招模板已就位，开干！");
      route("today");
    },
    syncICS: function () {
      var ds = DP.store.dateStr();
      var tasks = DP.store.getDay(ds).tasks;
      if (DP.ics.download(tasks, ds)) toast("📅 已导出日历文件，打开即可写入手机日历");
      else toast("今天还没有任务");
    },

    saveGoals: function () {
      var lines = el("goals-input").value.split("\n").map(function (s) { return s.trim(); });
      DP.store.setGoals(lines);
      toast("目标池已保存");
    },
    setHours: function (v) {
      plan.hours = parseFloat(v);
      el("hours-val").textContent = plan.hours + "h";
    },
    togglePick: function (i) {
      plan.picked[i] = !plan.picked[i];
      route("plan");
    },

    runPlan: async function () {
      var goals = DP.store.goals();
      if (!goals.length) { toast("先保存目标池"); return; }
      plan.busy = true; plan.result = null; plan.report = null;
      route("plan");
      startLoading(["🤖 AI 正在拆解目标…", "🔍 L1 规则校验中…", "⚖️ L2 质量打分中…", "🔁 质量门复核中…"]);
      try {
        var res = await DP.eval.gate({
          name: "plan",
          generate: function (attempt) { return DP.llm.generatePlan(goals, plan.hours, attempt); },
          validate: function (t) { return DP.eval.validatePlan(t, Math.round(plan.hours * 60)); },
          judge: function (t) { return DP.llm.judgePlan(t, goals); },
          threshold: 7, maxRetries: 2
        });
        plan.result = res.result;
        plan.report = res.report;
        plan.picked = res.result.map(function () { return true; });
        DP.store.setPlanReport(DP.store.dateStr(), res.report);
        DP.store.logEval({
          name: "plan", retries: res.report.retries, finalPass: res.report.finalPass,
          finalScore: res.report.finalScore, mode: res.report.mode,
          issues: res.report.attempts[0] ? res.report.attempts[0].issues : []
        });
      } catch (e) {
        toast("生成失败：" + e.message);
      }
      plan.busy = false;
      stopLoading();
      route("plan");
    },

    adoptPlan: function () {
      var chosen = plan.result.filter(function (t, i) { return plan.picked[i]; });
      if (!chosen.length) { toast("至少选 1 件"); return; }
      DP.store.addTasks(DP.store.dateStr(), chosen);
      toast("📥 已加入今日清单，开干！");
      plan.result = null; plan.report = null;
      route("today");
    },

    runReview: async function () {
      var day = DP.store.getDay();
      if (!day.tasks.length) { toast("今天还没有任务，先规划一下"); return; }
      reviewBusy = true;
      route("review");
      startLoading(["🌙 AI 教练复盘ing…", "🔍 输出结构校验中…"]);
      try {
        var attempts = [], review = null;
        for (var i = 0; i < 2; i++) {
          var r = await DP.llm.generateReview(day, DP.store.goals());
          var issues = [];
          if (!r || typeof r !== "object") issues.push("输出不是合法对象");
          else {
            if (!(r.score >= 1 && r.score <= 10)) issues.push("score 不在 1-10");
            if (!r.comment) issues.push("缺少总体点评");
            if (!Array.isArray(r.suggestions) || !r.suggestions.length) issues.push("缺少明日建议");
          }
          attempts.push({ attempt: i + 1, pass: !issues.length, issues: issues, score: r && r.score });
          if (!issues.length) { review = r; break; }
        }
        if (!review) review = { score: 5, comment: "复盘生成异常，这是兜底结果。", diagnosis: "LLM 输出连续未通过校验。", suggestions: ["明天再试一次复盘"] };
        DP.store.setReview(DP.store.dateStr(), review);
        DP.store.logEval({
          name: "review", retries: attempts.length - 1, finalPass: !!attempts[attempts.length - 1].pass,
          finalScore: review.score, mode: DP.llm.isLive() ? "live" : "mock", issues: attempts[0].issues
        });
      } catch (e) {
        toast("复盘失败：" + e.message);
      }
      reviewBusy = false;
      stopLoading();
      route("review");
    },
    rerunReview: function () {
      DP.store.setReview(DP.store.dateStr(), null);
      DP.ui.runReview();
    },

    runWeekly: async function () {
      toast("📝 周报生成中…");
      try {
        var report = await DP.llm.generateWeekly(DP.store.lastNDays(7));
        openModal("📝 本周周报", esc(report),
          "<button class='btn' onclick='DP.ui.closeModal()'>关闭</button>" +
          "<button class='btn btn-primary' onclick='DP.ui.copyText(" + JSON.stringify(JSON.stringify(report)) + ")'>📋 复制</button>");
      } catch (e) {
        toast("生成失败：" + e.message);
      }
    },
    copyText: function (text) {
      var t = JSON.parse(text);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(t).then(function () { toast("已复制"); }, function () { toast("复制失败"); });
      } else {
        var ta = document.createElement("textarea");
        ta.value = t; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); toast("已复制"); } catch (e) { toast("复制失败"); }
        document.body.removeChild(ta);
      }
    },

    saveSettings: function () {
      DP.store.setSettings({
        apiKey: el("set-key").value.trim(),
        baseUrl: el("set-base").value.trim() || "https://api.deepseek.com",
        model: el("set-model").value.trim() || "deepseek-chat"
      });
      toast("已保存");
      route("settings");
    },
    testApi: async function () {
      DP.ui.saveSettings();
      toast("🔌 测试连接中…");
      try {
        await DP.llm.testConnection();
        toast("✅ DeepSeek 连接成功");
      } catch (e) {
        toast("❌ " + e.message);
      }
    },
    exportData: function () {
      var blob = new Blob([DP.store.exportJSON()], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "daypilot-backup-" + DP.store.dateStr().replace(/-/g, "") + ".json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
      toast("已导出备份文件");
    },
    importData: function (evt) {
      var file = evt.target.files && evt.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          DP.store.importJSON(reader.result);
          toast("✅ 导入成功");
          route("today");
        } catch (e) { toast("❌ 导入失败：" + e.message); }
      };
      reader.readAsText(file);
      evt.target.value = "";
    },
    resetData: function () {
      openModal("确认清空？", "将删除本机全部任务、复盘与设置，且不可恢复。",
        "<button class='btn' onclick='DP.ui.closeModal()'>取消</button>" +
        "<button class='btn btn-primary' style='background:#e5484d' onclick='DP.ui.doReset()'>确认清空</button>");
    },
    doReset: function () {
      DP.store.resetAll();
      plan.result = null; plan.report = null;
      closeModal();
      toast("已重置");
      route("today");
    },

    setTheme: function (mode) {
      DP.store.setSettings({ theme: mode });
      applyTheme();
      route("settings");
    },

    openEdit: function (id) {
      var day = DP.store.getDay();
      var t = null;
      day.tasks.forEach(function (x) { if (x.id === id) t = x; });
      if (!t) return;
      openModal("✏️ 编辑任务",
        "<label class='field'><span class='label'>任务内容</span><input type='text' id='edit-title' value='" + esc(t.title) + "'></label>" +
        "<div class='btn-row' style='align-items:stretch'>" +
        "<select id='edit-priority' style='flex:1'>" +
        ["高", "中", "低"].map(function (p) { return "<option" + (p === t.priority ? " selected" : "") + ">" + p + "</option>"; }).join("") +
        "</select>" +
        "<input type='text' id='edit-minutes' inputmode='numeric' style='flex:1' value='" + t.minutes + "'></div>" +
        "<div class='muted' style='margin-top:8px'>左边选优先级，右边填预估分钟数</div>",
        "<button class='btn' onclick='DP.ui.closeModal()'>取消</button>" +
        "<button class='btn btn-primary' onclick=\"DP.ui.saveEdit('" + id + "')\">保存</button>");
    },
    saveEdit: function (id) {
      var title = el("edit-title").value.trim();
      if (!title) { toast("内容不能为空"); return; }
      var mins = parseInt(el("edit-minutes").value, 10) || 30;
      mins = Math.max(5, Math.min(240, mins));
      DP.store.editTask(DP.store.dateStr(), id, { title: title, priority: el("edit-priority").value, minutes: mins });
      closeModal();
      toast("已保存");
      route("today");
    },

    skipOnboard: function () {
      DP.store.markOnboarded();
      closeModal();
    },
    startTemplate: function () {
      DP.store.markOnboarded();
      closeModal();
      DP.ui.useTemplate();
    }
  };

  /* ---------- 启动 ---------- */
  DP.store.init();
  applyTheme();
  if (window.matchMedia) {
    try {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
    } catch (e) {}
  }
  route("today");
  if (!DP.store.isOnboarded()) {
    openModal("🧭 欢迎使用 DayPilot 日航",
      "每天 3 步，让 AI 带你过一天：<br><br>" +
      "🌅 <b>早</b> · AI 把目标拆成今日 3-5 件事<br>" +
      "☀️ <b>白天</b> · 勾选打卡，一键同步手机日历<br>" +
      "🌙 <b>晚</b> · AI 复盘打分，给明日建议<br><br>" +
      "所有 AI 输出都要过 <b>eval 质量门</b>（规则校验 + 模型打分），不达标自动重试——全程在「数据」页留痕。",
      "<button class='btn' onclick='DP.ui.skipOnboard()'>随便看看</button>" +
      "<button class='btn btn-primary' onclick='DP.ui.startTemplate()'>🎓 秋招模板开始</button>");
  }
})();

</script>
<script>
/* DayPilot · 桌面端粒子背景（星座连线 + 鼠标引力）
 * 仅 ≥900px 渲染；尊重 prefers-reduced-motion；随深浅色自动调色
 */
(function () {
  var canvas = document.getElementById("bg-canvas");
  if (!canvas) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, parts = [];
  var mouse = { x: -9999, y: -9999 };
  var N = 72, LINK = 130, MAX_SPEED = 0.42;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function make() {
    parts = [];
    for (var i = 0; i < N; i++) {
      parts.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * MAX_SPEED,
        vy: (Math.random() - 0.5) * MAX_SPEED,
        r: 1.2 + Math.random() * 1.9
      });
    }
  }

  function isDark() { return document.body.classList.contains("dark"); }

  function tick() {
    if (window.innerWidth >= 900) {
      ctx.clearRect(0, 0, W, H);
      var dark = isDark();
      var i, j, p, a, b, dx, dy, d;

      for (i = 0; i < parts.length; i++) {
        p = parts[i];
        // 鼠标轻引力
        dx = mouse.x - p.x; dy = mouse.y - p.y;
        d = dx * dx + dy * dy;
        if (d < 25600 && d > 4) { p.vx += dx * 0.000012 * Math.sqrt(d); p.vy += dy * 0.000012 * Math.sqrt(d); }
        p.x += p.vx; p.y += p.vy;
        // 限速 & 保速（防止被鼠标吸停）
        var sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        if (sp > MAX_SPEED) { p.vx = p.vx / sp * MAX_SPEED; p.vy = p.vy / sp * MAX_SPEED; }
        else if (sp < 0.1) { var ang = Math.random() * 6.283; p.vx = Math.cos(ang) * 0.2; p.vy = Math.sin(ang) * 0.2; }
        // 环绕边界
        if (p.x < -24) p.x = W + 24; if (p.x > W + 24) p.x = -24;
        if (p.y < -24) p.y = H + 24; if (p.y > H + 24) p.y = -24;
      }

      // 连线
      for (i = 0; i < parts.length; i++) {
        for (j = i + 1; j < parts.length; j++) {
          a = parts[i]; b = parts[j];
          dx = a.x - b.x; dy = a.y - b.y;
          d = Math.sqrt(dx * dx + dy * dy);
          if (d < LINK) {
            var alpha = (1 - d / LINK) * (dark ? 0.22 : 0.16);
            ctx.strokeStyle = dark ? "rgba(126,143,248," + alpha + ")" : "rgba(79,109,245," + alpha + ")";
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
        }
      }

      // 粒子点
      ctx.fillStyle = dark ? "rgba(126,143,248,.5)" : "rgba(79,109,245,.32)";
      for (i = 0; i < parts.length; i++) {
        p = parts[i];
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
      }
    }
    requestAnimationFrame(tick);
  }

  resize(); make();
  window.addEventListener("resize", function () { resize(); make(); });
  window.addEventListener("mousemove", function (e) { mouse.x = e.clientX; mouse.y = e.clientY; });
  document.addEventListener("mouseleave", function () { mouse.x = -9999; mouse.y = -9999; });
  requestAnimationFrame(tick);
})();

</script>
