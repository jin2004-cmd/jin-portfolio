<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>正在前往 · 金佳信 项目作品集</title>
<meta http-equiv="refresh" content="0; url=index.html">
<link rel="canonical" href="index.html">
<style>
  :root{--ink:#08090b;--acid:#dff43c;--muted:#98a0ad}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ink);color:#edeef1;display:grid;place-items:center;
       font-family:"PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif}
  .box{text-align:center;padding:24px}
  .mark{width:46px;height:46px;margin:0 auto 20px;border:1px solid rgba(223,244,60,.5);border-radius:12px;
        display:grid;place-items:center;color:var(--acid);font:700 15px/1 monospace;
        background:linear-gradient(150deg,rgba(223,244,60,.16),transparent)}
  .bar{width:180px;height:2px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden;margin:0 auto 18px}
  .bar i{display:block;height:100%;width:40%;background:var(--acid);animation:go 1.1s cubic-bezier(.2,.7,.2,1) infinite}
  @keyframes go{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
  p{color:var(--muted);font-size:13.5px;line-height:1.8;margin:0}
  a{color:var(--acid);text-decoration:none;border-bottom:1px dotted rgba(223,244,60,.5)}
</style>
</head>
<body>
  <div class="box">
    <div class="mark">JJ</div>
    <div class="bar"><i></i></div>
    <p>正在前往项目作品集首页……<br>
       如果没有自动跳转，请点这里 <a href="index.html">打开作品集</a></p>
  </div>
  <script>location.replace('index.html');</script>
</body>
</html>
