<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="运营工作台 2.0：选题评分、内容日历、素材状态机、发布清单、数据复盘（手绘 Canvas 趋势图）、合规预检、周报导出。单文件离线可用，数据存本地。">
<title>运营工作台 2.0 · OPS-01</title>
<style>
/* ===== 设计变量：深墨底 + 暖白展签 + 单一香槟金 ===== */
:root{
  --ink:#0A0B0D; --ink2:#121417; --ink3:#1B1E23; --ink4:#0C0D0F;
  --paper:#F2EDE4; --paper2:#B9B3A7; --paper3:#8A857B;
  --accent:#E8B25C; --accent-dim:rgba(232,178,92,.14);
  --line:rgba(242,237,228,.14); --line2:rgba(242,237,228,.07);
  --ok:#7FB08A; --warn:#E8B25C; --bad:#E0715F; --info:#8FA9D0;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono","JetBrains Mono",Consolas,"Liberation Mono",monospace;
  --r:3px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:
  radial-gradient(1100px 560px at 12% -12%,rgba(232,178,92,.05),transparent 62%),
  radial-gradient(900px 460px at 92% -6%,rgba(242,237,228,.035),transparent 58%),
  var(--ink);
  color:var(--paper);font-size:14px;line-height:1.62;min-height:100vh;
  -webkit-font-smoothing:antialiased}
::selection{background:rgba(232,178,92,.28);color:var(--paper)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font-family:inherit;font-size:13px;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.skip{position:fixed;left:12px;top:-60px;z-index:200;background:var(--accent);color:#16120a;padding:8px 14px;border-radius:var(--r);font-weight:600;transition:top .15s}
.skip:focus{top:12px;text-decoration:none}

/* ===== 布局 ===== */
.app{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh}
.side{border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;
  display:flex;flex-direction:column;gap:18px;padding:22px 14px 18px;
  background:linear-gradient(180deg,rgba(18,20,23,.86),rgba(10,11,13,.96))}
.brand{padding:0 8px 2px}
.brand-top{display:flex;align-items:center;gap:8px}
.brand-no{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--accent);border:1px solid rgba(232,178,92,.4);padding:1px 6px;border-radius:2px}
.brand-tag{font-family:var(--mono);font-size:11px;color:var(--paper3);letter-spacing:.08em}
.brand-name{font-size:19px;font-weight:650;letter-spacing:.06em;margin-top:9px}
.brand-sub{font-size:11.5px;color:var(--paper3);margin-top:3px;letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;
  border-left:2px solid transparent;color:var(--paper2);padding:7px 9px;font-size:13px;letter-spacing:.02em;transition:background .12s,color .12s}
.nav button:hover{background:rgba(242,237,228,.045);color:var(--paper)}
.nav button .no{font-family:var(--mono);font-size:10.5px;color:var(--paper3);letter-spacing:.06em;width:20px;flex:none}
.nav button .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav button .ct{font-family:var(--mono);font-size:10.5px;color:var(--paper3);flex:none}
.nav button[aria-current="page"]{color:var(--paper);background:linear-gradient(90deg,var(--accent-dim),transparent 85%);border-left-color:var(--accent)}
.nav button[aria-current="page"] .no{color:var(--accent)}
.nav button[aria-current="page"] .ct{color:var(--accent)}
.side-foot{margin-top:auto;border-top:1px solid var(--line2);padding:12px 8px 0;display:flex;flex-direction:column;gap:7px}
.seedline{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;color:var(--paper2);letter-spacing:.03em}
.dot{width:6px;height:6px;border-radius:50%;background:var(--paper3);flex:none}
.dot-ok{background:var(--ok);box-shadow:0 0 0 3px rgba(127,176,138,.12)}
.dot-bad{background:var(--bad)}
.tiny{font-size:11px;color:var(--paper3);line-height:1.5}
kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-bottom-width:2px;border-radius:2px;padding:0 4px;color:var(--paper2)}
.main{padding:26px clamp(16px,3.2vw,42px) 64px;min-width:0;max-width:1320px;width:100%;margin:0 auto}
.foot{margin-top:44px;padding-top:16px;border-top:1px solid var(--line2);font-family:var(--mono);font-size:10.5px;color:var(--paper3);letter-spacing:.03em;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ===== 页头 ===== */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:22px}
.kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--accent);text-transform:uppercase}
.page-title{font-size:25px;font-weight:650;letter-spacing:.04em;line-height:1.25;margin-top:5px;display:flex;align-items:baseline;gap:10px}
.page-title small{font-family:var(--mono);font-size:11px;color:var(--paper3);letter-spacing:.08em;font-weight:400}
.page-sub{font-size:12.5px;color:var(--paper2);margin-top:6px;max-width:64ch}
.page-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ===== 卡片与栅格 ===== */
.card{background:linear-gradient(180deg,rgba(18,20,23,.96),rgba(18,20,23,.9));border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card + .card{margin-top:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.card-h .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--paper2);text-transform:uppercase}
.card-h .k b{color:var(--paper);font-weight:600;letter-spacing:.04em;font-family:var(--sans);font-size:13px;margin-left:2px}
.card-b{padding:16px}
.card-b.tight{padding:10px 12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(280px,.92fr);gap:14px;align-items:start}
.split + .split{margin-top:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.row.top{align-items:flex-start}
.spacer{flex:1}
.muted{color:var(--paper2)}
.dim-t{color:var(--paper3)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.small{font-size:12px}
.tiny-t{font-size:11px;color:var(--paper3)}
hr.rule{border:0;border-top:1px solid var(--line2);margin:14px 0}

/* ===== KPI ===== */
.kpi{background:linear-gradient(180deg,rgba(18,20,23,.96),rgba(16,18,20,.9));border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;width:2px;height:34px;background:var(--line)}
.kpi.hot::after{background:var(--accent)}
.kpi-l{font-family:var(--mono);font-size:10px;letter-spacing:.13em;color:var(--paper3);text-transform:uppercase}
.kpi-v{font-family:var(--mono);font-size:27px;line-height:1.25;letter-spacing:.01em;margin-top:5px;color:var(--paper)}
.kpi-v em{font-style:normal;font-size:12px;color:var(--paper3);margin-left:3px}
.kpi-d{font-size:11.5px;color:var(--paper2);margin-top:2px}
.kpi-d .up{color:var(--ok)} .kpi-d .down{color:var(--bad)} .kpi-d .flat{color:var(--paper3)}

/* ===== 按钮 / 表单 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);
  background:rgba(242,237,228,.02);color:var(--paper);padding:7px 12px;border-radius:var(--r);font-size:12.5px;
  letter-spacing:.02em;transition:background .12s,border-color .12s,color .12s;white-space:nowrap}
.btn:hover{background:rgba(242,237,228,.06);border-color:rgba(242,237,228,.3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#171208;font-weight:600}
.btn.primary:hover{background:#F0C072;border-color:#F0C072}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--paper2)}
.btn.ghost:hover{color:var(--paper);border-color:rgba(242,237,228,.32)}
.btn.danger{color:#EDA295;border-color:rgba(224,113,95,.32)}
.btn.danger:hover{background:rgba(224,113,95,.1);border-color:rgba(224,113,95,.55)}
.btn.sm{padding:3px 9px;font-size:11.5px}
.btn.ico{padding:3px 7px;font-size:12px;color:var(--paper2);border-color:transparent;background:transparent}
.btn.ico:hover{background:rgba(242,237,228,.07);color:var(--paper);border-color:var(--line)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--paper3);text-transform:uppercase}
input[type=text],input[type=date],input[type=number],input[type=search],input[type=url],select,textarea{
  background:var(--ink4);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;color:var(--paper);
  font-size:13px;min-width:0;transition:border-color .12s,background .12s}
input::placeholder,textarea::placeholder{color:#7C776E}
input:focus,select:focus,textarea:focus{outline:none;border-color:rgba(232,178,92,.65);background:#0E1013}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--paper3) 50%),linear-gradient(135deg,var(--paper3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}
input[type=range]{accent-color:var(--accent);height:18px}
input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px}
.input-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.input-grid .wide{grid-column:1/-1}
textarea{resize:vertical;line-height:1.7}
.form-note{font-size:11.5px;color:var(--paper3);margin-top:8px}
.sliders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.slider-field{display:flex;flex-direction:column;gap:2px}
.slider-field .sl-top{display:flex;justify-content:space-between;font-size:11px;color:var(--paper2)}
.slider-field .sl-top b{font-family:var(--mono);color:var(--accent);font-weight:500}
.hint{font-size:12px;color:var(--paper2);border-left:2px solid rgba(232,178,92,.45);padding:6px 0 6px 10px;margin:10px 0}
.hint b{color:var(--paper);font-weight:600}

/* ===== 标签 / 状态 ===== */
.tag{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;
  padding:1px 6px;border:1px solid var(--line);border-radius:2px;color:var(--paper2);white-space:nowrap;background:rgba(242,237,228,.02)}
.tag.gold{color:var(--accent);border-color:rgba(232,178,92,.4);background:rgba(232,178,92,.07)}
.tag.ok{color:var(--ok);border-color:rgba(127,176,138,.36);background:rgba(127,176,138,.07)}
.tag.bad{color:#EDA295;border-color:rgba(224,113,95,.38);background:rgba(224,113,95,.08)}
.tag.info{color:var(--info);border-color:rgba(143,169,208,.34);background:rgba(143,169,208,.07)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--paper2);border:1px solid var(--line2);border-radius:2px;padding:1px 7px;background:rgba(242,237,228,.025)}
.pdot{width:6px;height:6px;border-radius:50%;flex:none}
.pname{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--ink4)}
.seg button{border:0;background:none;color:var(--paper2);font-size:11.5px;padding:5px 11px;border-right:1px solid var(--line2);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--paper);background:rgba(242,237,228,.05)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#171208;font-weight:600}
.seg button .n{font-family:var(--mono);font-size:10px;opacity:.7;margin-left:3px}

/* ===== 表格 ===== */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px}
th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--paper3);
  font-weight:500;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:rgba(242,237,228,.02);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:rgba(242,237,228,.025)}
td.num,th.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
td .t-title{font-weight:550;color:var(--paper)}
td .t-sub{font-size:11px;color:var(--paper3);margin-top:1px}

/* ===== 进度条 / 评分 ===== */
.bar{display:block;height:4px;background:rgba(242,237,228,.09);border-radius:2px;overflow:hidden;flex:1;min-width:34px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:2px}
.bar.ok > i{background:var(--ok)} .bar.bad > i{background:var(--bad)}
.bar-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--paper2)}
.bar-row .bl{width:58px;flex:none;color:var(--paper3)}
.bar-row .bv{width:34px;flex:none;text-align:right;font-family:var(--mono);color:var(--paper2)}
.score{display:flex;align-items:baseline;gap:5px}
.score .sv{font-family:var(--mono);font-size:26px;color:var(--accent);line-height:1;letter-spacing:-.01em}
.score .su{font-size:10.5px;color:var(--paper3)}
.why{font-size:11.5px;color:var(--paper2);line-height:1.65;margin-top:6px;border-top:1px dashed var(--line2);padding-top:7px}

/* ===== 空状态 ===== */
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:30px 18px;text-align:center;color:var(--paper2);font-size:12.5px}
.empty b{display:block;color:var(--paper);font-size:13px;margin-bottom:4px}
.empty .mono{font-size:10.5px;color:var(--paper3)}

/* ===== 列表行 ===== */
.list{display:flex;flex-direction:column}
.list-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);min-width:0}
.list-row:last-child{border-bottom:0}
.list-row .lr-main{flex:1;min-width:0}
.list-row .lr-title{font-size:12.5px;color:var(--paper);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-row .lr-sub{font-size:11px;color:var(--paper3);margin-top:1px}
.list-row .lr-side{display:flex;align-items:center;gap:8px;flex:none}

/* ===== 总览：待办 ===== */
.todo{display:flex;gap:10px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid var(--line2)}
.todo:last-child{border-bottom:0}
.todo .tick{width:14px;height:14px;border:1px solid var(--line);border-radius:2px;margin-top:3px;flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--accent)}
.todo .todo-main{flex:1;min-width:0}
.todo .todo-t{font-size:12.5px;color:var(--paper)}
.todo .todo-s{font-size:11px;color:var(--paper3);margin-top:2px}
.todo .todo-a{flex:none}
.mini-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.mini-day{border:1px solid var(--line2);border-radius:2px;padding:6px;min-height:88px;background:rgba(242,237,228,.012)}
.mini-day.today{border-color:rgba(232,178,92,.5);background:rgba(232,178,92,.045)}
.mini-day .md{font-family:var(--mono);font-size:9.5px;color:var(--paper3);display:flex;justify-content:space-between;gap:2px}
.mini-day.today .md b{color:var(--accent)}
.mini-ev{font-size:10.5px;line-height:1.35;color:var(--paper2);border-left:2px solid var(--pc,var(--line));padding:2px 0 2px 5px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.count-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.count-cell{border:1px solid var(--line2);border-radius:2px;padding:9px 11px;background:rgba(242,237,228,.015)}
.count-cell .cv{font-family:var(--mono);font-size:19px;color:var(--paper);line-height:1.2}
.count-cell .cl{font-size:10.5px;color:var(--paper3);margin-top:1px}
.alert-item{padding:9px 10px;border-left:2px solid var(--bad);background:rgba(224,113,95,.05);border-radius:0 2px 2px 0;margin-bottom:7px;font-size:12px;color:var(--paper2)}
.alert-item:last-child{margin-bottom:0}
.alert-item b{color:var(--paper);font-weight:550}

/* ===== 选题 ===== */
.idea{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,rgba(18,20,23,.9),rgba(16,17,20,.86));padding:14px 16px;min-width:0}
.idea + .idea{margin-top:10px}
.idea.lead{border-color:rgba(232,178,92,.3)}
.idea-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.idea-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.idea-title{font-size:15px;font-weight:600;letter-spacing:.01em;line-height:1.45}
.idea-hook{font-size:12px;color:var(--paper2);margin-top:4px}
.idea-hook::before{content:"钩子 / ";font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--paper3)}
.idea-scorebox{flex:none;width:min(300px,100%);display:flex;flex-direction:column;gap:6px;border-left:1px solid var(--line2);padding-left:14px}
.idea-dims{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
.idea-foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px;border-top:1px solid var(--line2);padding-top:9px}
.idea-foot .btn{padding:2px 8px;font-size:11.5px}
.idea-edit{margin-top:12px;border-top:1px solid var(--line2);padding-top:12px}

/* ===== 日历 ===== */
.cal-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.cal-label{font-family:var(--mono);font-size:13px;color:var(--paper);letter-spacing:.03em}
.cal-month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-dow{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--paper3);text-align:center;padding:2px 0 4px;text-transform:uppercase}
.cal-day{border:1px solid var(--line2);border-radius:2px;min-height:104px;padding:6px;background:rgba(242,237,228,.012);min-width:0;cursor:pointer;transition:border-color .12s,background .12s}
.cal-day:hover{border-color:rgba(242,237,228,.25)}
.cal-day.other{opacity:.4}
.cal-day.today{border-color:rgba(232,178,92,.5);background:rgba(232,178,92,.05)}
.cal-day.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px rgba(232,178,92,.35)}
.cal-day.warn{border-color:rgba(224,113,95,.55)}
.cal-day.over{background:rgba(224,113,95,.045)}
.cal-day.drop-on{border-color:var(--accent);background:rgba(232,178,92,.1)}
.cal-dn{display:flex;align-items:center;justify-content:space-between;gap:2px;font-family:var(--mono);font-size:10px;color:var(--paper3);margin-bottom:3px}
.cal-dn b{font-weight:500}
.cal-day.today .cal-dn b{color:var(--accent)}
.cal-add{border:0;background:none;color:var(--paper3);font-size:13px;line-height:1;padding:0 3px;opacity:0;transition:opacity .12s}
.cal-day:hover .cal-add,.cal-day:focus-within .cal-add{opacity:1}
.cal-add:hover{color:var(--accent)}
.cal-ev{display:block;width:100%;text-align:left;border:0;border-left:2px solid var(--pc,var(--paper3));
  background:rgba(242,237,228,.045);color:var(--paper2);font-size:10.5px;line-height:1.35;padding:3px 5px;margin-top:3px;
  border-radius:0 2px 2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:grab}
.cal-ev:hover{background:rgba(242,237,228,.09);color:var(--paper)}
.cal-ev.done{opacity:.5;text-decoration:line-through}
.cal-ev[aria-pressed="true"]{background:rgba(232,178,92,.14);color:var(--paper)}
.cal-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-week .cal-day{min-height:220px}
.cal-week .cal-dn{font-size:10.5px;flex-direction:column;align-items:flex-start;gap:1px;border-bottom:1px solid var(--line2);padding-bottom:4px;margin-bottom:5px}
.slot-panel .card-b{display:flex;flex-direction:column;gap:10px}
.slot-date{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.04em}
.slot-item{border:1px solid var(--line2);border-radius:2px;padding:9px 10px;background:rgba(242,237,228,.02)}
.slot-item .si-t{font-size:12.5px;display:flex;align-items:center;gap:6px}
.slot-item .si-s{font-size:11px;color:var(--paper3);margin-top:2px}
.conflict{font-size:11.5px;color:#EDA295;border:1px solid rgba(224,113,95,.28);background:rgba(224,113,95,.06);padding:7px 9px;border-radius:2px}

/* ===== 素材 ===== */
.asset{border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;background:rgba(18,20,23,.75);min-width:0}
.asset + .asset{margin-top:9px}
.asset-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.asset-t{font-size:13.5px;font-weight:550;line-height:1.4}
.asset-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:5px}
.pipe{display:flex;align-items:center;gap:0;margin-top:11px;flex-wrap:wrap}
.pipe .step{font-family:var(--mono);font-size:10px;color:var(--paper3);padding:2px 7px;border:1px solid var(--line2);border-radius:2px;position:relative}
.pipe .step.done{color:var(--ok);border-color:rgba(127,176,138,.35)}
.pipe .step.cur{color:#171208;background:var(--accent);border-color:var(--accent);font-weight:600}
.pipe .gap{width:12px;height:1px;background:var(--line2)}
.asset-foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px;border-top:1px solid var(--line2);padding-top:9px}
.reuse{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;color:var(--paper3)}
.reuse b{color:var(--paper);font-weight:500}
.reuse .btn{min-width:0}

/* ===== 检查清单 ===== */
.checks{display:flex;flex-direction:column}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-bottom:1px solid var(--line2);cursor:pointer}
.check:last-child{border-bottom:0}
.check:hover{background:rgba(242,237,228,.03)}
.check input{margin-top:3px;flex:none}
.check .ck-t{font-size:12.5px;color:var(--paper2);line-height:1.55}
.check.done .ck-t{color:var(--paper3);text-decoration:line-through;text-decoration-color:rgba(242,237,228,.35)}
.progress-line{display:flex;align-items:center;gap:10px;margin-top:2px}
.progress-line .bar{height:6px}
.progress-line .pv{font-family:var(--mono);font-size:11px;color:var(--paper2);flex:none}
.block-note{border:1px solid rgba(224,113,95,.3);background:rgba(224,113,95,.06);padding:10px 12px;border-radius:2px;font-size:12px;color:var(--paper2);margin-top:12px}
.block-note b{color:#EDA295}
.ok-note{border:1px solid rgba(127,176,138,.3);background:rgba(127,176,138,.06);padding:10px 12px;border-radius:2px;font-size:12px;color:var(--paper2);margin-top:12px}
.ok-note b{color:var(--ok)}

/* ===== 图表 ===== */
.chart-card .card-b{padding:8px 10px 4px}
.chart-wrap{position:relative;width:100%;min-height:300px}
#trendCanvas{display:block;width:100%;height:300px}
.chart-tip{position:absolute;z-index:5;pointer-events:none;background:#1B1E23;border:1px solid var(--line);
  border-radius:var(--r);padding:8px 10px;font-family:var(--mono);font-size:10.5px;line-height:1.6;color:var(--paper2);
  box-shadow:0 8px 24px rgba(0,0,0,.45);max-width:240px;white-space:nowrap}
.chart-tip b{color:var(--paper);font-weight:500}
.chart-tip .tt{color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:6px 8px 8px;font-size:11px;color:var(--paper3)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:2px;background:var(--accent);display:inline-block}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--paper3) 0 3px,transparent 3px 6px);height:1px;width:14px}
.concl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.concl li{font-size:12.5px;color:var(--paper2);padding-left:14px;position:relative;line-height:1.65}
.concl li::before{content:"—";position:absolute;left:0;color:var(--paper3)}
.concl li b{color:var(--paper);font-weight:550}

/* ===== 一鱼多吃 ===== */
.plat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.plat-card{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:rgba(18,20,23,.75);min-width:0}
.plat-card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.plat-card-h .pn{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.plat-spec{font-family:var(--mono);font-size:10px;color:var(--paper3);letter-spacing:.02em;margin-bottom:7px}
.plat-tips{list-style:none;display:flex;flex-direction:column;gap:5px}
.plat-tips li{font-size:11.5px;color:var(--paper2);line-height:1.55;padding-left:11px;position:relative}
.plat-tips li::before{content:"·";position:absolute;left:0;color:var(--accent)}
.mk-out{background:var(--ink4);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;font-family:var(--mono);font-size:11.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word;max-height:400px;overflow:auto;color:var(--paper2)}
.mk-out:empty{display:none}

/* ===== 拆解 ===== */
.tear{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:rgba(18,20,23,.75);min-width:0}
.tear + .tear{margin-top:10px}
.tear-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tear-t{font-size:14px;font-weight:600;line-height:1.45}
.tear-secs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:11px}
.tear-sec{border-left:1px solid var(--line2);padding-left:10px;min-width:0}
.tear-sec .sk{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--accent);text-transform:uppercase}
.tear-sec .sv{font-size:12px;color:var(--paper2);line-height:1.65;margin-top:2px}
.tear-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.tagbtn{font-family:var(--mono);font-size:10px;letter-spacing:.03em;border:1px solid var(--line2);background:transparent;color:var(--paper2);padding:1px 6px;border-radius:2px}
.tagbtn:hover{border-color:var(--accent);color:var(--accent)}

/* ===== 合规 ===== */
.comp-verdict{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;flex-wrap:wrap}
.comp-verdict.red{border-color:rgba(224,113,95,.45);background:rgba(224,113,95,.07)}
.comp-verdict.orange{border-color:rgba(232,178,92,.45);background:rgba(232,178,92,.06)}
.comp-verdict.yellow{border-color:rgba(242,237,228,.25);background:rgba(242,237,228,.04)}
.comp-verdict.green{border-color:rgba(127,176,138,.4);background:rgba(127,176,138,.06)}
.comp-verdict .cv-icon{font-family:var(--mono);font-size:11px;letter-spacing:.02em}
.comp-verdict .cv-t{font-size:13px;font-weight:600}
.comp-verdict .cv-s{font-size:11.5px;color:var(--paper2)}
.cstat{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--paper3)}
.cstat b{color:var(--paper);font-weight:500}
.comp-preview{font-size:12.5px;line-height:1.9;color:var(--paper2);background:var(--ink4);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-word}
mark.hit{background:none;border-radius:2px;padding:0 2px;color:var(--paper);border-bottom:2px solid}
mark.hit.l1{background:rgba(224,113,95,.22);border-color:var(--bad)}
mark.hit.l2{background:rgba(232,178,92,.2);border-color:var(--accent)}
mark.hit.l3{background:rgba(143,169,208,.18);border-color:var(--info)}
.hit-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);align-items:flex-start}
.hit-row:last-child{border-bottom:0}
.hit-row .hl{font-family:var(--mono);font-size:9.5px;flex:none;margin-top:2px;padding:1px 5px;border-radius:2px;border:1px solid}
.hit-row .hl.l1{color:#EDA295;border-color:rgba(224,113,95,.4)}
.hit-row .hl.l2{color:var(--accent);border-color:rgba(232,178,92,.4)}
.hit-row .hl.l3{color:var(--info);border-color:rgba(143,169,208,.4)}
.hit-row .hm{flex:1;min-width:0;font-size:12px;color:var(--paper2)}
.hit-row .hm b{color:var(--paper);font-weight:550}
.hit-row .hm .fix{font-size:11px;color:var(--paper3);margin-top:2px}
.hit-row .hm .fix code{font-family:var(--mono);font-size:10.5px;color:var(--ok);background:rgba(127,176,138,.08);padding:0 4px;border-radius:2px}
.rulebook{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rulebook .rb{border:1px solid var(--line2);border-radius:2px;padding:9px 10px}
.rulebook .rb .rk{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em}
.rulebook .rb .rn{font-size:11.5px;color:var(--paper2);margin-top:2px;line-height:1.55}

/* ===== 周报 ===== */
.report-pre{background:var(--ink4);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;
  font-family:var(--mono);font-size:11.5px;line-height:1.8;white-space:pre-wrap;word-break:break-word;color:var(--paper2);max-height:520px;overflow:auto}
.report-pre:empty{display:none}
.report-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.report-stats .rs{border:1px solid var(--line2);border-radius:2px;padding:8px 10px}
.report-stats .rs .rv{font-family:var(--mono);font-size:18px;color:var(--paper)}
.report-stats .rs .rl{font-size:10.5px;color:var(--paper3)}

/* ===== 数据管理 ===== */
.meta-table{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:2px;overflow:hidden}
.meta-table > div{background:#101215;padding:8px 11px;font-size:11.5px;color:var(--paper2);display:flex;justify-content:space-between;gap:10px}
.meta-table > div b{font-family:var(--mono);font-weight:500;color:var(--paper);font-variant-numeric:tabular-nums}
.danger-zone{border:1px solid rgba(224,113,95,.24);border-radius:var(--r);padding:14px 16px;background:rgba(224,113,95,.035)}
.file-hidden{display:none}

/* ===== Toast / 弹层 ===== */
.toast{position:fixed;right:20px;bottom:20px;z-index:120;max-width:min(420px,86vw);background:#1B1E23;color:var(--paper);
  border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:var(--r);padding:10px 14px;font-size:12.5px;
  box-shadow:0 14px 36px rgba(0,0,0,.5);opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.toast.err{border-left-color:var(--bad)}
.modal{position:fixed;inset:0;z-index:150;background:rgba(4,5,6,.66);display:grid;place-items:center;padding:18px}
.modal[hidden]{display:none}
.modal-card{background:#15171B;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;width:min(440px,100%);
  box-shadow:0 24px 70px rgba(0,0,0,.6)}
.modal-k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--paper3);text-transform:uppercase}
.modal-card h3{font-size:16px;font-weight:600;margin:7px 0 6px}
.modal-card p{font-size:12.5px;color:var(--paper2);line-height:1.7}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

/* ===== 动效 ===== */
.view-enter{animation:rise .22s ease both}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== 响应式 ===== */
@media (max-width:1180px){
  .g4,.g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:1040px){
  .app{grid-template-columns:minmax(0,1fr);max-width:100%}
  .side{position:static;height:auto;overflow:visible;border-right:0;border-bottom:1px solid var(--line);
    flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 16px;
    width:100%;max-width:100%;min-width:0}
  .brand{flex:none;display:flex;align-items:baseline;gap:10px;padding:0}
  .brand-name{font-size:16px;margin:0}
  .brand-sub,.brand-tag{display:none}
  .nav{flex-direction:row;overflow-x:auto;flex:1 1 100%;order:3;gap:2px;padding-bottom:2px;scrollbar-width:thin;
    min-width:0;max-width:100%;-webkit-overflow-scrolling:touch}
  .nav button{width:auto;flex:none;border-left:0;border-bottom:2px solid transparent;padding:6px 9px}
  .nav button[aria-current="page"]{border-left:0;border-bottom-color:var(--accent);background:linear-gradient(180deg,transparent,var(--accent-dim))}
  .nav button .ct{display:none}
  .side-foot{display:none}
  .main{padding:20px 16px 56px}
  .split{grid-template-columns:minmax(0,1fr)}
  .cal-day{min-height:86px}
}
@media (max-width:760px){
  .g2,.g3,.g4,.g-kpi,.plat-grid,.tear-secs,.report-stats,.rulebook{grid-template-columns:minmax(0,1fr)}
  .page-head{align-items:flex-start;gap:10px}
  .page-actions{width:100%}
  .page-actions .btn{flex:0 1 auto}
  .page-title{font-size:21px}
  .mini-week{grid-template-columns:repeat(4,minmax(0,1fr))}
  .mini-day{min-height:72px}
  .cal-month{gap:3px}
  .cal-day{min-height:66px;padding:4px}
  .cal-ev{font-size:9.5px;padding:2px 3px}
  .idea-scorebox{width:100%;border-left:0;border-top:1px solid var(--line2);padding-left:0;padding-top:10px}
  .sliders{grid-template-columns:minmax(0,1fr)}
  .split{display:flex;flex-direction:column}
  .split > *{width:100%}
  .toast{left:14px;right:14px;bottom:14px;max-width:none}
  .cal-week{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cal-week .cal-day{min-height:120px}
  .table-wrap{border-radius:var(--r)}
}
@media print{
  .side,.page-actions,.foot,.toast,.modal{display:none!important}
  body{background:#fff;color:#111}
  .card,.kpi{border-color:#ccc}
}

<script>
/* =====================================================================
   运营工作台 2.0 · OPS-01
   单文件 / 零依赖 / 零网络请求。数据存 localStorage:ops_workbench_v2
   ===================================================================== */
'use strict';

/* ---------- 常量 ---------- */
var SEED_VERSION = 3;
var KEY = 'ops_workbench_v2';

var MODULES = [
  { id: 'dash',      no: '01', name: '总览',      sub: '今天该干什么' },

];
var MODULE_SUB = {
  dash: '先看今天有什么必须做，再看哪里不对劲。',
  ideas: '每条选题都有分、有理由。分低的先别做，时间是有限的。',
  calendar: '排过的内容才是真的内容。点某天加一条，拖着卡片换日期。',

  metrics: '数据是你自己录的，不联网。趋势图和结论都在本地算，不上传。',
  remix: '同一条素材换规格、换开头、换信息密度，就能再发一轮。',
  teardown: '拆的是别人的爆款，长的是自己的手感。四段拆完，下次能直接套。',
  compliance: '词表来自广告法规则，三级提示。工具只做筛查，真投放前还是得有人看一眼。',
  report: '把一周的排期、数据和结论拼成一份能直接发出去的周报。',
  manage: '备份、恢复、清空。换电脑之前先导出一份 JSON。'
};
var PLAT = {
  '抖音':      { c: '#DE6A7C', k: 'dy' },

function scanText(text) {
  var src = String(text || '');
  var hits = [];
  COMP_RULES.forEach(function (rule) {
    var re = new RegExp(rule.re.source, rule.re.flags.indexOf('g') >= 0 ? rule.re.flags : rule.re.flags + 'g');
    var m;
    var guard = 0;
    while ((m = re.exec(src)) !== null && guard++ < 200) {
      hits.push({ level: rule.level, cat: rule.cat, word: m[0], index: m.index, msg: rule.msg, fix: rule.fix, law: rule.law });
      if (m[0] === '') re.lastIndex++;
    }
  });
  hits.sort(function (a, b) { return a.index - b.index; });
  var by = { 1: [], 2: [], 3: [] };
  hits.forEach(function (h) { by[h.level].push(h); });
  var verdict = by[1].length ? 'red' : (by[2].length ? 'orange' : (by[3].length ? 'yellow' : 'green'));
  return { hits: hits, by: by, verdict: verdict, text: src };
}

function safeScore(idea) {
  var r = scanText((idea.title || '') + ' ' + (idea.hook || ''));
  var deduct = r.by[1].length * 4 + r.by[2].length * 1.5 + r.by[3].length * 1;
  return { safe: clamp(round1(10 - deduct), 1, 10), scan: r };
}

function scoreIdea(idea) {

    safe: safe.safe,

}

function copyText(text, okMsg) {
  function done() { toast(okMsg || '已复制'); }

  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done, fail); });
      return;

  fallbackCopy(text, done, fail);
}
function fallbackCopy(text, done, fail) {
  try {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    var ok = document.execCommand && document.execCommand('copy');
    document.body.removeChild(ta);
    if (ok) done(); else fail();
  } catch (e) { fail(); }
}

function downloadText(filename, text, mime) {
  try {
    var blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) {} }, 800);
    toast('已下载 ' + filename);
  } catch (e) {
    toast('下载失败，可以手动复制内容', 'err');
  }
}

/* 事件委托：所有交互走 data-act，避免内联 onclick 拼字符串 */
var ACTIONS_READY = false;
function bindGlobal() {
  if (ACTIONS_READY) return;
  ACTIONS_READY = true;
  document.addEventListener('click', function (e) {
    var t = e.target;
    while (t && t !== document && !(t.getAttribute && t.getAttribute('data-act'))) t = t.parentNode;
    if (!t || t === document) return;
    var act = t.getAttribute('data-act');
    var arg = t.getAttribute('data-arg');
    if (ACTIONS[act]) {
      e.preventDefault();
      ACTIONS[act](arg, t, e);
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (!t || !t.getAttribute) return;
    var act = t.getAttribute('data-change');
    if (act && ACTIONS['change:' + act]) ACTIONS['change:' + act](t.value, t, e);
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (!t || !t.getAttribute) return;
    var act = t.getAttribute('data-input');
    if (act && ACTIONS['input:' + act]) ACTIONS['input:' + act](t.value, t, e);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      var m = document.getElementById('modal');
      if (m && !m.hidden) { closeModal(); return; }
    }
    if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
      var idx = 0;
      MODULES.forEach(function (m, i) { if (m.id === UI.module) idx = i; });
      var next = (idx + (e.key === 'ArrowRight' ? 1 : MODULES.length - 1)) % MODULES.length;
      e.preventDefault();
      go(MODULES[next].id);
    }
  });
  try {
    window.addEventListener('hashchange', function () {
      var id = (location.hash || '').replace('#', '');
      if (id && id !== UI.module) go(id, true);
    });
  } catch (e) {}
}

function eventsOn(dateISO) {
  return DB.schedule.filter(function (s) { return s.date === dateISO; })
    .sort(function (a, b) { return String(a.time || '99:99').localeCompare(String(b.time || '99:99')); });
}
function metricsSorted() {
  return DB.metrics.slice().sort(function (a, b) {
    if (a.date === b.date) return (a.id || '').localeCompare(b.id || '');
    return String(a.date).localeCompare(String(b.date));
  });
}
function metricStats() {
  var rows = DB.metrics;
  var views = rows.map(function (r) { return Number(r.views) || 0; });
  var med = median(views);
  var interact = rows.map(function (r) {
    var v = Number(r.views) || 0;
    return v ? ((Number(r.likes) || 0) + (Number(r.comments) || 0) + (Number(r.shares) || 0)) / v * 100 : 0;
  });
  var fans = sum(rows, function (r) { return r.fans; });
  var hits = rows.filter(function (r) { return med && (Number(r.views) || 0) >= med * 3; });
  return {
    count: rows.length, views: sum(views), med: med, fans: fans,
    avgInteract: rows.length ? sum(interact) / rows.length : 0,
    hits: hits
  };
}
function weekEvents(mondayISO) {
  return DB.schedule.filter(function (s) { return isThisWeek(s.date, mondayISO); });
}
function buildTodos() {
  var out = [];
  var T = iso(today());
  var todayEv = eventsOn(T);
  var pending = todayEv.filter(function (s) { return s.status !== '已发'; });
  pending.forEach(function (s) {
    out.push({
      t: '今天 ' + (s.time || '') + ' 发《' + s.title + '》',
      s: s.plat + ' · 发布前把检查清单过一遍',
      act: 'checklist', arg: 'x', label: '去检查'
    });
  });
  DB.assets.filter(function (a) { return a.status === '待审'; }).forEach(function (a) {
    out.push({ t: '《' + a.title + '》在等你审', s: a.plat + ' · ' + a.type + '，审完就能排期', act: 'go', arg: 'assets', label: '去审' });
  });
  if (DB.metrics.filter(function (m) { return m.date === T; }).length === 0) {
    out.push({ t: '今天的数据还没录', s: '发出去 24 小时后再录，数字才准；没发就录昨天的', act: 'go', arg: 'metrics', label: '去录' });
  }
  var best = null;
  DB.ideas.forEach(function (it) {
    if (it.status !== '待评估' && it.status !== '已采纳') return;
    var sc = scoreOf(it);
    if (!best || sc.out > best.sc.out) best = { it: it, sc: sc };
  });
  if (best && best.sc.out >= 70) {
    out.push({
      t: '《' + best.it.title + '》' + best.sc.out + ' 分，还没排期',
      s: '这个分数可以直接占档期了，拖到日历就行',
      act: 'go', arg: 'ideas', label: '去排期'
    });
  }
  var risky = null;
  DB.ideas.forEach(function (it) {
    var sc = scoreOf(it);
    if (sc.scan.by[1].length && (!risky || sc.scan.by[1].length > risky.n)) risky = { it: it, n: sc.scan.by[1].length };
  });
  if (risky) {
    out.push({
      t: '《' + risky.it.title + '》有 ' + risky.n + ' 处不能说的词',
      s: '红线词改掉再拍，别白拍一条',
      act: 'go', arg: 'compliance', label: '去改'
    });
  }
  if (!out.length) {
    out.push({ t: '今天没有硬性待办', s: '可以去拆一条对标账号的爆款，或者把素材库理一理', act: 'go', arg: 'teardown', label: '去拆解' });
  }
  return out.slice(0, 5);
}
function anomalies() {
  var list = [];
  var rows = metricsSorted();
  if (!rows.length) return [{ tone: 'info', t: '还没有数据', s: '先录一条，趋势图才有东西画。' }];
  var med = metricStats().med;
  rows.slice(-3).forEach(function (r) {
    var v = Number(r.views) || 0;
    var ratio = med ? v / med : 0;
    var ir = v ? ((Number(r.likes) || 0) + (Number(r.comments) || 0) + (Number(r.shares) || 0)) / v * 100 : 0;
    var fanRate = v ? (Number(r.fans) || 0) / v : 0;
    var item = null;
    if (ratio < 0.6) {
      item = { tone: 'bad', t: '《' + r.title + '》只跑到中位的 ' + Math.round(ratio * 100) + '%', s: '先看封面和开头 3 秒，再看发布时间。' };
    } else if (ratio >= 3) {
      item = { tone: 'ok', t: '《' + r.title + '》' + ratio.toFixed(1) + ' 倍中位，算爆了', s: '把它拆进拆解库，下一轮照着结构做。' };
    } else if (v > 8000 && ir < 1.5) {
      item = { tone: 'bad', t: '《' + r.title + '》互动率 ' + ir.toFixed(2) + '%', s: '播得动但没人说话，结尾没有留下互动理由。' };
    } else if (v > 8000 && fanRate < 0.001) {
      item = { tone: 'bad', t: '《' + r.title + '》播了 ' + wan(v) + '，只涨 ' + num(r.fans) + ' 个粉', s: '内容和关注理由没关系，结尾加一句「关注看后续」。' };
    }
    if (item) list.push(item);
  });
  if (!list.length) list.push({ tone: 'ok', t: '最近几条都在正常区间', s: '没有明显掉队的，保持节奏就行。' });
  return list.slice(0, 4);
}

function calWarn(dateISO) {
  var evs = eventsOn(dateISO);
  var by = {};
  evs.forEach(function (s) { by[s.plat] = (by[s.plat] || 0) + 1; });
  var conflict = Object.keys(by).filter(function (p) { return by[p] > 1; });
  return { conflict: conflict, overload: evs.length > 3, count: evs.length };
}
function calCell(dateISO, other, weekMode) {
  var T = iso(today());
  var evs = eventsOn(dateISO);
  var w = calWarn(dateISO);
  var d = parseISO(dateISO);
  var cls = 'cal-day' + (other ? ' other' : '') + (dateISO === T ? ' today' : '') +
    (UI.selDate === dateISO ? ' sel' : '') + (w.conflict.length ? ' warn' : '') + (w.overload ? ' over' : '');
  var h = '<div class="' + cls + '" data-act="cal:day" data-arg="' + dateISO + '" data-drop="' + dateISO + '" role="group" aria-label="' + dateISO + '">' +
    '<div class="cal-dn"><b>' + d.getDate() + '</b>' +
    (weekMode ? '<span>周' + weekdays()[(d.getDay() + 6) % 7] + '</span>' : '') +
    '<button class="cal-add" type="button" data-act="cal:add" data-arg="' + dateISO + '" title="在这天加一条" aria-label="' + dateISO + ' 加一条">＋</button></div>';
  evs.forEach(function (s) {
    var label = weekMode ? (s.time ? s.time + ' ' : '') + s.title : s.title;
    h += '<button type="button" class="cal-ev' + (s.status === '已发' ? ' done' : '') + '" draggable="true" ' +
      'data-act="cal:ev" data-arg="' + esc(s.id) + '" style="--pc:' + ((PLAT[s.plat] || {}).c || 'var(--line)') + '" ' +
      'title="' + esc((s.time || '') + ' ' + s.plat + ' · ' + s.title) + '">' + esc(label) + '</button>';
  });
  if (w.count && !weekMode) {
    h += '<div class="tiny-t mono" style="margin-top:4px;color:' + (w.overload || w.conflict.length ? '#EDA295' : 'var(--paper3)') + '">' +
      w.count + ' 条' + (w.conflict.length ? ' · 冲突' : '') + (w.overload ? ' · 太挤' : '') + '</div>';
  }
  return h + '</div>';
}
function calMonthHTML() {
  var anchor = UI.calAnchor ? parseISO(UI.calAnchor) : today();
  var first = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
  var gridStart = mondayOf(first);
  var h = '<div class="cal-month">' + weekdays().map(function (w) { return '<div class="cal-dow">' + w + '</div>'; }).join('');
  for (var i = 0; i < 42; i++) {
    var d = addDays(gridStart, i), ds = iso(d);
    h += calCell(ds, d.getMonth() !== first.getMonth(), false);
  }
  return h + '</div>';
}
function calWeekHTML() {
  var anchor = UI.calAnchor ? parseISO(UI.calAnchor) : today();
  var mon = mondayOf(anchor);
  var h = '<div class="cal-week">';
  for (var i = 0; i < 7; i++) {

    h += calCell(ds, false, true);
  }

}

function rateOf(r) {
  var v = Number(r.views) || 0;
  return v ? ((Number(r.likes) || 0) + (Number(r.comments) || 0) + (Number(r.shares) || 0)) / v * 100 : 0;
}
function fansRateOf(r) {
  var v = Number(r.views) || 0;
  return v ? (Number(r.fans) || 0) / v * 100 : 0;
}
function verdictOf(r, med) {
  var v = Number(r.views) || 0;
  var ratio = med ? v / med : 0;
  if (ratio >= 3) return { label: '爆款', mult: ratio, cls: 'gold' };
  if (ratio >= 1.5) return { label: '小爆', mult: ratio, cls: 'info' };
  if (ratio < 0.6) return { label: '偏低', mult: ratio, cls: 'bad' };
  return { label: '正常', mult: ratio, cls: '' };
}
function metricConclusion() {
  var rows = metricsSorted();
  if (!rows.length) return ['还没有数据。先手动录一条，趋势图和结论才有东西算。'];
  var st = metricStats();
  var out = [];
  var best = rows.slice().sort(function (a, b) { return (Number(b.views) || 0) - (Number(a.views) || 0); })[0];
  var bestRatio = st.med ? (Number(best.views) || 0) / st.med : 0;
  out.push('播放最高的是《' + best.title + '》，' + wan(best.views) + ' 播放，是中位数的 ' + bestRatio.toFixed(1) +
    ' 倍。' + (bestRatio >= 3 ? '这条就是模板，把开头、结构、结尾拆进拆解库。' : '下一条照着它的开头做，别自己另起一套。'));
  var bestR = rows.slice().sort(function (a, b) { return rateOf(b) - rateOf(a); })[0];
  out.push('互动率最高的是《' + bestR.title + '》，' + rateOf(bestR).toFixed(2) + '%。' +
    (rateOf(bestR) > 5 ? '说明这类话题能让人开口，选题方向往这靠。' : '互动一般，结尾问句可以再具体点，别问「你怎么看」。'));
  var fansPerWan = st.views ? (st.fans / st.views * 10000) : 0;
  out.push('每 1 万播放涨 ' + fansPerWan.toFixed(1) + ' 个粉。' +
    (fansPerWan >= 20 ? '关注转化不错，结尾那句「关注看后续」是有效的。' : '涨粉偏弱，内容是给人看的，但没给人一个关注的理由。'));
  if (rows.length >= 4) {
    var last = rows.slice(-3), prev = rows.slice(-6, -3);
    var lastAvg = sum(last, function (r) { return r.views; }) / last.length;
    var prevAvg = prev.length ? sum(prev, function (r) { return r.views; }) / prev.length : 0;
    if (prevAvg) {
      var chg = (lastAvg - prevAvg) / prevAvg * 100;
      out.push('最近 3 条平均播放 ' + wan(lastAvg) + '，比前 ' + prev.length + ' 条' + (chg >= 0 ? '高 ' : '低 ') +
        Math.abs(chg).toFixed(0) + '%。' + (chg < -30 ? '掉得有点多，优先换开头，别先怀疑平台限流。' :
          chg >= 30 ? '方向对了，趁热再把同结构做一条。' : '波动正常，继续按节奏发。'));
    }
  }
  var lowInteract = rows.filter(function (r) { return rateOf(r) < 1.5; });
  out.push('下一步：' + (lowInteract.length >= 2 ? '先把互动率低于 1.5% 的 ' + lowInteract.length + ' 条的开头重写，再谈数量。' :
    '把播放前 20% 的内容做成系列，剩下时间留给素材库，别天天临时找选题。'));
  return out;
}
function trendRows() {
  return metricsSorted().map(function (r) {
    var v;
    if (UI.metric === 'interact') v = rateOf(r);
    else if (UI.metric === 'fans') v = Number(r.fans) || 0;
    else v = Number(r.views) || 0;
    return { date: r.date, title: r.title, plat: r.plat, value: v, raw: r };
  });
}
function metricLabel() {
  return UI.metric === 'interact' ? '互动率' : UI.metric === 'fans' ? '涨粉' : '播放';
}
function fmtMetricVal(v) {
  if (UI.metric === 'interact') return v.toFixed(2) + '%';
  return num(v);
}
function drawTrend(hl) {
  var cv = document.getElementById('trendCanvas');
  if (!cv || !cv.getContext) return;
  var wrap = cv.parentNode;
  var w = Math.max(320, (wrap && wrap.clientWidth) || 860);
  var h = 300;
  var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
  try {
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
  } catch (e) {}
  var ctx = cv.getContext('2d');
  if (!ctx) return;
  try { ctx.setTransform(dpr, 0, 0, dpr, 0, 0); } catch (e) {}
  ctx.clearRect(0, 0, w, h);
  var rows = trendRows();
  var pad = { l: 58, r: 20, t: 22, b: 38 };
  var pw = w - pad.l - pad.r;
  var ph = h - pad.t - pad.b;
  var mono = '11px ui-monospace,Consolas,monospace';
  if (rows.length < 1) {
    ctx.fillStyle = '#8A857B';
    ctx.font = mono;
    ctx.textAlign = 'center';
    ctx.fillText('还没有数据，先在上面录一条', w / 2, h / 2);
    UI.chart = null;
    return;
  }
  var values = rows.map(function (r) { return r.value; });
  var maxV = Math.max.apply(null, values);
  var med = median(values);
  var top = maxV > 0 ? maxV * 1.16 : 1;
  function px(i) { return rows.length === 1 ? pad.l + pw / 2 : pad.l + pw * i / (rows.length - 1); }
  function py(v) { return pad.t + ph - ph * (v / top); }
  ctx.font = mono;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (var g = 0; g <= 4; g++) {
    var gy = pad.t + ph * g / 4;
    var gv = top * (1 - g / 4);
    ctx.strokeStyle = g === 4 ? 'rgba(242,237,228,.16)' : 'rgba(242,237,228,.07)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pad.l, gy + 0.5);
    ctx.lineTo(pad.l + pw, gy + 0.5);
    ctx.stroke();
    ctx.fillStyle = '#8A857B';
    ctx.fillText(UI.metric === 'interact' ? gv.toFixed(1) + '%' : wan(gv), pad.l - 10, gy);
  }
  if (med > 0) {
    var my = py(med);
    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = 'rgba(185,179,167,.42)';
    ctx.beginPath();
    ctx.moveTo(pad.l, my);
    ctx.lineTo(pad.l + pw, my);
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#8A857B';
    ctx.textAlign = 'left';
    ctx.font = '10px ui-monospace,Consolas,monospace';
    ctx.fillText('中位 ' + fmtMetricVal(med), pad.l + 6, my - 9);
  }
  var grad = ctx.createLinearGradient(0, pad.t, 0, pad.t + ph);
  grad.addColorStop(0, 'rgba(232,178,92,.20)');
  grad.addColorStop(1, 'rgba(232,178,92,0)');
  ctx.beginPath();
  rows.forEach(function (r, i) { if (i === 0) ctx.moveTo(px(i), py(r.value)); else ctx.lineTo(px(i), py(r.value)); });
  ctx.lineTo(px(rows.length - 1), pad.t + ph);
  ctx.lineTo(px(0), pad.t + ph);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.beginPath();
  rows.forEach(function (r, i) { if (i === 0) ctx.moveTo(px(i), py(r.value)); else ctx.lineTo(px(i), py(r.value)); });
  ctx.strokeStyle = '#E8B25C';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();
  rows.forEach(function (r, i) {
    var isHl = typeof hl === 'number' && hl === i;
    ctx.beginPath();
    ctx.arc(px(i), py(r.value), isHl ? 5 : 3, 0, Math.PI * 2);
    ctx.fillStyle = isHl ? '#E8B25C' : '#0A0B0D';
    ctx.strokeStyle = '#E8B25C';
    ctx.lineWidth = isHl ? 2 : 1.6;
    ctx.fill();
    ctx.stroke();
  });
  ctx.fillStyle = '#8A857B';
  ctx.font = '10px ui-monospace,Consolas,monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  var every = Math.max(1, Math.ceil(rows.length / 8));
  rows.forEach(function (r, i) {
    if (i % every !== 0 && i !== rows.length - 1) return;
    ctx.fillText(fmtMD(r.date), px(i), pad.t + ph + 12);
  });
  ctx.textAlign = 'left';
  ctx.fillStyle = '#B9B3A7';
  ctx.font = '10px ui-monospace,Consolas,monospace';
  ctx.fillText(rows.length + ' 个数据点 · ' + metricLabel(), pad.l, 8);
  UI.chart = {
    rows: rows,
    xs: rows.map(function (_, i) { return px(i); }),
    ys: rows.map(function (r) { return py(r.value); }),
    pad: pad, pw: pw, ph: ph, w: w, h: h
  };
}
function bindChart() {
  var cv = document.getElementById('trendCanvas');
  var tip = document.getElementById('chartTip');
  if (!cv) return;
  cv.onmousemove = function (e) {
    if (!UI.chart || !UI.chart.rows.length) return;
    var rect = cv.getBoundingClientRect ? cv.getBoundingClientRect() : { left: 0, top: 0 };
    var x = e.clientX - rect.left;
    var best = 0, bd = Infinity;
    UI.chart.xs.forEach(function (vx, i) {
      var d = Math.abs(vx - x);
      if (d < bd) { bd = d; best = i; }
    });
    var row = UI.chart.rows[best];
    if (!row) return;
    drawTrend(best);
    if (tip) {
      tip.innerHTML = '<span class="tt">' + esc(fmtMD(row.date)) + ' · ' + esc(row.plat) + '</span><br>' +
        '<b>' + esc(row.title) + '</b><br>' + metricLabel() + '：<b>' + fmtMetricVal(row.value) + '</b>';
      tip.hidden = false;
      var wrapW = cv.clientWidth || 800;
      var left = UI.chart.xs[best] + 14;
      if (left > wrapW - 220) left = Math.max(8, UI.chart.xs[best] - 228);
      tip.style.left = left + 'px';
      tip.style.top = Math.max(6, UI.chart.ys[best] - 30) + 'px';
    }
  };
  cv.onmouseleave = function () {
    if (tip) tip.hidden = true;
    drawTrend();
  };
}

function reportPeriod(offset) {
  var mon = mondayOf(addDays(today(), (offset || 0) * 7));
  var sun = addDays(mon, 6);
  return { mon: mon, sun: sun, monISO: iso(mon), sunISO: iso(sun) };
}
function inRange(dateISO, a, b) {
  return String(dateISO) >= a && String(dateISO) <= b;
}
function buildReportMarkdown(offset) {
  var p = reportPeriod(offset);
  var pub = DB.schedule.filter(function (s) { return inRange(s.date, p.monISO, p.sunISO); })
    .sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); });
  var done = pub.filter(function (s) { return s.status === '已发'; });
  var ms = DB.metrics.filter(function (m) { return inRange(m.date, p.monISO, p.sunISO); })
    .sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); });
  var useAll = !ms.length;
  if (useAll) ms = metricsSorted().slice(-5);
  var med = ms.length ? median(ms.map(function (m) { return Number(m.views) || 0; })) : 0;
  var nextMon = addDays(p.mon, 7), nextSun = addDays(nextMon, 6);
  var next = DB.schedule.filter(function (s) { return inRange(s.date, iso(nextMon), iso(nextSun)); })
    .sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); });
  var L = [];
  L.push('# 内容周报 · ' + fmtMD(p.monISO) + ' – ' + fmtMD(p.sunISO));
  L.push('');
  L.push('> 金佳信 · 内容运营 | 导出时间 ' + iso(today()) + ' ' + new Date().toTimeString().slice(0, 5));
  L.push('');
  L.push('## 一、本周发布（' + pub.length + ' 条）');
  if (!pub.length) L.push('- 本周没有排期。');
  else pub.forEach(function (s) {
    L.push('- ' + fmtMD(s.date) + ' ' + s.plat + '《' + s.title + '》· ' + s.status);
  });
  L.push('');
  L.push('## 二、数据（' + ms.length + ' 条' + (useAll ? '，本周没有新数据，取最近录入' : '') + '）');
  if (!ms.length) L.push('- 还没有录数据。');
  else {
    L.push('| 内容 | 平台 | 播放 | 互动率 | 涨粉 | 判定 |');
    L.push('| --- | --- | ---: | ---: | ---: | --- |');
    ms.forEach(function (r) {
      var vd = verdictOf(r, med);
      L.push('| ' + r.title + ' | ' + r.plat + ' | ' + num(r.views) + ' | ' + rateOf(r).toFixed(2) + '% | ' +
        num(r.fans) + ' | ' + vd.label + (vd.mult ? ' ' + vd.mult.toFixed(1) + 'x' : '') + ' |');
    });
    L.push('');
    L.push('合计：播放 ' + num(sum(ms, function (r) { return r.views; })) +
      '，涨粉 ' + num(sum(ms, function (r) { return r.fans; })) +
      '，中位播放 ' + num(med) + '。');
  }
  L.push('');
  L.push('## 三、复盘结论');
  metricConclusion().slice(0, 4).forEach(function (x, i) { L.push((i + 1) + '. ' + x); });
  L.push('');
  L.push('## 四、下周计划（' + next.length + ' 条）');
  if (!next.length) L.push('- 还没排下周内容，建议先把 3 条排上去。');
  else next.forEach(function (s) {
    L.push('- ' + fmtMD(s.date) + ' ' + s.plat + '《' + s.title + '》· ' + s.status);
  });
  L.push('');
  L.push('## 五、待办');
  L.push('- 素材卡在流程里：' + DB.assets.filter(function (a) { return a.status !== '已发'; }).length + ' 条');
  L.push('- 选题待评估 / 待采纳：' + DB.ideas.filter(function (i) { return i.status === '待评估' || i.status === '已采纳'; }).length + ' 条');
  var risky = DB.ideas.filter(function (i) { return scanText(i.title + ' ' + i.hook).by[1].length > 0; }).length;
  L.push('- 有红线词待改的选题：' + risky + ' 条');
  L.push('');
  L.push('---');
  L.push('本文件由「运营工作台 2.0」本地生成，数据来自浏览器 localStorage。');
  return L.join('\n');
}

  toast('复用 ' + a.reuse + ' 次，去一鱼多吃生成新版本');
};

  UI.remixAsset = id;

};
ACTIONS['asset:del'] = function (id) {

/* 检查清单 */
ACTIONS['check:plat'] = function (p) { UI.checkPlat = p; renderView(); };
ACTIONS['check:toggle'] = function (idx) {
  var p = UI.checkPlat;
  var arr = checkedOf(p).slice();
  var i = Number(idx);
  var pos = arr.indexOf(i);
  if (pos >= 0) arr.splice(pos, 1); else arr.push(i);
  arr.sort(function (a, b) { return a - b; });
  DB.checklist[p] = arr;
  save(); renderView();
};

/* 数据 */
ACTIONS['metric:new'] = function () { UI.metricOpen = !UI.metricOpen; renderView(); };
ACTIONS['metric:switch'] = function (m) { UI.metric = m; renderView(); };
ACTIONS['metric:sort'] = function (m) { UI.metricSort = m; renderView(); };
ACTIONS['metric:add'] = function () {
  var title = val('mf-title').trim();
  if (!title) { toast('先写内容标题', 'err'); return; }
  DB.metrics.push({
    id: uid('m'), seed: false, title: title, plat: val('mf-plat') || '抖音',
    date: val('mf-date') || iso(today()),
    views: valNum('mf-views'), likes: valNum('mf-likes'), comments: valNum('mf-comments'),
    shares: valNum('mf-shares'), fans: valNum('mf-fans')
  });
  save(); UI.metricOpen = false; renderView();
  toast('录入了，趋势图和结论已更新');
};
function normalizeDate(s) {
  s = String(s || '').trim().replace(/[./]/g, '-');
  var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return m[1] + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[3]).padStart(2, '0');
  return '';
}
ACTIONS['metric:csv'] = function () {
  var txt = val('mf-csv').trim();
  if (!txt) { toast('先把 CSV 粘进文本框', 'err'); return; }
  var lines = txt.split(/\r?\n/), n = 0;
  lines.forEach(function (line) {
    if (!line.trim()) return;
    var c = line.split(/[,\t]/).map(function (x) { return x.trim(); });
    if (!c[0]) return;
    if (c[0].indexOf('标题') >= 0 || c[0].indexOf('内容') === 0) return;
    var date = iso(today());
    var nums;
    if (c[1] && normalizeDate(c[1])) { date = normalizeDate(c[1]); nums = c.slice(2); }
    else nums = c.slice(1);
    DB.metrics.push({
      id: uid('m'), seed: false, title: c[0], plat: '抖音', date: date,
      views: Number(nums[0]) || 0, likes: Number(nums[1]) || 0, comments: Number(nums[2]) || 0,
      shares: Number(nums[3]) || 0, fans: Number(nums[4]) || 0
    });
    n++;
  });
  if (!n) { toast('没读到有效行，看看列顺序对不对', 'err'); return; }
  save(); UI.metricOpen = false; renderView();
  toast('导入 ' + n + ' 条数据');
};
ACTIONS['metric:del'] = function (id) {
  var r = DB.metrics.filter(function (m) { return m.id === id; })[0];
  if (!r) return;
  openConfirm({
    title: '删掉这条数据？', body: '《' + r.title + '》' + r.date + '。删了趋势图会跟着变。',
    okText: '删除', onOk: function () {
      DB.metrics = DB.metrics.filter(function (m) { return m.id !== id; });
      save(); renderView(); toast('删掉了');
    }
  });
};

/* 拆解 */

ACTIONS['tear:make'] = function (id) {

/* 合规 */
ACTIONS['input:compliance'] = function (v) {

/* 数据管理 */
ACTIONS['manage:export'] = function () {
  var payload = {
    app: 'ops-workbench-v2', seedVersion: SEED_VERSION,
    exportedAt: new Date().toISOString(), db: DB
  };
  downloadText('运营工作台备份_' + iso(today()) + '.json', JSON.stringify(payload, null, 2), 'application/json');

ACTIONS['manage:pick'] = function () {
  var f = document.getElementById('importFile');
  if (f && f.click) f.click();
};
ACTIONS['change:manage:import'] = function (_, el) {
  var file = el && el.files && el.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    var parsed = null;
    try { parsed = JSON.parse(reader.result); } catch (e) { toast('这个文件不是 JSON', 'err'); return; }
    var incoming = parsed && parsed.ideas ? parsed : (parsed && parsed.db ? parsed.db : null);
    if (!incoming || !Array.isArray(incoming.ideas)) { toast('文件里没有 workbench 数据', 'err'); return; }
    openConfirm({
      title: '用这份备份覆盖当前数据？',
      body: '当前有 ' + DB.ideas.length + ' 条选题、' + DB.metrics.length + ' 条数据。导入后会被文件里的记录替换，想保留就先导出。',
      okText: '覆盖导入', onOk: function () {
        DB = withDefaults(incoming);
        DB.seedVersion = SEED_VERSION;
        save(); UI.module = 'dash'; renderView();
        toast('导入完成');
      }
    });
  };
  reader.readAsText(file);
  if (el) el.value = '';
};
ACTIONS['manage:clear'] = function () {
  openConfirm({
    title: '清空全部数据？',
    body: '选题、数据、素材、排期、拆解、勾选记录都会被删掉，不可恢复。建议先导出 JSON。',
    okText: '全部清空', onOk: function () {
      DB = {
        seedVersion: SEED_VERSION, ideas: [], metrics: [], teardowns: [], assets: [],
        schedule: [], checklist: {}, prefs: { module: 'dash' }
      };

      toast('已清空。想恢复示例数据去「数据管理」点恢复。');

  });
};
ACTIONS['manage:reset'] = function () {
  openConfirm({
    title: '恢复示例数据？',
    body: '会用当前版本的种子数据替换自带的示例，你自己录的选题、数据、素材都保留。',
    okText: '恢复示例', danger: false, onOk: function () {
      DB = mergeSeeds(DB);
      UI.selEvent = null; UI.editIdea = null; UI.ideaEdit = null;
      save(); renderView(); toast('示例数据恢复了，自己的记录都在');
    }
  });
};

/* ============================================================
   拖拽排期
   ============================================================ */
var DRAG_ID = null;
function bindDragOnce() {
  function closestEl(t, sel) {
    while (t && t !== document) {
      if (t.classList && t.classList.contains(sel)) return t;
      t = t.parentNode;
    }
    return null;
  }
  document.addEventListener('dragstart', function (e) {
    var el = closestEl(e.target, 'cal-ev');
    if (!el) return;
    DRAG_ID = el.getAttribute('data-arg');
    try { e.dataTransfer.setData('text/plain', DRAG_ID); e.dataTransfer.effectAllowed = 'move'; } catch (x) {}
    el.style.opacity = '.4';
  });
  document.addEventListener('dragend', function (e) {
    var el = closestEl(e.target, 'cal-ev');
    if (el) el.style.opacity = '';
    DRAG_ID = null;
  });
  document.addEventListener('dragover', function (e) {
    var day = closestEl(e.target, 'cal-day');
    if (!day) return;
    e.preventDefault();
    day.classList.add('drop-on');
  });
  document.addEventListener('dragleave', function (e) {
    var day = closestEl(e.target, 'cal-day');
    if (day) day.classList.remove('drop-on');
  });
  document.addEventListener('drop', function (e) {
    var day = closestEl(e.target, 'cal-day');
    if (!day || !DRAG_ID) return;
    e.preventDefault();
    var date = day.getAttribute('data-drop');
    day.classList.remove('drop-on');
    if (date) moveEvent(DRAG_ID, date);
  });
}

/* ============================================================
   启动
   ============================================================ */
function boot() {
  bindGlobal();
  bindDragOnce();
  load();
  UI.calAnchor = iso(today());
  UI.selDate = iso(today());
  if (!UI.remixAsset && !UI.remixTitle && DB.assets.length) UI.remixAsset = DB.assets[0].id;
  var hash = '';
  try { hash = (location.hash || '').replace('#', ''); } catch (e) {}
  var start = 'dash';
  if (hash && moduleById(hash).id === hash) start = hash;
  else if (DB.prefs && DB.prefs.module && moduleById(DB.prefs.module).id === DB.prefs.module) start = DB.prefs.module;
  UI.module = start;
  renderView();
  updateMeta();
}
try {
  if (typeof window !== 'undefined') {
    window.__OPS__ = {
      version: SEED_VERSION, KEY: KEY, MODULES: MODULES,
      getDB: function () { return DB; },
      getUI: function () { return UI; },
      go: go, renderView: renderView, save: save, load: load,
      ACTIONS: ACTIONS,
      scoreIdea: scoreIdea, scanText: scanText,
      seedCounts: function () {
        var s = seedDB();
        return { ideas: s.ideas.length, metrics: s.metrics.length, teardowns: s.teardowns.length, assets: s.assets.length, schedule: s.schedule.length };
      },
      demo: DEMO_COMP
    };
  }
} catch (e) {}
boot();

</script>
